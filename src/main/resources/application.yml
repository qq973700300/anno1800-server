server:
  port: 8080
  tomcat:
    threads:
      max: 200

spring:
  application:
    name: anno1800-server

  # 静态资源协商缓存：每次都向服务端确认版本（文件变了拿新版，没变 304）。
  # 不加这个浏览器会启发式缓存 game.html 好几个小时，前端一更新玩家就在玩旧页面
  # （症状：新按钮 / 新布局怎么都不出现）。开发期必须有。
  web:
    resources:
      cache:
        cachecontrol:
          no-cache: true

  # ============ 默认：MySQL（网络游戏主存） ============
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/anno1800?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&rewriteBatchedStatements=true
    username: root
    password: ""
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 5000
      idle-timeout: 600000
      max-lifetime: 1800000

  task:
    # 定时任务线程池：默认只有 1 个线程，心跳和全服广播会互相排队，
    # 广播一旦耗时就会把心跳挤后，世界推进速度跟不上现实时间（作物长得慢）。
    # 给 4 个线程后两者互不阻塞。
    scheduling:
      pool:
        size: 4

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        # 网络游戏关键点：批处理写库，减少数据库 round-trip
        jdbc:
          batch_size: 50
        order_updates: true

  # 单机调试用 H2：启动时加 --spring.profiles.active=h2（见 application-h2.yml）

# —— 世界参数：想让游戏更快/更慢只改这里 ——
anno:
  # 世界心跳间隔（毫秒）：作物生长、建筑生产按此推进
  tick-ms: 1000
  # 全服广播间隔（毫秒）：联机客户端同步频率
  broadcast-ms: 3000
  # 时间加速倍率：1 = 现实速度，10 = 游戏内 10 倍速
  time-scale: 1.0
  # 市场价格回归速度（每次 tick 向基准价回归的比例）
  market-revert-rate: 0.02
  # 市场价格随机波动幅度（0.03 = ±3%）
  market-noise: 0.03
  # 成交冲击系数：每成交 100 单位推动价格变动比例
  market-impact: 0.05
  # 新玩家初始资金
  start-treasury: 5000
  # ===== 行情与落库策略（高频数据走内存 + 定期批量落库） =====
  # 价格落库间隔（毫秒）：行情每 tick 在内存里变动，每隔这么久才批量写库 + 记录一条快照
  price-flush-ms: 5000
  # 行情快照保留时长（小时），超时数据由清理任务删除，避免时序表无限膨胀
  price-history-hours: 24

  # ===== 懒结算（模拟只在玩家在线时推进） =====
  # 离线宽限（毫秒）：玩家不在线时他的岛**停止模拟** —— 作物不长、工厂不产、
  # 居民不吃不缴税、商船也不跑；掉线时长超过这个宽限的部分一律冻结。
  # 留一段宽限是因为切后台/网络抖动几秒是常态，一断线就冻结会让人觉得"白等了"。
  # 它同时是单次推进的上限（服务端卡顿或休眠唤醒后不会一次推进一大截）。
  # 设成 0 = 严格冻结；设得很大 = 回到"离线也在跑"的老行为（1 万在线时不要这么干）。
  offline-grace-ms: 5000

  # ===== 岛屿网格（修路 / 摆建筑 / 种地共用同一张方格图） =====
  # 网格边长（格）：这是**画布尺寸**，不是陆地面积 —— 海里有几成陆地由下面的 terrain 决定。
  # 22×22（484 格）时岛小得像个沙盘；36×36（1296 格）能跑通玩法但一眼望到头；
  # 56×56（3136 格、可建平原约 1700 格）仍显局促；
  # 80×80（6400 格、可建平原约 3300 格）才有"一座大岛"的纵深：
  # 港口、居民区、成片农田、一圈厂房各占一块，中间还留得下路网和广场，且各区间有过渡带。
  # 改这个值会**整体作废地形缓存并重算所有岛的地形**（见 TerrainService.resolve，尺寸对不上就重生成），
  # 老存档里已建的马路/建筑坐标不会跟着搬 —— 想干净地看新地图，用新公司名开一座新岛。
  grid-size: 120
  # 海岸带宽度（格）：**离水不超过这么几格的陆地**是沙滩，**贸易站（港口）只能建在沙滩上**，且门自动朝海。
  # 注意是"离水步数"而不是"网格最外几圈"：岛形不规则，网格最外一圈大多本来就是水。
  # 设成 0 = 关掉这条规则（贸易站退回"跟厂房一样沿路就能建"），老存档不会被卡住。
  # 【2 而不是 1】画面上沙滩要是一条**看得见的沙带**（湿沙 1 圈 + 干沙 1 圈 + 沙草过渡 1 圈），
  # 1 圈只有 1.7 个世界单位宽，默认镜头下就是一条细边，读不出"沙滩"；
  # 客户端的沙滩渲染宽度同样取 max(2, 这个值)，两边口径保持一致。
  coast-width: 2
  # 每座岛最多能种多少块作物。岛变大了，这个上限也得跟着涨 ——
  # 岛从 56 格放大到 80 格、再到 120 格，平原面积翻了又翻，这个上限也得跟着涨 ——
  # 否则几千格平原上只让种一百来株，农田区一眼就满了。
  plot-limit: 250

  # ===== 地形：岛的轮廓 / 山地 / 矿脉 =====
  # 地形是**算出来的**：种子由岛屿 id 决定，同一座岛永远长同一个样子，
  # 所以不必手工画地图，也随时能复现（响应里的 terrainSeed 就是它）。
  terrain:
    # 陆地占比（占整张网格）：0.62 意味着近四成是水 —— 岸线曲折、留出港湾，又不会把可建地挤没
    land-ratio: 0.62
    # 山地占陆地的比例：山体堆在岛心，把它周围的平原切成"山脚地"
    mountain-ratio: 0.13
    # 矿脉条数（每条 4~8 格，撒在山脚下、离岸至少 2 格，每种矿总面积不超过平原的 10%）
    # 黏土矿坑要压在黏土矿脉上，铁矿要压在铁矿脉上 —— 设成 0 就没了矿，那两种建筑也就建不出来
    # 岛从 56 格放大到 80 格、再到 120 格之后平原多了几倍，矿脉也得跟着加，否则矿点稀疏、够不到用
    iron-veins: 12
    clay-veins: 12

  # ===== 居民经济（港口 → 住宅 → 居民需求 → 税收） =====
  # 人口结算周期（游戏秒）：需求按"每人每分钟"计，攒够一个周期再一次性结算，
  # 否则每秒 0.16 个土豆会被取整抹成 0，东西永远消耗不掉。
  # 调小会让消耗因取整而偏大（10 秒时 1.6 会凑成 2），调大则人口涨落更迟钝。
  resident-settle-seconds: 30

logging:
  level:
    com.anno: INFO
