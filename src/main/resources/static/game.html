  if (side === 0) out.push(_edgeBox(CELL, .06, s, 0, W, -HALF + s / 2));
  if (side === 1) out.push(_edgeBox(s, .06, CELL, HALF - s / 2, W, 0));
  if (side === 2) out.push(_edgeBox(CELL, .06, s, 0, W, HALF - s / 2));
  if (side === 3) out.push(_edgeBox(s, .06, CELL, -HALF + s / 2, W, 0));
}

const roadEdgeCache = new Map();   // mask -> { edge:[curbGeo, drainGeo], walk:[walkGeo] }
/** 按 4 位邻居掩码取合并好的边条几何（mask 位：1上 2右 4下 8左，与 roadSurfGeo 同一套）。
    缓存的几何**不能**进 roadOwnedGeo —— clearOwned 会把它 dispose 掉。 */
function roadEdgeGeo(mask) {
  let g = roadEdgeCache.get(mask);
  if (!g) {
    const curb = [], drain = [], walk = [];
    for (let side = 0; side < 4; side++) if (!(mask & (1 << side))) { edgeStrips(side, curb, drain); edgeWalk(side, walk); }
    g = {
      edge: mergeGeometries([...curb, ...drain], true),   // 两个材质组：[curbMat, drainMat]
      walk: walk.length ? mergeGeometries(walk, false) : null,
    };
    roadEdgeCache.set(mask, g);
  }
  return g;
}

/* ---- 夜景灯光 ----
   路灯 / 港口桅灯共用自发光材质：白天 emissiveIntensity=0，就是一盏铁灯；
   入夜在主循环里统一拉亮。建筑窗户不再有程序化窗块（已取消，等 Blender 材质方案）。 */
const LAMP_MAT    = new THREE.MeshStandardMaterial({ color:0x4a4038, emissive:0xffd9a0, emissiveIntensity:0, roughness:.5 });
const lampPostMat = new THREE.MeshStandardMaterial({ color:0x3a3f45, roughness:.7, metalness:.3 });
const lampPostGeo = new THREE.CylinderGeometry(0.045, 0.06, 0.95, 6);   // 铸铁灯杆（底部略粗）
lampPostGeo.translate(0, 0.95 / 2, 0);
const lampHeadGeo = new THREE.SphereGeometry(0.11, 8, 6);               // 煤气灯灯头

/* 路灯三代（跟路面档次走）：土路 = 木杆油灯，石板/砖路 = 铸铁煤气灯，
   林荫大道 = 双头煤气灯。灯头都挂 LAMP_MAT，入夜一起亮。 */
const lampWoodMat = new THREE.MeshStandardMaterial({ color:0x6e5638, roughness:.9 });
const lampWoodPostGeo = new THREE.CylinderGeometry(0.05, 0.07, 0.85, 5);
lampWoodPostGeo.translate(0, 0.85 / 2, 0);
const lampWoodHeadGeo = new THREE.BoxGeometry(0.15, 0.17, 0.15);
lampWoodHeadGeo.translate(0, 0.85 + 0.08, 0);
const lampPost2Geo = new THREE.CylinderGeometry(0.05, 0.07, 1.18, 6);   // 大道双头灯：更高一根
lampPost2Geo.translate(0, 1.18 / 2, 0);
const lampArmGeo = new THREE.CylinderGeometry(0.028, 0.028, 0.34, 6);   // 弯臂（水平摆）
const lampArmY = 1.18 + 0.02;

/* ---- 动态路灯照明 ----
   自发光灯头只是"灯自己亮"，照不亮地面 —— 真照明得有点光源。但路网一撒
   几十根灯，每根挂一盏 PointLight 性能吃不消，所以用**灯池**：
   固定 8 盏无阴影 PointLight，每帧按"离视线中心最近"分给路网里的灯位，
   没分到的灯夜里只是一颗亮珠，分到的才真的照亮周围一圈。
   buildRoads 重建路网时收集灯位（lampPositions），主循环里分配（见"入夜点灯"）。 */
const lampPositions = [];
const lampLights = [];
for (let i = 0; i < 8; i++) {
  const l = new THREE.PointLight(0xffc98a, 0, 4.6, 1.7);   // 暖光、不投影、距离 4.6 格
  scene.add(l);
  lampLights.push(l);
}
window.__annoLampLights = () => ({ pool: lampLights.length, lamps: lampPositions.length,
  lit: lampLights.reduce((n, l) => n + (l.intensity > 0 ? 1 : 0), 0) });

/**
 * 路面轮廓：中心方块 + 朝每个"有路的邻居"伸出一条等宽车道。
 * 参数是形状平面的上下左右，对应世界的 z- / x+ / z+ / x-。
 * 4 个方向的组合会自然拼出 直线 / 拐角 / T 字 / 十字，共 16 种形态。
 */
function roadOutline(up, right, down, left) {
  const pts = [[-RW, -RW]];
  if (left)  pts.push([-HALF, -RW], [-HALF, RW]);
  pts.push([-RW, RW]);
  if (up)    pts.push([-RW, HALF], [RW, HALF]);
  pts.push([RW, RW]);
  if (right) pts.push([HALF, RW], [HALF, -RW]);
  pts.push([RW, -RW]);
  if (down)  pts.push([RW, -HALF], [-RW, -HALF]);

  const s = new THREE.Shape();
  s.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) s.lineTo(pts[i][0], pts[i][1]);
  s.closePath();
  return s;
}

/* ---- 路形几何缓存 ----
   roadOutline 一共只有 2⁴ = 16 种形态。旧版每次重建路网都为每格现裁一个
   ShapeGeometry，几百格的路 = 几百个几何体，批量铺路后那一下"卡"有它一份。
   按 4 位邻居掩码缓存，全部复用同一批几何（注意：缓存的几何绝不能进
   roadOwnedGeo，clearOwned 会把它 dispose 掉）。 */
const roadSurfGeoCache = new Map();
function roadSurfGeo(up, right, down, left) {
  const k = (up ? 1 : 0) + (right ? 2 : 0) + (down ? 4 : 0) + (left ? 8 : 0);
  let g = roadSurfGeoCache.get(k);
  if (!g) {
    g = new THREE.ShapeGeometry(roadOutline(!!(k & 1), !!(k & 2), !!(k & 4), !!(k & 8)));
    roadSurfGeoCache.set(k, g);
  }
  return g;
}

function buildRoads() {
  clearOwned(roadGroup, roadOwnedGeo);
  roadSet.clear(); roadKindMap.clear(); pickRoads.length = 0; lampPositions.length = 0;   // 灯位跟着路网重建重收
  for (const r of S.roads) {
    roadSet.add(keyOf(r.cellX, r.cellZ));                          // 先收齐，轮廓要查四邻
    roadKindMap.set(keyOf(r.cellX, r.cellZ), r.kind);
  }

  for (const r of S.roads) {
    const [x, z] = cellToWorld(r.cellX, r.cellZ);
    const g = new THREE.Group(); g.position.set(x, TOP_Y + cellH(r.cellX, r.cellZ), z);
    g.userData = { cellX:r.cellX, cellZ:r.cellZ, kind:r.kind, lamp:null, curb:false, walk:false };
    const cell = { kind:'cell', x:r.cellX, z:r.cellZ };
    const rk = ROAD_KIND(r.kind);                       // 这段路铺的什么路面

    // ① 路基：铺满整格（相邻两格严丝合缝，远看是一整条路）
    const bed = new THREE.Mesh(roadBedGeo, roadBedMat);
    bed.position.y = ROAD_H - 0.08; bed.userData = cell;
    g.add(bed); pickRoads.push(bed);

    // ② 路面：按四邻裁出的形状（拐角 / T 字 / 十字都靠自己拼），材质按路面档次
    const up    = roadSet.has(keyOf(r.cellX, r.cellZ - 1));
    const right = roadSet.has(keyOf(r.cellX + 1, r.cellZ));
    const down  = roadSet.has(keyOf(r.cellX, r.cellZ + 1));
    const left  = roadSet.has(keyOf(r.cellX - 1, r.cellZ));
    const mask  = (up ? 1 : 0) + (right ? 2 : 0) + (down ? 4 : 0) + (left ? 8 : 0);
    const surfGeo = roadSurfGeo(up, right, down, left);
    const surf = new THREE.Mesh(surfGeo, rk.mat);
    surf.rotation.x = -Math.PI / 2; surf.position.y = ROAD_H + 0.006;
    surf.userData = cell;
    g.add(surf); pickRoads.push(surf);   // surfGeo 是缓存的共享几何，不能进 roadOwnedGeo
    g.userData.surfHex = '#' + rk.surf.toString(16).padStart(6, '0');

    // ③ 格心的一块踏石：路口处自然形成铺装广场的观感
    const slab = new THREE.Mesh(roadSlabGeo, rk.slabMat);
    slab.position.y = ROAD_H + 0.014; slab.userData = cell;
    g.add(slab); pickRoads.push(slab);

    // ③b 开口边的路牙 + 排水沟（林荫大道换成更宽的人行道）：
    //     没有路邻居的那几条边收个边，路才不像"画上去的色块"
    if (mask !== 15) {
      const eg = roadEdgeGeo(mask);
      if (r.kind === 'BOULEVARD' && eg.walk) {
        const walk = new THREE.Mesh(eg.walk, walkMat);
        walk.userData = cell; g.add(walk);
        g.userData.walk = true;
      } else if (eg.edge) {
        const edge = new THREE.Mesh(eg.edge, [curbMat, drainMat]);
        edge.userData = cell; g.add(edge);
        g.userData.curb = true;
      }
    }

    /* ④ 街灯：按格坐标确定性撒（约 1/7 的路格有一根，同一张路网每次重建长一样的灯），
       灯型跟路面档次走（土路木杆油灯 / 石板砖路铸铁煤气灯 / 大道双头煤气灯），
       灯头共用 LAMP_MAT 入夜点亮。不进 pickRoads —— 灯是装饰，点了不该选中什么。 */
    if (hash2(r.cellX * 3 + 11, r.cellZ * 5 - 7) > 0.86) {
      const lx = CELL * 0.34, lz = CELL * 0.34;
      if (r.kind === 'BOULEVARD') {
        const post = new THREE.Mesh(lampPost2Geo, lampPostMat);
        post.position.set(lx, ROAD_H, lz);
        g.add(post); roadOwnedGeo.push(lampPost2Geo);
        for (const sgn of [-1, 1]) {                    // 左右两根弯臂 + 两个灯头
          const arm = new THREE.Mesh(lampArmGeo, lampPostMat);
          arm.rotation.z = Math.PI / 2 * sgn;
          arm.position.set(lx + sgn * 0.17, ROAD_H + lampArmY, lz);
          const head = new THREE.Mesh(lampHeadGeo, LAMP_MAT);
          head.position.set(lx + sgn * 0.32, ROAD_H + lampArmY, lz);
          g.add(arm, head); roadOwnedGeo.push(lampArmGeo, lampHeadGeo);
        }
        lampPositions.push(new THREE.Vector3(x, TOP_Y + cellH(r.cellX, r.cellZ) + ROAD_H + lampArmY, z));
        g.userData.lamp = 'double';
      } else if (r.kind === 'DIRT') {
        const post = new THREE.Mesh(lampWoodPostGeo, lampWoodMat);
        post.position.set(lx, ROAD_H, lz);
        const head = new THREE.Mesh(lampWoodHeadGeo, LAMP_MAT);
        head.position.set(lx, ROAD_H, lz);
        g.add(post, head); roadOwnedGeo.push(lampWoodPostGeo, lampWoodHeadGeo);
        lampPositions.push(new THREE.Vector3(
          x + lx, TOP_Y + cellH(r.cellX, r.cellZ) + ROAD_H + 0.92, z + lz));
        g.userData.lamp = 'wood';
      } else {
        const post = new THREE.Mesh(lampPostGeo, lampPostMat);
        post.position.set(lx, ROAD_H, lz);
        const head = new THREE.Mesh(lampHeadGeo, LAMP_MAT);
        head.position.set(lx, ROAD_H + 0.99, lz);
        g.add(post, head); roadOwnedGeo.push(lampPostGeo, lampHeadGeo);
        lampPositions.push(new THREE.Vector3(
          x + lx, TOP_Y + cellH(r.cellX, r.cellZ) + ROAD_H + 0.99, z + lz));
        g.userData.lamp = 'iron';
      }
    }

    roadGroup.add(g);
  }
  refreshPickables();
}
const hasRoad = (x, z) => roadSet.has(keyOf(x, z));

/* ============================================================
   拖拽拉线铺路 —— 纪元1800 那套：点下起点、拖出去、松手成一条直线。
   （以前是"按住一路蹭过去"的画笔式：手一抖路就歪，一格一格点更累。）
   ============================================================ */

const roadGhostGroup = new THREE.Group(); island.add(roadGhostGroup);
const roadGhostGeo    = new THREE.BoxGeometry(CELL * 0.98, 0.04, CELL * 0.98);
const roadGhostOkMat  = new THREE.MeshBasicMaterial({ color:0x86cc72, transparent:true, opacity:.5, depthWrite:false });
const roadGhostBadMat = new THREE.MeshBasicMaterial({ color:0xd4736a, transparent:true, opacity:.5, depthWrite:false });
let roadGhosts = [];        // 预览方块池：拖动时只改位置和材质，不反复建几何

/**
 * 起点 → 终点的格子序列，**锁定到较长的那个轴** —— 所以只会横着长或竖着长。
 * 斜着拖不会拉出一条阶梯状的斜路，那正是"一格一格点"最难受的地方。
 */
function roadLineCells(a, b) {
  const dx = b.x - a.x, dz = b.z - a.z;
  const horizontal = Math.abs(dx) >= Math.abs(dz);
  const n = horizontal ? Math.abs(dx) : Math.abs(dz);
  const sx = Math.sign(dx), sz = Math.sign(dz);
  const out = [];
  for (let i = 0; i <= n; i++) {
    out.push(horizontal ? { x:a.x + sx * i, z:a.z } : { x:a.x, z:a.z + sz * i });
  }
  return out;
}

/**
 * 这条线上最终要铺哪几格。四种情况分开处理：
 * <ul>
 *   <li>已经是马路、路面也一样 → **跳过**：不重复建也不重复收钱，可以从现有路网接着往外拖；</li>
 *   <li>已经是马路、但手里的路面不一样 → **改铺**：收差价（restyle），拉一遍线就能给旧路换装；</li>
 *   <li>铺不了（水/山/建筑/耕地）→ **就此截断**，后面的全不要（和纪元1800一样，路到障碍为止）；</li>
 *   <li>钱不够 → 同样截断。</li>
 * </ul>
 * 每项都带 ok/skip/restyle 标记，预览方块据此上色。
 */
function planRoadLine(cells) {
  const plan = [];
  let money = S.treasury;
  const kind = (S.place && S.place.roadKind) || 'DIRT';
  const cost = ROAD_KIND(kind).cost;
  const fee  = Math.max(0, cost - ROAD_KINDS.DIRT.cost);   // 改铺差价（与服务端 restyleCost 同式）
  for (const c of cells) {
    if (hasRoad(c.x, c.z)) {
      if ((roadKindMap.get(keyOf(c.x, c.z)) || 'DIRT') === kind) {
        plan.push({ x:c.x, z:c.z, skip:true }); continue;
      }
      if (fee > money) { plan.push({ x:c.x, z:c.z, ok:false, why:'金库不够改铺这一段' }); break; }
      money -= fee;
      plan.push({ x:c.x, z:c.z, ok:true, restyle:true });
      continue;
    }
    const chk = canRoadAt(c.x, c.z);
    if (!chk.ok) { plan.push({ x:c.x, z:c.z, ok:false, why:chk.why }); break; }
    if (cost > money) { plan.push({ x:c.x, z:c.z, ok:false, why:'金库不够铺完这一段' }); break; }
    money -= cost;
    plan.push({ x:c.x, z:c.z, ok:true });
  }
  return plan;
}

function drawRoadGhost(plan) {
  hidePlaceGhost();          // 单格幽灵让位给整条线
  while (roadGhosts.length < plan.length) {
    const m = new THREE.Mesh(roadGhostGeo, roadGhostOkMat);
    roadGhostGroup.add(m); roadGhosts.push(m);
  }
  roadGhosts.forEach((m, i) => {
    const c = plan[i];
    m.visible = !!c;
    if (!c) return;
    const [x, z] = cellToWorld(c.x, c.z);
    m.position.set(x, TOP_Y + cellH(c.x, c.z) + 0.12, z);
    m.material = c.ok === false ? roadGhostBadMat : roadGhostOkMat;
  });
}

function clearRoadGhost() { for (const m of roadGhosts) m.visible = false; }

/**
 * 把"光标下那一格"的幽灵收起来。
 * 拉线时必须收 —— 否则按下左键那一刻，上一帧留下的单格幽灵会**冻在起点**不动，
 * 看着像有一格已经铺好了（其实还没提交）。松手后 updatePlaceGhost 会把它恢复。
 */
function hidePlaceGhost() {
  ghostGroup.visible = fpBox.visible = fpEdge.visible = fpDoor.visible = false;
  S.hoverCheck = null;
}

/** 拖动中：重算直线 → 重画预览 → 更新提示条。只在"这条线变了"时才动 DOM */
function updateRoadDrag(cx, cy) {
  const d = drag && drag.road;
  if (!d) return;
  const cell = cellAtPointer(cx, cy);
  S.hoverCell = cell;
  if (!cell) return;
  const plan = planRoadLine(roadLineCells(d.start, cell));
  const todo = plan.filter(c => c.ok).length;
  if (todo === d.todo && plan.length === d.len) return;
  d.plan = plan; d.todo = todo; d.len = plan.length;
  drawRoadGhost(plan);
  renderRoadDragHint(plan);
}

/** 松手：整条线走**批量接口**一次铺完。
    旧版逐格 await 单格接口：20 格 = 20 次**串行**往返，松手后画面毫无反馈，
    最后再补一次全量重建 —— "卡一下才出道路"就是这两段叠出来的。
    现在只有一次往返 + 一个服务端事务；撞第一个障碍就停（部分成功），
    语义和逐格发一模一样，只是快了一个数量级。 */
async function commitRoadDrag() {
  const d = drag && drag.road;
  if (!d) return;
  clearRoadGhost();
  const plan = d.plan || [];
  const todo = plan.filter(c => c.ok);
  if (!todo.length) {
    const bad = plan.find(c => c.ok === false);
    if (bad) toast(bad.why, 'bad');
    return;
  }
  const kind = (S.place && S.place.roadKind) || 'DIRT';
  const buildCells   = todo.filter(c => !c.restyle).map(c => ({ x: c.x, z: c.z }));
  const restyleCells = todo.filter(c =>  c.restyle).map(c => ({ x: c.x, z: c.z }));
  let built = 0, restyled = 0, failMsg = null;
  try {
    if (buildCells.length) {
      const r = await api('/api/roads/batch', 'POST', {
        playerId: S.playerId, islandId: S.island.id, kind,
        cells: buildCells,
      });
      for (const road of (r.built || [])) {
        afterRoadPainted({ x: road.cellX, z: road.cellZ }, road);
        built++;
      }
      failMsg = r.stop || failMsg;
    }
    if (restyleCells.length) {
      const r = await api('/api/roads/restyle', 'POST', {
        playerId: S.playerId, islandId: S.island.id, kind, cells: restyleCells,
      });
      restyled = r.restyled || 0;
      failMsg = r.stop || failMsg;
    }
  } catch (err) { failMsg = err.message; }
  /* 整条建完统一重建一次 —— 逐格重建的话 20 格的线要重画 20 遍路网 */
  buildRoads(); syncNpcs(); buildTrees();
  renderHud(); renderPlaceBar();
  if (failMsg)           toast(`铺了 ${built + restyled} 格就停了：${failMsg}`, 'bad');
  else if (restyled > 0) toast(`新铺 ${built} 格、改铺 ${restyled} 格${ROAD_KIND(kind).label}`, 'good');
  else if (built > 1)    toast(`一口气铺了 ${built} 格${ROAD_KIND(kind).label}`, 'good');
}

/** 拖动中的提示：这条线几格、多少钱、被什么截断了 */
function renderRoadDragHint(plan) {
  const hint = document.getElementById('buildHint');
  if (!hint) return;
  const kind = (S.place && S.place.roadKind) || 'DIRT';
  const cost = ROAD_KIND(kind).cost;
  const fee  = Math.max(0, cost - ROAD_KINDS.DIRT.cost);
  const todo = plan.filter(c => c.ok && !c.restyle).length;
  const restyle = plan.filter(c => c.ok && c.restyle).length;
  const skip = plan.filter(c => c.skip).length;
  const bad = plan.find(c => c.ok === false);
  let s = `正在拉一条${ROAD_KIND(kind).label}：<b style="color:var(--gold)">${todo} 格</b> · ${money(todo * cost)}金`;
  if (restyle) s += ` · 改铺 ${restyle} 格 · ${money(restyle * fee)}金`;
  if (skip) s += `（另有 ${skip} 格已经是这种路面，不重复收费）`;
  if (bad)  s += ` · 到第 ${todo + restyle + 1} 格被挡住：${bad.why}`;
  s += ' · 松手铺下去';
  hint.innerHTML = s;
}

/* ============================================================
   5.4b 划一片区域批量播种 —— 纪元1800 那套：拿稳作物、按左键拖个矩形、
   松手把这一片能种的格子全种上。（一格一格点 30 株土豆太折磨人了。）
   机制与拖拽拉路完全同构：按下记起点格、拖动算矩形规划、松手逐格提交。
   ============================================================ */

const plantGhostGroup = new THREE.Group(); island.add(plantGhostGroup);
const plantGhostOkMat   = new THREE.MeshBasicMaterial({ color:0x9fd06a, transparent:true, opacity:.55, depthWrite:false });
const plantGhostSkipMat = new THREE.MeshBasicMaterial({ color:0xb9b9a8, transparent:true, opacity:.22, depthWrite:false });
const plantGhostBadMat  = new THREE.MeshBasicMaterial({ color:0xd4736a, transparent:true, opacity:.5,  depthWrite:false });
let plantGhosts = [];       // 预览方块池：与 roadGhosts 同一几何，只改位置和材质

const projV = new THREE.Vector3();
/**
 * **屏幕空间**的选区：屏幕矩形四角反投影到地面求世界包围盒，扫其中的格子，
 * 再把每个格心投回屏幕 —— 落在矩形里的才算选中。
 * 【为什么不用格子空间矩形】镜头带 45° 方位角，格子矩形画在屏幕上是个**斜菱形**：
   用户拖的是屏幕上的矩形，选中的却是一条斜带 —— "画的"和"得的"对不上，必被当成 bug。
 * 单击特例：矩形退化成一个点时取光标下那一格（格心投影很少正好压在像素上）。
 */
function cellsInScreenRect(sx0, sy0, sx1, sy1) {
  if (Math.abs(sx1 - sx0) < 5 && Math.abs(sy1 - sy0) < 5) {
    const c = cellAtPointer(sx1, sy1);
    return c ? [c] : [];
  }
  const minX = Math.min(sx0, sx1), maxX = Math.max(sx0, sx1);
  const minY = Math.min(sy0, sy1), maxY = Math.max(sy0, sy1);
  let wx0 = Infinity, wx1 = -Infinity, wz0 = Infinity, wz1 = -Infinity;
  for (const [px, py] of [[minX,minY],[maxX,minY],[maxX,maxY],[minX,maxY]]) {
    ptr.x = (px / innerWidth) * 2 - 1;
    ptr.y = -(py / innerHeight) * 2 + 1;
    ray.setFromCamera(ptr, camera);
    if (!ray.ray.intersectPlane(groundPlane, planeHit)) continue;
    wx0 = Math.min(wx0, planeHit.x); wx1 = Math.max(wx1, planeHit.x);
    wz0 = Math.min(wz0, planeHit.z); wz1 = Math.max(wz1, planeHit.z);
  }
  if (wx0 === Infinity) return [];
  const c = (GRID - 1) / 2;
  const gx0 = Math.max(0, Math.floor(wx0 / CELL + c - 0.5)), gx1 = Math.min(GRID - 1, Math.ceil(wx1 / CELL + c + 0.5));
  const gz0 = Math.max(0, Math.floor(wz0 / CELL + c - 0.5)), gz1 = Math.min(GRID - 1, Math.ceil(wz1 / CELL + c + 0.5));
  const out = [];
  for (let z = gz0; z <= gz1; z++) {
    for (let x = gx0; x <= gx1; x++) {
      const [wx, wz] = cellToWorld(x, z);
      projV.set(wx, TOP_Y, wz).project(camera);
      const px = (projV.x + 1) / 2 * innerWidth, py = (1 - projV.y) / 2 * innerHeight;
      if (px < minX || px > maxX || py < minY || py > maxY) continue;
      out.push({ x, z });
      if (out.length >= 400) return out;   // 防一手把全岛框进去
    }
  }
  return out;
}

/**
 * 这片矩形里最终种哪几格：
 * <ul>
 *   <li>已种了作物 → **跳过**（灰色）：从现有田里接着往外划是常态，不重复收种子钱；</li>
 *   <li>种不了（水 / 山 / 路 / 建筑 / 矿脉）→ 跳过但标红提示第一处障碍 ——
 *       矩形里掺着几格障碍太常见了，为它们截断整片田反而不顺手；</li>
 *   <li>种子钱不够 / 到了耕地上限 → **就此截断**，后面的全不要。</li>
 * </ul>
 */
function planPlantRect(cells) {
  const plan = [];
  let money = S.treasury;
  const seed = placeCost(S.place);
  for (const c of cells) {
    if (plotCells.has(keyOf(c.x, c.z))) { plan.push({ x:c.x, z:c.z, skip:true }); continue; }
    if (seed > money) { plan.push({ x:c.x, z:c.z, ok:false, why:'金库不够种完这一片' }); break; }
    const chk = canPlantAt(c.x, c.z);
    if (!chk.ok) {
      if (chk.why.includes('农田已满')) { plan.push({ x:c.x, z:c.z, ok:false, why:chk.why }); break; }
      plan.push({ x:c.x, z:c.z, ok:false, why:chk.why });
      continue;
    }
    money -= seed;
    plan.push({ x:c.x, z:c.z, ok:true });
  }
  return plan;
}

function drawPlantGhost(plan) {
  hidePlaceGhost();          // 单格幽灵让位给整片田
  while (plantGhosts.length < plan.length) {
    const m = new THREE.Mesh(roadGhostGeo, plantGhostOkMat);
    plantGhostGroup.add(m); plantGhosts.push(m);
  }
  plantGhosts.forEach((m, i) => {
    const c = plan[i];
    m.visible = !!c;
    if (!c) return;
    const [x, z] = cellToWorld(c.x, c.z);
    m.position.set(x, TOP_Y + cellH(c.x, c.z) + 0.12, z);
    m.material = c.ok === false ? plantGhostBadMat : (c.skip ? plantGhostSkipMat : plantGhostOkMat);
  });
}

function clearPlantGhost() { for (const m of plantGhosts) m.visible = false; }

/** 拖动中：重算屏幕矩形选区 → 重画预览 → 更新提示条。只在"这片田变了"时才动 DOM */
function updatePlantDrag(cx, cy) {
  const d = drag && drag.plant;
  if (!d) return;
  S.hoverCell = cellAtPointer(cx, cy);
  const plan = planPlantRect(cellsInScreenRect(d.sx, d.sy, cx, cy));
  const todo = plan.filter(c => c.ok).length;
  if (todo === d.todo && plan.length === d.len) return;
  d.plan = plan; d.todo = todo; d.len = plan.length;
  drawPlantGhost(plan);
  renderPlantDragHint(plan);
}

/** 松手：整片田走**批量接口**一次种完（一次往返 + 一个服务端事务）。
    旧版逐格 await：30 株 = 30 次串行往返；批量后语义不变（撞第一个障碍就停）。 */
async function commitPlantDrag() {
  const d = drag && drag.plant;
  if (!d) return;
  clearPlantGhost();
  const plan = d.plan || [];
  const todo = plan.filter(c => c.ok);
  if (!todo.length) {
    const bad = plan.find(c => c.ok === false);
    if (bad) toast(bad.why, 'bad');
    return;
  }
  let planted = 0, failMsg = null;
  try {
    const r = await api('/api/farm/plant-batch', 'POST', {
      playerId: S.playerId, islandId: S.island.id, crop: S.place.type,
      buildingId: S.place.farmId || null,           // 纪元式拉田：田归属到这座农场
      cells: todo.map(c => ({ x: c.x, z: c.z })),
    });
    planted = r.count || 0;
    failMsg = r.stop;
  } catch (err) { failMsg = err.message; }
  /* 整片种完统一刷新一次 —— 逐格刷新的话 30 株要重画 30 遍农田 */
  await refreshPlots(); await refreshPlayer();
  const p = S.place; if (p) p.count += planted;
  renderPlaceBar();
  if (failMsg)      toast(`种了 ${planted} 株后停下：${failMsg}`, 'bad');
  else if (planted > 1) toast(`一口气种下 ${planted} 株${placeLabel(p)}`, 'good');
}

/** 拖动中的提示：这片田几株、多少钱、有多少格被跳过 / 截断 */
function renderPlantDragHint(plan) {
  const hint = document.getElementById('buildHint');
  if (!hint) return;
  const todo = plan.filter(c => c.ok).length;
  const skip = plan.filter(c => c.skip).length;
  const bad = plan.find(c => c.ok === false);
  const seed = placeCost(S.place);
  let s = `正在划一片 <b style="color:var(--gold)">${todo} 株</b>${placeLabel(S.place)} · ${money(todo * seed)}金`;
  if (skip) s += `（另有 ${skip} 格已种着，不重复收费）`;
  if (bad)  s += ` · 有格子种不了：${bad.why}`;
  s += ' · 松手种下去';
  hint.innerHTML = s;
}

/* ============================================================
   10.7 铲除工具：点一格确认拆一个，拖一片只拆"第一格那一类"
   <p>
   【为什么按第一格的类型过滤】玩家划的框里经常混着别的东西（田中间一座房），
   "框到什么拆什么"太容易误伤 —— 纪元1800 的做法是**先点/先框到什么类型，
   这一框就只拆那一类**：第一格是农田 → 这框只铲农田，房子毫发无伤；
   第一格是农夫小屋 → 这框只拆农夫小屋。
   <p>
   【为什么必须弹确认】铲除是少数不可逆操作（作物种子钱不退、建筑返一半），
   批量铲更是几十个一起没 —— 松手只出**确认弹框**，点了「确认铲除」才真动手。
   ============================================================ */

const demolGhostMat = new THREE.MeshBasicMaterial({ color:0xff6a5a, transparent:true, opacity:.6, depthWrite:false });
let demolGhosts = [];        // 与 plantGhosts 同一几何池的思路：不够再补，只改位置

/** 这一格上有什么可铲的：作物 > 建筑 > 马路（一格通常只占一种，但建筑占多格要整块算） */
function demolishTargetAt(x, z) {
  const plot = plotCells.get(keyOf(x, z));
  if (plot) return { kind:'plot', plotId: plot.id, label:'作物' };
  const b = (S.buildings || []).find(b =>
    x >= b.gridX && x < b.gridX + b.sizeW && z >= b.gridZ && z < b.gridZ + b.sizeH);
  if (b) return { kind:'building', bldId: b.id, btype: b.type,
                  label: (BLD_MAP[b.type] && BLD_MAP[b.type].label) || b.type };
  if (roadSet.has(keyOf(x, z))) return { kind:'road', x, z, label:'马路' };  return null;
}

/** 两类目标算不算"同一类"：作物跟作物一类，建筑看类型 key，马路跟马路一类 */
function sameTargetKind(a, b) {
  if (!a || !b) return false;
  if (a.kind !== b.kind) return false;
  if (a.kind === 'building') return a.btype === b.btype;
  return true;
}

/** 划的这片里，符合 first 类型的目标去重清单（建筑按 id 去重 —— 一座厂占 9 格） */
function planDemolRect(cells, first) {
  const seen = new Set(), out = [];
  for (const c of cells) {
    const t = demolishTargetAt(c.x, c.z);
    if (!t || !sameTargetKind(first, t)) continue;   // 不是这一类的：框到了也不拆
    const k = t.kind === 'building' ? 'b' + t.bldId
            : t.kind === 'plot' ? 'p' + t.plotId : 'r' + t.x + ',' + t.z;
    if (seen.has(k)) continue;
    seen.add(k);
    out.push(t);
    if (out.length >= 200) break;                    // 一次别超过 200 个，防手滑框全岛
  }
  return out;
}

function drawDemolGhost(cells, plan) {
  hidePlaceGhost();
  while (demolGhosts.length < cells.length) {
    const m = new THREE.Mesh(roadGhostGeo, demolGhostMat);
    plantGhostGroup.add(m); demolGhosts.push(m);
  }
  /* 先全部隐藏，再把要拆的格子标红 —— 未中类型的格子不亮，玩家一眼看出"这框只拆这类" */
  demolGhosts.forEach(m => { m.visible = false; });
  const hit = new Set(plan.map(t => t.kind === 'plot' ? 'p' + t.plotId
    : t.kind === 'building' ? 'b' + t.bldId : 'r' + t.x + ',' + t.z));
  let n = 0;
  for (const c of cells) {
    const t = demolishTargetAt(c.x, c.z);
    if (!t) continue;
    const k = t.kind === 'plot' ? 'p' + t.plotId
      : t.kind === 'building' ? 'b' + t.bldId : 'r' + t.x + ',' + t.z;
    if (!hit.has(k)) continue;
    const m = demolGhosts[n++];
    const [wx, wz] = cellToWorld(c.x, c.z);
    m.position.set(wx, TOP_Y + cellH(c.x, c.z) + 0.12, wz);
    m.visible = true;
  }
}

function clearDemolGhost() { for (const m of demolGhosts) m.visible = false; }

/** 拖动中：重算屏幕矩形 → 重画预览 → 更新提示条（只在数量变了时动 DOM） */
function updateDemolDrag(cx, cy) {
  const d = drag && drag.demol;
  if (!d) return;
  S.hoverCell = cellAtPointer(cx, cy);
  const hint = document.getElementById('buildHint');
  if (!d.first) {   // 按下那格什么都没有：没有"第一格类型"可言，这一下铲不了
    d.plan = []; d.todo = 0; d.len = 0;
    clearDemolGhost();
    if (hint) hint.innerHTML = '这一格没有可铲的东西（作物 / 建筑 / 马路才行） · 松手取消';
    return;
  }
  const cells = cellsInScreenRect(d.sx, d.sy, cx, cy);
  const plan = planDemolRect(cells, d.first);
  if (plan.length === d.todo && cells.length === d.len) return;
  d.plan = plan; d.todo = plan.length; d.len = cells.length;
  drawDemolGhost(cells, plan);
  if (hint) hint.innerHTML = d.plan.length
    ? `将铲除 <b style="color:#ff8a7a">${d.plan.length} 个</b>${d.first.label}（只拆这一类，框到别的不动） · 松手后确认`
    : `这片里没有${d.first.label} · 松手取消`;
}

/** 松手：出确认弹框，点了确认才逐个发拆除请求 */
async function commitDemolDrag() {
  const d = drag && drag.demol;
  if (!d) return;
  clearDemolGhost();
  const plan = d.plan || [];
  if (!plan.length) return;
  const label = d.first.label;
  const extra = d.first.kind === 'building' ? '，建筑返还一半造价'
    : d.first.kind === 'plot' ? '，种子钱不退' : '';
  const ok = await confirmBox(
    `确认铲除 ${plan.length} 个${label}？`,
    `这一框里只铲 <b>${label}</b>${plan.length > 1 ? `（共 ${plan.length} 个）` : ''}${extra}。铲除后无法撤销。`);
  if (!ok) { toast('已取消铲除'); return; }
  let done = 0, failMsg = null;
  for (const t of plan) {
    try {
      if (t.kind === 'plot') {
        await api('/api/farm/remove', 'POST', { playerId:S.playerId, plotId:t.plotId });
      } else if (t.kind === 'building') {
        await api(`/api/buildings/${t.bldId}?playerId=${S.playerId}`, 'DELETE');
      } else {
        await api('/api/roads', 'DELETE', { playerId:S.playerId, islandId:S.island.id, x:t.x, z:t.z });
      }
      done++;
    } catch (err) { failMsg = err.message; break; }
  }
  /* 三类目标都可能拆了，统一全刷一遍（比逐个刷省很多次重画） */
  await Promise.all([refreshPlots(), refreshBuildings(), refreshRoads()]);
  await refreshPlayer();
  const p = S.place; if (p) p.count += done;
  renderPlaceBar();
  if (failMsg)      toast(`铲了 ${done} 个后停下：${failMsg}`, 'bad');
  else if (done > 1) toast(`已铲除 ${done} 个${label}`, 'good');
}

/**
 * 确认弹框（Promise 化）：resolve(true)=点了确认，resolve(false)=取消 / Esc。
 * 弹着的时候指针事件被遮罩挡住，镜头不会误动；Esc 走全局按键监听里的 confirm 分支。
 */
function confirmBox(title, body) {
  return new Promise(resolve => {
    const mask = document.getElementById('confirmMask');
    document.getElementById('confirmTitle').textContent = title;
    document.getElementById('confirmBody').innerHTML = body;
    mask.classList.add('show');
    const done = v => {
      mask.classList.remove('show');
      yes.onclick = no.onclick = mask.onclick = null;
      window.__confirmCancel = null;
      resolve(v);
    };
    const yes = document.getElementById('confirmYes'), no = document.getElementById('confirmNo');
    yes.onclick = () => done(true);
    no.onclick  = () => done(false);
    window.__confirmCancel = () => done(false);   // Esc 快捷取消（见 keydown 监听）
  });
}
/* 临路判定统一走 nearRoadRect(x, z, w, h) —— 建筑占 2×2~4×4 格，
   只看锚点四邻会误判（大厂可能只有某个角贴路）。 */
/** 从某格马路出发能连通的马路格数（四邻连通）——面板里显示路网规模 */
function roadNetworkSize(x0, z0) {
  if (!roadSet.has(keyOf(x0, z0))) return 0;
  const seen = new Set([keyOf(x0, z0)]);
  const queue = [[x0, z0]];
  while (queue.length) {
    const [cx, cz] = queue.pop();
    for (const [dx, dz] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const nx = cx + dx, nz = cz + dz, k = keyOf(nx, nz);
      if (roadSet.has(k) && !seen.has(k)) { seen.add(k); queue.push([nx, nz]); }
    }
  }
  return seen.size;
}

/* ============================================================
   8. 建筑（占地 w×h 格，(gridX,gridZ) 是左上角；大门朝最近的马路）
   ============================================================ */
const bldGroup = new THREE.Group(); island.add(bldGroup);
const bldCells = new Map();          // 占地的**每一格**都登记到建筑 id
let bldNodes = [];

/* ------------------------------------------------------------
   8.0 3D 模型：把 AI 生成的 .glb 挂到建筑上
   放一个 static/models/<建筑类型>.glb（例如 LUMBERJACK.glb）就会被自动加载，
   并按这座建筑的占地尺寸自动缩放、居中、贴地；没放模型的类型继续用程序化厂房，
   所以可以一个一个慢慢补，随时都能跑。
   ------------------------------------------------------------ */
const MODEL_DIR = './models/';
const modelLoader = new GLTFLoader();
const MODEL_HAVE = new Set();      // 探测到已存在模型的建筑类型
const MODEL_CACHE = new Map();     // type -> 归一化后的母本（每个实例 clone 一份）
window.__annoModelHave = () => [...MODEL_HAVE];       // 调试钩子：无头脚本验证模型接入用
window.__annoModelCache = () => [...MODEL_CACHE.keys()];

const modelUrl = type => MODEL_DIR + type + '.glb';

/** 探测哪些类型已经放了模型：优先问服务端要清单（一次请求、无 404 噪音），拿不到再逐个 HEAD */
async function probeModels() {
  try {
    const list = await api('/api/assets/models');
    for (const t of list) MODEL_HAVE.add(t);
  } catch {
    await Promise.all(BUILDINGS.map(async b => {
      try {
        const r = await fetch(modelUrl(b.key), { method:'HEAD', cache:'no-store' });
        if (r.ok) MODEL_HAVE.add(b.key);
      } catch { /* 没有这个模型就没有，用程序化厂房顶上 */ }
    }));
  }
  modelBadgeText = MODEL_HAVE.size
    ? `模型 ${[...MODEL_HAVE].filter(t => BLD_MAP[t]).length}/${BUILDINGS.length}`
    : '用程序化厂房（放 models/*.glb 即换成模型）';
  renderToolBar();
  if (MODEL_HAVE.size) buildBuildings(S.buildings || []);
}

/**
 * 加载并归一化模型。
 * <p>AI 生成的 glb 尺度、原点、朝向都不固定（混元3D 默认以米为单位、中心不在地面），
 * 所以一律**按包围盒**归一：缩放到占地尺寸、水平居中、底面贴地 —— 绝不信任模型自带的变换。
 * <p>w/h 传的是该建筑**未旋转**的基准占地（与缓存键一致），旋转靠实例整体转，见 attachModel。
 */
async function loadModel(type, w, h) {
  if (MODEL_CACHE.has(type)) return MODEL_CACHE.get(type);
  const gltf = await modelLoader.loadAsync(modelUrl(type));
  const src = gltf.scene;
  src.position.set(0, 0, 0);
  const box = new THREE.Box3().setFromObject(src);
  const size = box.getSize(new THREE.Vector3());
  const targetW = w * CELL * 0.9, targetD = h * CELL * 0.9;
  /* 高度上限只用来拦住"一根烟囱"那种瘦高模型，别把正常房子压小：
     所以取占地短边的 0.95 倍 —— 常态下根本不触发，触发了也还是个墩实的建筑 */
  const maxH = 0.95 * Math.min(targetW, targetD) + 0.5;
  const s = Math.min(targetW / (size.x || 1), targetD / (size.z || 1), maxH / (size.y || 1));
  src.scale.setScalar(s);
  const box2 = new THREE.Box3().setFromObject(src);
  const c = box2.getCenter(new THREE.Vector3());
  src.position.set(-c.x, -box2.min.y, -c.z);
  const holder = new THREE.Group();
  holder.add(src);
  MODEL_CACHE.set(type, holder);
  invalidateGhost(type);          // 正在拿着的建造预览可能还停在占位体块上，换成真模型
  return holder;
}

/** 把模型实例挂到建筑分组上；成功后撤掉程序化占位体（含拾取列表里的残留） */
async function attachModel(g, type, w, h, id, placeholder, angle = 0) {
  try {
    const proto = await loadModel(type, w, h);
    if (!g.parent) return;                        // 等待期间场景已重建 → 丢弃这次结果
    const inst = proto.clone(true);
    /* 模型母本一律按**未旋转**的占地归一化（缓存也只有一份），转多少度靠这里整体转：
       这样 4×3 转 90° 之后模型的包围盒正好又变回 3×4，和占地严丝合缝，
       同时模型自己的"正面"也跟着转到门口那条路上。 */
    inst.rotation.y = angle;
    inst.traverse(o => {
      if (!o.isMesh) return;
      o.userData = { kind:'building', id };
      pickBlds.push(o);                        // 模型网格必须可拾取：否则点真模型建筑射线会穿过去选中地面
      if (o.material) o.material.side = THREE.DoubleSide;   // 生成的薄片（瓦楞、旗帜）常是单面
    });
    g.add(inst);
    const node = bldNodes.find(n => n.group === g);
    if (node) {
      node.body = inst;                  // 本体从占位体块换成真模型（预览比对用）
      /* GLB 模型的风车叶片：Blender 里做成了独立枢轴子节点（windmill，原点在毂心、
         纯平移无旋转），找到就登记到 bldNode 上；转不转由主循环按停工状态门控
         （缺料 stall / 缺工 idle 都停，见 animate 里的 spin 段）。 */
      const wm = inst.getObjectByName('windmill');
      if (wm) { node.spin = wm; }
    }
    for (const m of placeholder || []) {
      /* 占位体块现在挂在自己的小分组里（为了和建造预览共用一个构造函数），
         所以从**它的实际父节点**摘，不能想当然地从建筑分组 g 上摘。 */
      if (m.parent) m.parent.remove(m);
      const i = pickBlds.indexOf(m);
      if (i >= 0) pickBlds.splice(i, 1);          // 否则模型位置旁会留下"幽灵拾取体"
    }
    refreshPickables();
  } catch {
    MODEL_CACHE.delete(type);                     // 加载失败：下次再试，本次保持程序化厂房
  }
}

/**
 * "等模型到位前"的占位体块：盒子 + 四棱锥屋顶 + 门。
 * <p>【建造预览也用它】幽灵必须和落下去那座长得一样，所以两边共用同一个函数 ——
 *    改这里等于同时改预览和实体，不会再出现"放下之后才变成另一个样子"。
 *
 * @param bw/bd 底座尺寸（未旋转的基准占地 × CELL × 0.86）
 * @param w/h   旋转后的占地格数（屋顶按它非等比缩放，才能盖满整块占地）
 * @param fa    朝向角（门开在这一侧）
 */
function buildPlaceholderParts(meta, span, bw, bd, w, h, fa) {
  const housing = meta.kind === 'RESIDENCE';
  const harborish = meta.kind === 'HARBOR';
  const baseH = housing ? 0.55 + 0.10 * span : harborish ? 0.62 + 0.09 * span : 0.8 + 0.17 * span;
  const roofH = housing ? 0.78 + 0.14 * span : harborish ? 0.40 + 0.05 * span : 0.62 + 0.09 * span;

  const baseGeo = new THREE.BoxGeometry(bw, baseH, bd);
  const base = new THREE.Mesh(baseGeo,
      new THREE.MeshStandardMaterial({ color:meta.color, roughness:.75 }));
  base.position.y = baseH / 2;

  /* 四棱锥屋顶：底面是半径 CELL*0.65 的正方形（旋转 45° 后正好对齐格子），
     再按 w/h 非等比缩放，这样 4×3 的厂房也能盖满整个占地 */
  const roofGeo = new THREE.ConeGeometry(CELL * 0.65, roofH, 4);
  const roof = new THREE.Mesh(roofGeo,
      new THREE.MeshStandardMaterial({ color: housing ? 0xb5533f : harborish ? 0x455a64 : 0x37474f, roughness:.7 }));
  roof.rotation.y = Math.PI / 4;
  roof.scale.set(w, 1, h);
  roof.position.y = baseH + roofH / 2;

  const doorH = Math.min(0.62, baseH * 0.6);
  const doorGeo = new THREE.BoxGeometry(0.36 + 0.09 * (span - 2), doorH, 0.06);
  const door = new THREE.Mesh(doorGeo, new THREE.MeshStandardMaterial({ color:0x2b2118, roughness:.9 }));
  const off = (Math.abs(Math.sin(fa)) > 0.5 ? bw : bd) / 2 + 0.03;
  door.position.set(Math.sin(fa) * off, doorH / 2, Math.cos(fa) * off);
  door.rotation.y = fa;

  const group = new THREE.Group();
  group.add(base, roof, door);
  return { group, base, roof, door, baseGeo, roofGeo, doorGeo, bodyTop: baseH + roofH };
}

/** 会转的零件（风车叶片 / 矿井天轮）：主循环里慢慢转，静止不动的建筑才有"活着"的感觉 */
const spinParts = [];
/** GLB 风车的角速度按**建筑 id** 存（不挂在节点上）：buildBuildings 全量重建建筑网格时
    转速不丢，复工不用从零再加速。buildBuildings 末尾会清掉已拆除建筑的那几条。 */
const spinSpeeds = new Map();

/** 星星建筑的高度都不同，用一次包围盒得到"顶在哪"，进度条才能挂在合适的高度上 */
const _procBox = new THREE.Box3();

function buildBuildings(list) {
  clearOwned(bldGroup, bldOwnedGeo);
  bldNodes = []; bldCells.clear(); pickBlds.length = 0;
  spinParts.length = 0;
  list.forEach((v, i) => {
    const meta = BLD_MAP[v.type] || { label:v.label, color:0x90a4ae, w:1, h:1 };
    const rot = normRot(v.rotation || 0);
    /* 服务端下发的 sizeW/sizeH 已经是**旋转后**的占地；老接口没给就自己按朝向换算 */
    const fallback = sizeOfRot(v.type, rot);
    const w = v.sizeW || fallback.w || 1;
    const h = v.sizeH || fallback.h || 1;
    const g = new THREE.Group();
    let x, z;
    if (v.gridX == null) {                       // 老存档没有坐标：沿岛缘兜底摆放
      const a = i * 0.72 + 0.4, r = LAND_R * 0.72 * CELL;
      x = Math.cos(a) * r; z = Math.sin(a) * r;
    } else {
      // 锚点是左上角，模型要摆在整块占地的中心
      [x, z] = cellToWorld(v.gridX + (w - 1) / 2, v.gridZ + (h - 1) / 2);
      for (let cx = v.gridX; cx < v.gridX + w; cx++) {
        for (let cz = v.gridZ; cz < v.gridZ + h; cz++) bldCells.set(keyOf(cx, cz), v.id);
      }
    }
    /* 台地：建筑底盘落在占地的平均高上（跨两级台地时半嵌半悬，视觉可忽略） */
    g.position.set(x, TOP_Y + (v.gridX == null ? 0 : footprintH(v.gridX, v.gridZ, w, h)), z);

    const span = Math.max(w, h);
    const bw = w * CELL * 0.86, bd = h * CELL * 0.86;     // 底座贴住整块占地
    const coastal = isCoastalBld(v.type);                 // 骑岸线：需要水里的桩基
    const share = { kind:'building', id:v.id };           // 所有零件共用一份 userData（拾取用）
    const fa = rotAngle(rot);
    let bodyTop = 1.2;                                    // 体块顶面高度：进度条 / 桅灯按它落
    let base = null, roof = null, door = null;
    let body = null;                                      // "建筑本体"（不含进度条/货箱那些挂件）：
                                                          // 建造预览要和它比对尺寸，见 __annoBldBox

    if (MODEL_HAVE.has(v.type)) {
      /* ① 已经有真模型：这套"盒子 + 锥顶 + 门"只是**占位体块**，
         模型异步到位后 attachModel 会把它摘掉 —— 先画出来，别让玩家盯着一块空地。
         【与建造预览同一个函数】幽灵画的是同一副体块，所见即所得。 */
      const ph = buildPlaceholderParts(meta, span, bw, bd, w, h, fa);
      base = ph.base; roof = ph.roof; door = ph.door;
      base.userData = share; roof.userData = share;
      /* 门开在 v.rotation 指定的那一侧（服务端建的时候已经吸附过道路，这里照它画）；
         老存档没有 rotation 就回落到"南"，与改造前一致。 */
      door.userData = share;
      g.add(ph.group); pickBlds.push(base, roof);
      bldOwnedGeo.push(ph.baseGeo, ph.roofGeo, ph.doorGeo);
      bodyTop = ph.bodyTop;
      body = ph.group;
    } else {
      /* ② 程序化外观：按**形制 + 主色**拼体块（见 jsm/proc-buildings.js）。
         砖厂长像窑、教堂有尖塔、公园有几棵树 —— 同一套网格不经 .glb 也能认出这行的营生。
         【和 GLB 同一套路数】按**未旋转**的基准尺寸建造，再整体转 fa，
         于是 90° 转向之后体块正好铺满旋转后的占地。 */
      const bs = sizeOf(v.type);
      const proc = makeProcBuilding(meta.form || 'FACTORY',
          meta.tint != null ? meta.tint : (meta.color != null ? meta.color : 0x90a4ae),
          bs.w || w, bs.h || h, Math.abs(Math.imul(v.id || i + 1, 2654435761) >>> 4));
      _procBox.setFromObject(proc);                 // 还没挂进场景：量到的是**局部**尺寸
      bodyTop = Math.max(1.1, _procBox.max.y);
      proc.rotation.y = fa;
      proc.traverse(o => {
        if (!o.isMesh) return;
        o.userData = share;
        pickBlds.push(o);
        bldOwnedGeo.push(o.geometry);
      });
      g.add(proc);
      body = proc;
      for (const nm of ['windmill', 'minewheel']) {
        const part = proc.getObjectByName(nm);
        if (part) spinParts.push(part);
      }
    }

    /* 夜景窗户已取消（2026-09-25 用户决定）：程序化窗块和 GLB 模型对不上，
       以后由用户在 Blender 里给模型做窗户材质（材质名 Window，运行时按名点灯）。 */

    /* 码头的吊机：只有"等着换模型"的那批旧式体块需要另加装吊装置 ——
       程序化形制（QUAY_CRANE / DRYDOCK / JETTY）自己就把吊机画好了，再加一根就重了。 */
    if (coastal && MODEL_HAVE.has(v.type)) {
      const top = bodyTop, mastH = 1.55, armL = 1.2;
      const craneMat = new THREE.MeshStandardMaterial({ color:0x546e7a, roughness:.6, metalness:.25 });
      const mastGeo = new THREE.CylinderGeometry(0.075, 0.095, mastH, 8);
      mastGeo.translate(0, mastH / 2, 0);
      const mast = new THREE.Mesh(mastGeo, craneMat);
      mast.position.set(-bw * 0.3, top, -bd * 0.3);
      const armGeo = new THREE.BoxGeometry(armL, 0.09, 0.09);
      const arm = new THREE.Mesh(armGeo, craneMat);
      arm.rotation.y = fa - Math.PI / 2;      // 长边（+X）转到"门那侧"，即海的方向
      arm.position.set(mast.position.x + Math.sin(fa) * armL / 2,
                       top + mastH - 0.16,
                       mast.position.z + Math.cos(fa) * armL / 2);
      mast.userData = arm.userData = share;
      g.add(mast, arm);
      bldOwnedGeo.push(mastGeo, armGeo);
      pickBlds.push(mast, arm);

      /* 货箱：摆在门口内侧、沿门那条边左右各一只（只占非常小一块，不挡门） */
      const crateMat = new THREE.MeshStandardMaterial({ color:0xb08a52, roughness:.92 });
      const inside = (Math.abs(Math.sin(fa)) > 0.5 ? bw : bd) / 2 - 0.5;
      for (const [side, size] of [[-0.62, 0.44], [0.58, 0.32]]) {
        const crateGeo = new THREE.BoxGeometry(size, size, size);
        const crate = new THREE.Mesh(crateGeo, crateMat);
        crate.position.set(Math.sin(fa) * inside + Math.cos(fa) * side,
                           size / 2,
                           Math.cos(fa) * inside - Math.sin(fa) * side);
        crate.rotation.y = fa + (side > 0 ? 0.28 : -0.2);
        crate.userData = share;
        g.add(crate); pickBlds.push(crate); bldOwnedGeo.push(crateGeo);
      }

      /* 桅顶灯：夜里一颗暖光点，码头在黑暗里靠它认门 */
      const beaconGeo = new THREE.SphereGeometry(0.13, 8, 6);
      bldOwnedGeo.push(beaconGeo);
      const beacon = new THREE.Mesh(beaconGeo, LAMP_MAT);
      beacon.position.set(mast.position.x, top + mastH + 0.1, mast.position.z);
      g.add(beacon);
    }

    /* 桅顶灯：程序化码头形制没有单独的桅杆，就在体块顶上点一盏 ——
       夜里整片港区靠这些暖光点认门，也是"这座港口在营业"的信号。 */
    if (coastal && !MODEL_HAVE.has(v.type)) {
      const beaconGeo2 = new THREE.SphereGeometry(0.12, 8, 6);
      bldOwnedGeo.push(beaconGeo2);
      const lamp = new THREE.Mesh(beaconGeo2, LAMP_MAT);
      lamp.position.set(0, bodyTop + 0.24, 0);
      g.add(lamp);
    }

    /* 码头基座：骑岸线的建筑把半边伸进海里，那半边底下没有陆地砖 —— 不垫一块就会悬在海上。
       按**整块占地**的尺寸（不缩 0.86），从水下一直砌到地表；
       在岸上那半边它埋在地砖底下，看不见。 */
    if (coastal) {
      const quayH = 2.4;
      const quayGeo = new THREE.BoxGeometry(w * CELL, quayH, h * CELL);
      const quay = new THREE.Mesh(quayGeo,
          new THREE.MeshStandardMaterial({ color:0x8d8577, roughness:.95 }));
      quay.position.y = -quayH / 2 - 0.02;      // 顶面齐地表，往下扎进水里
      quay.userData = share;
      g.add(quay); pickBlds.push(quay); bldOwnedGeo.push(quayGeo);
    }

    // 铺装前场：一块贴住整块占地的地坪，让"这块地已被占用"一眼看清。
    // 它只是铺装、**不参与任何动画**（"运转中"的旋转交给屋顶那只小圆环 work）。
    const apron = new THREE.Mesh(new THREE.BoxGeometry(w * CELL * 0.96, 0.05, h * CELL * 0.96),
        new THREE.MeshStandardMaterial({ color:0x8a7a5f, roughness:.98 }));
    apron.position.y = 0.03; apron.userData = share;
    g.add(apron); pickBlds.push(apron);
    bldOwnedGeo.push(apron.geometry);

    /* 缺料标记 / "缺工人"标记 / 待运货堆 —— **只有生产型建筑才有**。
       住宅、公共设施、军事设施都没有生产周期（服务端 duration = 0）。
       （头顶的生产进度条与"运转中"转圈圆环已删：纪元1800 没有这些挂件，
       生产状态看面板与缺料标记就够。同步删掉了 animate 里对 n.fill / n.work 的逐帧更新。） */
    let stall = null, idle = null, crates = null;
    if (isProducer(v.type)) {
      const warnY = bodyTop + 0.55;

      stall = new THREE.Mesh(new THREE.OctahedronGeometry(0.26),
          new THREE.MeshStandardMaterial({ color:0xff5252, emissive:0xb71c1c, emissiveIntensity:.8 }));
      stall.position.y = warnY; stall.visible = false; g.add(stall);
      bldOwnedGeo.push(stall.geometry);

      /* "缺工人"标记：琥珀色八面体，与缺料的红色区分 —— 玩家一眼分清该进货还是该盖住宅 */
      idle = new THREE.Mesh(new THREE.OctahedronGeometry(0.26),
          new THREE.MeshStandardMaterial({ color:0xffc857, emissive:0x9a6a00, emissiveIntensity:.9 }));
      idle.position.y = warnY; idle.visible = false; g.add(idle);
      bldOwnedGeo.push(idle.geometry);

      /* 待运货堆：厂房门口的小木箱堆，待运越多堆越大（马车拉走就缩回去） */
      crates = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.4, 0.5),
          new THREE.MeshStandardMaterial({ color:0xb98b4f, roughness:.9 }));
      crates.visible = false; g.add(crates);
      bldOwnedGeo.push(crates.geometry);
    }

    /* 头顶状态牌：生产建筑停工（缺工人/缺料）、住宅幸福度低时浮现 ——
       canvas 文字牌始终面向镜头（Sprite），比八面体挂件多一层"到底是啥问题"的文字说明 */
    const note = makeStatusNote();
    note.sprite.position.y = bodyTop + 1.15;
    note.sprite.visible = false;
    g.add(note.sprite);

    bldGroup.add(g);
    bldNodes.push({ group:g, body, meta, apron, stall, idle, crates, note, view:v, target:0, rot });
    /* 这一类型放了 models/<type>.glb 就换成真模型（模型到位后自动撤掉上面的程序化厂房）。
       注意传的是**未旋转**的基准尺寸：模型按基准归一化后整体转 fa，转完正好铺满旋转后的占地。 */
    if (MODEL_HAVE.has(v.type)) {
      const bs = sizeOf(v.type);
      attachModel(g, v.type, bs.w, bs.h, v.id, [base, roof, door], fa);
    }
  });
  /* 风车转速表清理：建筑拆了就把它的角速度条目带走（Key 以外的都不动，
     这样其余风车的加速状态跨重建保留 —— 见 spinSpeeds 的注释） */
  const liveIds = new Set(list.map(v => v.id));
  for (const id of spinSpeeds.keys()) if (!liveIds.has(id)) spinSpeeds.delete(id);
  refreshPickables();
  updateFootprint();
}

/* ============================================================
   9. 树木（按岛屿 id 确定性生成，避开路 / 农田 / 建筑）
   ============================================================ */
const treeGroup = new THREE.Group(); island.add(treeGroup);
let trunkMesh = null, leafMesh = null;
/* 容量上限：接受率上限 0.56 × 面积归一常数 2800 ≈ 1568 < 1600，
   数学上保证截断永远不会发生 —— 截断按扫描顺序砍尾巴，一砍就全岛重排（见下） */
const TREE_MAX = 1600;

/* 砍树索引：格子 → 实例序号（TREE_CHOPPED 事件把那棵树从 InstancedMesh 里"领走"用）。
   swap-remove（尾部实例补位）保证 O(1)，meta 表记住补位实例原来的格子改指向 */
const treeCellIndex = new Map();   // 'x,z' -> 实例序号
const treeMeta = new Map();        // 实例序号 -> 'x,z'
const treeCells = new Set();       // 画面上有树的格子（选中面板"这里是一棵树"用）

/* ---- 补种（纪元式可持续林业）----
   被砍的格子进队列：树苗从 12% 尺寸渐长回成树（默认 10 分钟，服务端事件带权威 regrowAt）。
   长成后移出队列 —— 之后任何场景重建都按"普通树"渲染，账目自然对齐；
   重建（buildTrees）时队列里的树苗从队列表恢复矩阵，不重不漏。
   服务端 lumberRegrowMinutes=10；这里只是收不到事件时的兜底时长。 */
const regrowQueue = new Map();
const TREE_REGROW_MS = 600000;

/** 树苗成长进度 0..1（由服务端砍伐/复育时刻推算，客户端只做插值） */
function regrowK(e) {
  return Math.min(1, Math.max(0, (Date.now() - e.startMs) / Math.max(1, e.endMs - e.startMs)));
}
/** 把成长中的树苗挂到 InstancedMesh 的 idx 槽位（姿态 = 该格成树的确定性哈希姿态） */
function placeRegrowInstance(e, idx) {
  if (idx >= TREE_MAX) return;
  const d = new THREE.Object3D();
  d.position.set(e.wx, e.wy, e.wz);
  d.rotation.set(0, e.rot, 0);
  d.scale.setScalar(Math.max(0.02, e.s * (0.12 + 0.88 * regrowK(e))));
  d.updateMatrix();
  trunkMesh.setMatrixAt(idx, d.matrix);
  leafMesh.setMatrixAt(idx, d.matrix);
  const key = keyOf(e.x, e.z);
  treeCellIndex.set(key, idx); treeMeta.set(idx, key);
}

function seededRand(seed) {
  let t = seed + 0x6D2B79F5;
  t = Math.imul(t ^ (t >>> 15), t | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
/** 格子 → 大数空间哈希：旧版 c.x*131+c.z*17 会沿对角线撞车，
    撞上的两格拿到同一条随机流（同位置抖动/同转向/同大小），肉眼看就是花纹 */
function cellHash(c, seed) {
  return (seed + ((c.x * 73856093) ^ (c.z * 19349663))) >>> 0;
}
function buildTrees() {
  treeGroup.clear();
  treeCellIndex.clear(); treeMeta.clear(); treeCells.clear();
  if (!S.treeChops) S.treeChops = new Map();   // 树账未到位（换岛过渡帧）：先当没砍过，账到了会重建
  if (!trunkMesh) {
    const trunkGeo = new THREE.CylinderGeometry(0.11, 0.15, 0.9, 6); trunkGeo.translate(0, 0.45, 0);
    const leafGeo = new THREE.ConeGeometry(0.72, 1.9, 7); leafGeo.translate(0, 1.25, 0);
    trunkMesh = new THREE.InstancedMesh(trunkGeo,
        new THREE.MeshStandardMaterial({ color:0x6b4f2a, roughness:.95 }), TREE_MAX);
    leafMesh = new THREE.InstancedMesh(leafGeo,
        new THREE.MeshStandardMaterial({ color:0x2f7a3a, roughness:.85 }), TREE_MAX);
    trunkMesh.count = 0; leafMesh.count = 0;
  }
  treeGroup.add(trunkMesh, leafMesh);

  /* ① 逐格独立判定：一棵树长不长，只由"这一格自己的哈希 + 岛 id"决定。
     旧版先把候选格收进数组、洗牌后取前 TREE_MAX —— 修一条路/盖一栋房，
     候选数组就变短一格，洗牌/截断结果整组换掉，全岛的树跟着"刷新"一遍。
     逐格判定后，修路只会移除路面上的那一棵，其他树纹丝不动。
     【面积归一】120×120 的岛上万格候选，按原始概率会要 ~4000 棵、撞上容量截断
     （截断 = 又变回"按顺序砍"，问题复发）。density 用 landCells.length 归一 ——
     它是**地形常量**，修路盖房都不改它，所以概率本身与建造行为完全无关。 */
  const seedBase = (S.island ? S.island.id : 1) * 7919;
  const density = Math.min(1, 2800 / Math.max(1, landCells.length));
  const d = new THREE.Object3D();
  let n = 0;
  for (const c of landCells) {
    if (n >= TREE_MAX) break;                            // 安全阀：InstancedMesh 容量上限
    if (plotCells.has(keyOf(c.x, c.z)) || hasRoad(c.x, c.z) || bldCells.has(keyOf(c.x, c.z))) continue;
    const rg = S.treeChops.get(keyOf(c.x, c.z));
    if (rg != null && Date.now() < rg) continue;          // 已砍未复育：这格暂时不长树（补种账同服务端 tree_chop）
    if (regrowQueue.has(keyOf(c.x, c.z))) continue;       // 树苗成长中：由补种队列负责渲染，主循环不重复放
    if (isCoastCell(c.x, c.z)) continue;                 // 沙滩上不长树：海岸带要留给港口，也得让人一眼看清"海边在哪"
    if (isMountainCell(c.x, c.z)) continue;              // 山地地表比平地高，树按平地高度放会被山体埋半截
    if (oreAtCell(c.x, c.z) !== TERRAIN.PLAIN) continue; // 矿脉上不盖树：矿要露出来给人看见
    const grove = smoothNoise(c.x * 0.05 + 3.1, c.z * 0.05 + 8.7);       // 0..1 林区强度（0.05 低频 → 斑块 ~18 格成片）
    const p = Math.max(0, (grove - 0.35) * 0.85) * density;              // 纪元式成片森林：空地 0% / 深林区 ~55%，与服务端 computeStatic 同判式
    if (seededRand(cellHash(c, seedBase)) > p) continue;
    const jx = (seededRand(cellHash(c, seedBase) + 1) - 0.5) * CELL * 0.5;
    const jz = (seededRand(cellHash(c, seedBase) + 2) - 0.5) * CELL * 0.5;
    const [wx, wz] = cellToWorld(c.x, c.z);
    d.position.set(wx + jx, TOP_Y + cellH(c.x, c.z) + 0.05, wz + jz);
    d.rotation.set(0, seededRand(cellHash(c, seedBase) + 3) * Math.PI * 2, 0);
    d.scale.setScalar(0.75 + seededRand(cellHash(c, seedBase) + 4) * 0.5);
    d.updateMatrix();
    trunkMesh.setMatrixAt(n, d.matrix);
    leafMesh.setMatrixAt(n, d.matrix);
    treeCellIndex.set(keyOf(c.x, c.z), n); treeMeta.set(n, keyOf(c.x, c.z));
    treeCells.add(keyOf(c.x, c.z));
    n++;
  }
  /* 场景重建后把成长中的树苗重新挂回 InstancedMesh（槽位排在主循环之后，账目同一套索引） */
  for (const e of regrowQueue.values()) {
    if (n >= TREE_MAX) break;
    placeRegrowInstance(e, n); n++;
  }
  trunkMesh.count = n; leafMesh.count = n;
  trunkMesh.instanceMatrix.needsUpdate = true;
  leafMesh.instanceMatrix.needsUpdate = true;
  buildBeachDecor();
}

/* ---- 伐木场砍树：账本 + 移除 + 倒下演出 ----
   服务端每砍一棵树广播 TREE_CHOPPED（格子坐标）。树从 InstancedMesh 里逻辑消失
   （swap-remove 保持森林干净），再用一次性普通 Mesh 复刻那棵树演 0.9 秒
   "倾倒 → 陷土 → 缩没" —— 演出独立于数据，互不拖累。 */
function removeTreeInstance(idx, key) {
  const last = trunkMesh.count - 1;
  if (idx !== last) {
    const m = new THREE.Matrix4();
    trunkMesh.getMatrixAt(last, m); trunkMesh.setMatrixAt(idx, m);
    leafMesh.getMatrixAt(last, m); leafMesh.setMatrixAt(idx, m);
    const lastKey = treeMeta.get(last);
    if (lastKey) { treeCellIndex.set(lastKey, idx); treeMeta.set(idx, lastKey); }
  }
  trunkMesh.count = last; leafMesh.count = last;
  trunkMesh.instanceMatrix.needsUpdate = true;
  leafMesh.instanceMatrix.needsUpdate = true;
  treeCellIndex.delete(key); treeMeta.delete(last);
  treeCells.delete(key);
}

function chopTreeAt(x, z, buildingId, regrowAt) {
  if (x == null || z == null) return;
  const key = keyOf(x, z);
  const end = Number(regrowAt) > 0 ? Number(regrowAt) : Date.now() + TREE_REGROW_MS;
  if (S.treeChops) S.treeChops.set(key, end);  // 账本同步：复育期满前这格不再长树（服务端 tree_chop 同一套账）
  /* 排一棵树苗：就在原格从 12% 渐长回成树（位置/姿态 = 成树的确定性哈希值，
     长成后移出队列，之后任何重建都按普通树渲染）—— 与视野无关，先记账再演 */
  const seedBase = (S.island ? S.island.id : 1) * 7919;
  const h = cellHash({ x, z }, seedBase);
  const [wx, wz] = cellToWorld(x, z);
  regrowQueue.set(key, {
    x, z, startMs: Date.now(), endMs: end,
    wx: wx + (seededRand(h + 1) - 0.5) * CELL * 0.5,
    wy: TOP_Y + cellH(x, z) + 0.05,
    wz: wz + (seededRand(h + 2) - 0.5) * CELL * 0.5,
    rot: seededRand(h + 3) * Math.PI * 2,
    s: 0.75 + seededRand(h + 4) * 0.5,
  });
  if (!trunkMesh) return;
  const idx = treeCellIndex.get(key);
  if (idx === undefined || idx >= trunkMesh.count) return;   // 不在这片视野（远岛 / 已重建）
  const m = new THREE.Matrix4(); trunkMesh.getMatrixAt(idx, m);
  const pos = new THREE.Vector3().setFromMatrixPosition(m);
  removeTreeInstance(idx, key);               // 数据层立即：森林里这棵树当场消失
  /* 倒树演出归伐木工：有工人在岗就排进他的活儿（跑过去挥斧，斧落树倒）；
     没有工人（在跑/缺工人/深夜）→ 立即兜底演出，树该倒还是倒 */
  if (!(buildingId != null && dispatchChop(buildingId, pos))) spawnChopFx(pos);
}

/** 进岛 / 重连后恢复成长中的树苗：按账里的复育时刻 + 确定性哈希重算位置与姿态
    （startMs 用 endMs - TREE_REGROW_MS 近似 —— 服务端时长就是它，误差可忽略） */
function rebuildRegrowQueue() {
  regrowQueue.clear();
  if (!S.island || !S.treeChops) return;
  const seedBase = S.island.id * 7919;
  for (const [key, end] of S.treeChops) {
    const [x, z] = key.split(',').map(Number);
    const h = cellHash({ x, z }, seedBase);
    const [wx, wz] = cellToWorld(x, z);
    regrowQueue.set(key, {
      x, z, startMs: end - TREE_REGROW_MS, endMs: end,
      wx: wx + (seededRand(h + 1) - 0.5) * CELL * 0.5,
      wy: TOP_Y + cellH(x, z) + 0.05,
      wz: wz + (seededRand(h + 2) - 0.5) * CELL * 0.5,
      rot: seededRand(h + 3) * Math.PI * 2,
      s: 0.75 + seededRand(h + 4) * 0.5,
    });
  }
}

/** 每帧驱动树苗渐大：只改自己槽位的矩阵，长成即移出队列（实例保持成树尺寸） */
function tickRegrow() {
  if (!trunkMesh || regrowQueue.size === 0) return;
  const d = new THREE.Object3D();
  for (const [key, e] of regrowQueue) {
    if (regrowK(e) >= 1) { regrowQueue.delete(key); treeCells.add(key); continue; }   // 长成了：以后按普通树渲染
    const idx = treeCellIndex.get(key);
    if (idx === undefined || idx >= trunkMesh.count) continue;
    d.position.set(e.wx, e.wy, e.wz);
    d.rotation.set(0, e.rot, 0);
    d.scale.setScalar(Math.max(0.02, e.s * (0.12 + 0.88 * regrowK(e))));
    d.updateMatrix();
    trunkMesh.setMatrixAt(idx, d.matrix);
    leafMesh.setMatrixAt(idx, d.matrix);
    trunkMesh.instanceMatrix.needsUpdate = true;
    leafMesh.instanceMatrix.needsUpdate = true;
  }
}

const chopFx = [];
function spawnChopFx(pos) {
  const g = new THREE.Group();
  g.add(new THREE.Mesh(trunkMesh.geometry, trunkMesh.material));
  g.add(new THREE.Mesh(leafMesh.geometry, leafMesh.material));
  g.position.copy(pos);
  g.rotation.y = Math.random() * Math.PI * 2;   // 倒向随机（绕 Y 转后再绕 X 倒）
  scene.add(g);
  chopFx.push({ g, baseY: pos.y, t0: performance.now(), dur: 900 });
}
function tickChopFx() {
  const now = performance.now();
  for (let i = chopFx.length - 1; i >= 0; i--) {
    const f = chopFx[i];
    const k = (now - f.t0) / f.dur;
    if (k >= 1) { scene.remove(f.g); chopFx.splice(i, 1); continue; }
    const ease = k * k;                          // 越倒越快
    f.g.rotation.x = ease * 1.45;                // 绕根部倾倒（树几何原点在树脚）
    f.g.position.y = f.baseY - ease * 0.25;      // 连根带土陷下去一点
    const s = 1 - Math.max(0, (k - 0.7) / 0.3);  // 末段缩没
    f.g.scale.setScalar(Math.max(0.001, s));
  }
}

/* ---- 伐木工：上班通勤 + 出门砍树（纪元1800 式）----
   每座**运转中**的伐木场 1 名伐木工，状态机：

     OFF      缺工人 / 深夜（22:00~6:30）/ 岛上没这人活儿 —— 隐藏
     COMMUTE  从最近住宅门口走到厂门口站位（= 上班，可见"人从住处来"）
     DUTY     在厂门口待机（轻微踱步）
     TO_TREE  服务端 TREE_CHOPPED 广播驱动：跑向目标树旁（事件驱动，不自己挑树 ——
              永不出现"他在砍 A 树、B 树先倒了"的穿帮）
     CHOP     挥斧三下，斧落 → 接倒树演出（树的数据层早已在广播当下移除）
     BACK     背着手走回厂门口 → DUTY

   造型复用 npc-roster 的村民低模（工人/农民原型），腿摆 + 右臂挥斧。
   建筑增减由 applyBuildings → syncLumberCrew 收敛：拆场即遣散。 */
const lumberCrew = new Map();          // buildingId -> worker
const LUMBER_DAY = { from: 6.5, to: 22 };

function makeLumberman(seed) {
  const look = makeLook(seed, (seed & 1) ? 'WORKER_M' : 'FARMER_M');
  const body = buildNpcBody(look);
  /* 斧头：柄 + 刃，挂右臂手上（挥砍时整条右臂带斧一起摆） */
  const axe = new THREE.Group();
  const handle = new THREE.Mesh(new THREE.BoxGeometry(0.03, 0.30, 0.03),
    new THREE.MeshLambertMaterial({ color: 0x8d6e63 }));
  const blade = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.09, 0.022),
    new THREE.MeshLambertMaterial({ color: 0xb9c2c9 }));
  blade.position.set(0, 0.16, 0);
  axe.add(handle, blade);
  axe.position.set(0, -body.look.height * 0.34, 0.03);   // 手的位置（臂长下端）
  body.armR.add(axe);
  const g = new THREE.Group();
  g.add(body.group);
  return { g, body, axe };
}

/** 最近住宅门口（上班出发点）；30 格内没有住宅就 null（厂门口淡入） */
function nearestHomeSpawn(bx, bz) {
  let best = null, bd = 1e9;
  for (const v of (S.buildings || [])) {
    if (v.type !== 'FARMER_HOUSE' || v.gridX == null) continue;
    const d = (v.gridX - bx) ** 2 + (v.gridZ - bz) ** 2;
    if (d < bd) { bd = d; best = v; }
  }
  if (!best || bd > 900) return null;
  const [wx, wz] = cellToWorld(best.gridX + (best.sizeW || 2) / 2, best.gridZ + (best.sizeH || 2) / 2);
  return new THREE.Vector3(wx, groundAt(wx, wz), wz);
}

/** 每座伐木场一名工人，按快照收敛（增/删/上班/下班）—— applyBuildings 尾部调用 */
function syncLumberCrew() {
  if (!S.island) { for (const w of lumberCrew.values()) scene.remove(w.g); lumberCrew.clear(); return; }
  const mills = new Set();
  for (const v of (S.buildings || [])) {
    if (v.type !== 'LUMBERJACK' || v.gridX == null) continue;
    mills.add(v.id);
    let w = lumberCrew.get(v.id);
    const night = npcWorld && (npcWorld.nightFactor > 0.5);
    const off = v.noWorkers || night;                       // 缺工人 / 深夜 = 不上班
    if (!w) {
      if (off) continue;                                    // 不在岗就不造人（省得反复建）
      const seed = (v.id * 2654435761) >>> 0;
      w = { ...makeLumberman(seed), bld: v, state: 'OFF', t: 0, phase: Math.random() * 6.28,
            speed: 1.15 + (seed % 100) / 300, queue: [], chopPos: null, stand: null, prev: null };
      scene.add(w.g);
      lumberCrew.set(v.id, w);
    }
    if (off) {                                              // 下班：收工消失，清掉手里的活
      w.state = 'OFF'; w.g.visible = false; w.queue.length = 0;
      continue;                                             // 已启动的倒树演出由 tickChopFx 独立播完，不受影响
    }
    if (w.state === 'OFF') startCommute(w);                 // 到点上班（或第一次创建）
  }
  for (const [id, w] of [...lumberCrew]) {                  // 建筑没了 → 遣散
    if (!mills.has(id)) { scene.remove(w.g); lumberCrew.delete(id); }
  }
}

/** 上班：从最近住宅门口走到厂门口站位（没有住宅就原地淡入在站位上） */
function startCommute(w) {
  const v = w.bld;
  const [cx, cz] = cellToWorld(v.gridX + (v.sizeW || 2) / 2, v.gridZ + (v.sizeH || 2) / 2);
  const home = nearestHomeSpawn(v.gridX, v.gridZ);
  const out = new THREE.Vector3(0, 0, -1);                  // 默认朝 -Z 出门
  if (home) out.set(cx - home.x, 0, cz - home.z).normalize();
  const off = (v.sizeW || 2) * CELL / 2 + 0.55;
  const stand = new THREE.Vector3(cx + out.x * off, 0, cz + out.z * off);
  stand.y = groundAt(stand.x, stand.z);
  w.stand = stand;
  w.g.visible = true;
  w.t = 0; w.state = 'COMMUTE';
  if (home) {
    w.from = home.clone(); w.g.position.copy(home);
    w.to = stand.clone();
  } else {
    w.from = stand.clone(); w.g.position.copy(stand); w.to = stand.clone();
  }
}

/** 砍树派单：该伐木场工人在岗就接（返回 true），否则 false（调用方兜底立即演出） */
function dispatchChop(buildingId, pos) {
  const w = lumberCrew.get(buildingId);
  if (!w || w.state === 'OFF' || w.queue.length >= 4) return false;
  w.queue.push(pos.clone());
  return true;
}

function tickLumberCrew(dt) {
  for (const w of lumberCrew.values()) {
    const b = w.body;
    const walk = (from, to, sp, onArrive) => {
      const d = from.distanceTo(to) || 1e-6;
      w.t += (dt * sp) / d;
      if (w.t >= 1) { w.g.position.copy(to); onArrive(); return; }
      w.g.position.lerpVectors(from, to, w.t);
      w.g.rotation.y = Math.atan2(to.x - from.x, to.z - from.z);
      w.phase += dt * sp * 7.5;                             // 步频随速度
      const sw = Math.sin(w.phase) * 0.55;
      b.legL.rotation.x = sw; b.legR.rotation.x = -sw;
      b.armL.rotation.x = -sw * 0.7;
      if (w.state !== 'CHOP') b.armR.rotation.x = sw * 0.7;  // 挥斧时右臂归砍伐动画管
    };
    switch (w.state) {
      case 'COMMUTE':                                       // —— 上班路上
        walk(w.from, w.to, w.speed, () => { w.state = 'DUTY'; w.phase = Math.random() * 6.28; });
        break;
      case 'DUTY': {                                        // —— 厂门口待机（轻微踱步）
        w.phase += dt * 1.6;
        b.legL.rotation.x = b.legR.rotation.x = 0;
        b.armL.rotation.x = Math.sin(w.phase) * 0.06;
        b.armR.rotation.x = Math.sin(w.phase + 1) * 0.06;
        const nx = w.stand.x + Math.sin(w.phase * 0.4) * 0.18, nz = w.stand.z + Math.cos(w.phase * 0.31) * 0.18;
        w.g.position.set(nx, groundAt(nx, nz), nz);
        if (w.queue.length) {                               // —— 来活了：跑向树（站位=树旁 0.55）
          const pos = w.queue.shift();
          const dir = pos.clone().sub(w.g.position); dir.y = 0;
          const d = dir.length() || 1e-6;
          const to = pos.clone().sub(dir.multiplyScalar(0.55 / d)).setY(0);
          to.y = groundAt(to.x, to.z);
          w.from = w.g.position.clone(); w.to = to; w.t = 0;
          w.chopPos = pos.clone(); w.chopPos.y = groundAt(pos.x, pos.z);
          w.state = 'TO_TREE';
        }
        break;
      }
      case 'TO_TREE':                                       // —— 跑向目标树（步频更快）
        walk(w.from, w.to, w.speed * 1.75, () => { w.state = 'CHOP'; w.t = 0;
          w.g.rotation.y = Math.atan2(w.chopPos.x - w.g.position.x, w.chopPos.z - w.g.position.z); });
        break;
      case 'CHOP': {                                        // —— 挥斧三下，斧落树倒
        w.t += dt;
        const sw = Math.sin(w.t * 9);
        b.armR.rotation.x = -1.5 + sw * 0.85;               // 右臂举过头顶→劈下
        b.legL.rotation.x = b.legR.rotation.x = 0;
        if (w.t >= 0.55 && !w.chopDone) { w.chopDone = true; spawnChopFx(w.chopPos, w); }
        if (w.t >= 1.05) { w.chopDone = false; w.state = 'BACK'; w.from = w.g.position.clone(); w.to = w.stand.clone(); w.t = 0; }
        break;
      }
      case 'BACK':                                          // —— 收工走回厂门口
        walk(w.from, w.to, w.speed * 0.8, () => { w.state = 'DUTY'; w.phase = Math.random() * 6.28; });
        break;
    }
  }
}

/* ---- 沙滩装饰：岩石 / 漂流木 / 草丛 ----
   纯视觉层：不占逻辑格、**不进拾取列表**（射线只测 pickables，点到装饰 = 点到脚下那格）。
   岸线类型也顺手做出差异：低频噪声把海岸分段 —— 有的岸段偏"岩"（石块成堆）、
   有的长草丛、大部分是干净的沙 —— 避免"全岛一圈一模一样的黄沙"。
   位置全由岛屿 id 的确定性伪随机给：同一座岛每次进游戏装饰都长在同一处。 */
const beachGroup = new THREE.Group(); island.add(beachGroup);
let beachRock = null, beachWood = null, beachTuft = null;

function buildBeachDecor() {
  if (!beachRock) {
    beachRock = new THREE.InstancedMesh(new THREE.DodecahedronGeometry(0.34),
        new THREE.MeshStandardMaterial({ color:0x8d8578, roughness:.95, flatShading:true }), 140);
    beachWood = new THREE.InstancedMesh(new THREE.CylinderGeometry(0.08, 0.11, 1.15, 5),
        new THREE.MeshStandardMaterial({ color:0x7a5c38, roughness:.9, flatShading:true }), 90);
    beachTuft = new THREE.InstancedMesh(new THREE.ConeGeometry(0.16, 0.38, 5),
        new THREE.MeshStandardMaterial({ color:0xa8b46e, roughness:.9, flatShading:true }), 220);
    beachGroup.add(beachRock, beachWood, beachTuft);
  }
  beachRock.count = beachWood.count = beachTuft.count = 0;
  const d = new THREE.Object3D();
  let nr = 0, nw = 0, nt = 0;
  const seedBase = (S.island ? S.island.id : 1) * 2477;
  for (const c of landCells) {
    if (!isCoastCell(c.x, c.z)) continue;                        // 只打扮沙滩圈
    if (plotCells.has(keyOf(c.x, c.z)) || hasRoad(c.x, c.z) || bldCells.has(keyOf(c.x, c.z))) continue;
    /* 岩岸 / 草岸的分段：噪声低的地方偏岩，高的地方偏草，中间留干净的沙 */
    const zone = smoothNoise(c.x * 0.11 + 7.7, c.z * 0.11 + 3.3);
    const k = seedBase + c.x * 131 + c.z * 17;
    const r1 = seededRand(k), r2 = seededRand(k + 1), r3 = seededRand(k + 2);
    const [wx, wz] = cellToWorld(c.x, c.z);
    const jx = (r1 - 0.5) * CELL * 0.6, jz = (r2 - 0.5) * CELL * 0.6;
    if (zone < 0.34 && r3 < 0.55 && nr < 140) {                  // 岩岸段：石头堆
      d.position.set(wx + jx, TOP_Y + 0.02 + r1 * 0.1, wz + jz);
      d.rotation.set(r2 * 0.7, r3 * 6.28, r1 * 0.7);
      d.scale.set(0.7 + r1 * 0.7, 0.5 + r2 * 0.6, 0.7 + r3 * 0.7);
      d.updateMatrix(); beachRock.setMatrixAt(nr++, d.matrix);
      if (r2 < 0.5 && nr < 140) {                                // 一半概率再堆一块
        d.position.set(wx - jx, TOP_Y + 0.02 + r3 * 0.1, wz - jz);
        d.rotation.set(r3 * 0.7, r1 * 6.28, r2 * 0.7);
        d.scale.setScalar(0.5 + r2 * 0.5); d.updateMatrix();
        beachRock.setMatrixAt(nr++, d.matrix);
      }
    } else if (zone > 0.62 && r3 < 0.4 && nt < 220) {            // 草岸段：草丛（1~2 簇）
      d.position.set(wx + jx, TOP_Y + 0.1, wz + jz);
      d.rotation.set(0, r1 * 6.28, (r2 - 0.5) * 0.5);
      d.scale.setScalar(0.8 + r1 * 0.6);
      d.updateMatrix(); beachTuft.setMatrixAt(nt++, d.matrix);
      if (r2 < 0.45 && nt < 220) {
        d.position.set(wx - jx * 0.6, TOP_Y + 0.1, wz - jz * 0.6);
        d.rotation.set(0, r2 * 6.28, (r3 - 0.5) * 0.5);
        d.scale.setScalar(0.6 + r3 * 0.5); d.updateMatrix();
        beachTuft.setMatrixAt(nt++, d.matrix);
      }
    } else if (r3 < 0.06 && nw < 90) {                           // 干净沙段：偶尔一根漂流木
      d.position.set(wx + jx, TOP_Y + 0.12, wz + jz);
      d.rotation.set(Math.PI / 2 + (r1 - 0.5) * 0.3, 0, r2 * 6.28);
      d.scale.set(1, 0.7 + r3 * 0.8, 1);
      d.updateMatrix(); beachWood.setMatrixAt(nw++, d.matrix);
    }
  }
  beachRock.count = nr; beachWood.count = nw; beachTuft.count = nt;
  beachRock.instanceMatrix.needsUpdate = true;
  beachWood.instanceMatrix.needsUpdate = true;
  beachTuft.instanceMatrix.needsUpdate = true;
}

/* ---- 选中高亮环 ---- */
const selRing = new THREE.Mesh(new THREE.TorusGeometry(CELL * 0.55, 0.08, 8, 32),
    new THREE.MeshStandardMaterial({ color:0xffcc55, emissive:0xffa000, emissiveIntensity:.9 }));
selRing.rotation.x = Math.PI / 2; selRing.visible = false; island.add(selRing);

/* 伐木场砍伐范围圈（纪元1800 式）：半径 8 格，同服务端 GameProperties.lumberChopRadius ——
   拿着伐木场幽灵时跟幽灵走、选中建成的伐木场时跟建筑走，其余时候隐藏。
   线环 + 淡面盘都逐顶点按 groundAt 贴地形，翻丘陵不悬空。 */
const CHOP_RADIUS_CELLS = 8;
const chopRing = new THREE.Group(); chopRing.visible = false; island.add(chopRing);
const chopRingLine = (() => {
  const R = CHOP_RADIUS_CELLS * CELL, SEG = 72, pts = [];
  for (let i = 0; i <= SEG; i++) {
    const a = (i / SEG) * Math.PI * 2;
    pts.push(new THREE.Vector3(Math.cos(a) * R, 0, Math.sin(a) * R));
  }
  return new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),
    new THREE.LineBasicMaterial({ color: 0x9df5b4, transparent: true, opacity: 0.85 }));
})();
const chopRingDisc = new THREE.Mesh(new THREE.CircleGeometry(CHOP_RADIUS_CELLS * CELL, 48),
  new THREE.MeshBasicMaterial({ color: 0x9df5b4, transparent: true, opacity: 0.09, depthWrite: false, side: THREE.DoubleSide }));
chopRingDisc.rotation.x = -Math.PI / 2;
chopRing.add(chopRingLine, chopRingDisc);
/** 把圈摆到 (cx,cz) 并逐顶点重贴地形（只在位置变化时调，不逐帧） */
function showChopRing(cx, cz) {
  chopRing.position.set(cx, 0, cz);
  const y0 = 0;
  const lp = chopRingLine.geometry.attributes.position;
  for (let i = 0; i < lp.count; i++) lp.setY(i, groundAt(cx + lp.getX(i), cz + lp.getZ(i)) - y0 + 0.12);
  lp.needsUpdate = true;
  const dp = chopRingDisc.geometry.attributes.position;
  for (let i = 0; i < dp.count; i++) dp.setY(i, groundAt(cx + dp.getX(i), cz + dp.getZ(i)) - y0 + 0.06);
  dp.needsUpdate = true;
  chopRing.visible = true;
}
function hideChopRing() { chopRing.visible = false; }

/* ============================================================
   10. 相机控制（自写轨道 + 平移）
   ------------------------------------------------------------
   左键拖 = 转视角；右键 / 中键拖 = 平移；WASD / 方向键 = 平移；滚轮 = 缩放。
   俯仰角一路放开到 2.45 rad（约 140°）—— 镜头能压到水面附近**抬头看天**，
   这才是"能看到天空"的关键（不是加张贴图就完事，见「15.6 天空」）。
   ============================================================ */
let azim = 0.85, polar = 0.95, dist = 52;
let fogBaseNear = 160, fogBaseFar = 420;   // updateCamera 算出的雾基准（无天气修正）
const camTarget = new THREE.Vector3(0, 1.5, 0);
const camLook = new THREE.Vector3();
/** 相机最低高度：想抬头时算出来的机位会钻到水面以下，用这个地板拦住它 */
const CAM_FLOOR = 1.15;
function updateCamera() {
  polar = Math.max(0.15, Math.min(2.45, polar));
  /* 可视距离必须跟着岛的大小走：56 格的岛横跨 95 个世界单位，
     视距上限还卡在 150 的话，想看一眼全岛就会被硬生生拽住。 */
  dist = Math.max(16, Math.min(GRID * CELL * 4.2, dist));
  /* 雾近远跟着镜头走：拉得越远雾越往后退，岛在任何缩放级别都不会被雾洗白；
     fog.far 始终 ≥ dist+450，保证海面边缘（±450）照样化进天里，不见方形水边。
     基准值另存一份：主循环里天气系统要按雨量把雾压近（见 WEATHERS.fog），
     直接改 scene.fog 会在下一帧被这里的重算覆盖掉雨天效果。 */
  fogBaseNear = Math.max(160, dist * 0.9);
  fogBaseFar  = Math.max(420, dist + 450);
  scene.fog.near = fogBaseNear;
  scene.fog.far  = fogBaseFar;
  const sp = Math.sin(polar), cp = Math.cos(polar);
  let py = camTarget.y + dist * cp;
  let ly = camTarget.y;
  if (py < CAM_FLOOR) {
    /* 机位被地板顶住了，但**视线方向必须保持不变** —— 把注视点往上抬同样的幅度。
       否则一低头就变成"贴着水面平视"，抬头看天的效果全没了。 */
    ly = camTarget.y + (CAM_FLOOR - py);
    py = CAM_FLOOR;
  }
  camera.position.set(
    camTarget.x + dist * sp * Math.sin(azim), py,
    camTarget.z + dist * sp * Math.cos(azim));
  camLook.set(camTarget.x, ly, camTarget.z);
  camera.lookAt(camLook);
}
/** 平移到哪都行，但别把岛整个甩出视野 */
function clampTarget() {
  const lim = GRID * CELL * 1.8;
  camTarget.x = Math.max(-lim, Math.min(lim, camTarget.x));
  camTarget.z = Math.max(-lim, Math.min(lim, camTarget.z));
}
/**
 * 平移镜头。right / forward 是**镜头要挪的方向**（世界单位，1 = 屏幕右 / 屏幕里）。
 * 鼠标拖拽走的是"抓住地面拖"的手感 —— 往右拖，地面跟着往右走，所以镜头实际往左挪。
 */
function panCamera(right, forward) {
  const rx = Math.cos(azim), rz = -Math.sin(azim);     // 屏幕右
  const fx = -Math.sin(azim), fz = -Math.cos(azim);    // 屏幕里（相机朝向在地面上的投影）
  camTarget.x += rx * right + fx * forward;
  camTarget.z += rz * right + fz * forward;
  clampTarget();
  updateCamera();
}
/* 键盘平移：按住就一直走，所以这里只记"哪些键按着"，位移交给主循环按帧算 */
const KEY_PAN = {
  w:'up', arrowup:'up', s:'down', arrowdown:'down',
  a:'left', arrowleft:'left', d:'right', arrowright:'right',
};
const panKeys = new Set();
addEventListener('keydown', e => {
  if (e.target && /^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName)) return;   // 别抢输入框的按键
  const k = KEY_PAN[String(e.key).toLowerCase()];
  if (k) { panKeys.add(k); e.preventDefault(); }
});
addEventListener('keyup', e => { panKeys.delete(KEY_PAN[String(e.key).toLowerCase()]); });
addEventListener('blur', () => panKeys.clear());     // 切走窗口时别让按键"卡住"
function panByKeys(dt) {
  if (!panKeys.size) return;
  let r = 0, f = 0;
  if (panKeys.has('left'))  r -= 1;
  if (panKeys.has('right')) r += 1;
  if (panKeys.has('up'))    f += 1;
  if (panKeys.has('down'))  f -= 1;
  if (!r && !f) return;
  /* 速度跟视距挂钩：拉得越远，一次挪得越多，手感才一致 */
  const step = dist * 0.6 * dt;
  panCamera(r * step, f * step);
}

let drag = null;
let rightMoved = 0;              // 上一次右键从按下到松开，鼠标一共动了多少像素
canvas.addEventListener('pointerdown', e => {
  /* 拿着马路 / 作物 / 铲除时左键按下 = 开始拉（马路拉一条线，作物划一片矩形，
     铲除划一片区域）。这时候不转镜头，不然拖出来的东西会跟着镜头歪。
     按下时先记住**起点格**，此刻还不铺任何东西 —— 铺是松手时一次性提交的。
     铲除还要在**起点格**定型要拆的目标类型 —— "按第一个格子的类型铲"就从这来。 */
  const p = S.place;
  const start = (p && (p.kind === 'road' || p.kind === 'plant' || p.kind === 'demolish') && e.button === 0)
    ? cellAtPointer(e.clientX, e.clientY) : null;
  if (e.button === 1) e.preventDefault();     // 中键：挡掉浏览器的自动滚屏
  /* 中键 / 右键 = 平移镜头（城建游戏的习惯）。右键同时还兼着"放下手里的东西"，
     所以松手时用 moved 判定这一下到底是拖镜头还是取消放置。 */
  const dt = (p && p.kind === 'demolish' && start) ? demolishTargetAt(start.x, start.z) : null;
  drag = { x:e.clientX, y:e.clientY, moved:0, pan: e.button === 1 || e.button === 2,
           road: (p && p.kind === 'road' && start) ? { start, plan:[], todo:-1, len:-1 } : null,
           plant: (p && p.kind === 'plant' && start) ? { sx:e.clientX, sy:e.clientY, plan:[], todo:-1, len:-1 } : null,
           demol: (p && p.kind === 'demolish' && start) ? { sx:e.clientX, sy:e.clientY, first:dt, plan:[], todo:-1, len:-1 } : null };
  canvas.setPointerCapture(e.pointerId);
  if (drag.road) updateRoadDrag(e.clientX, e.clientY);
  else if (drag.plant) updatePlantDrag(e.clientX, e.clientY);
  else if (drag.demol) updateDemolDrag(e.clientX, e.clientY);
});
canvas.addEventListener('pointermove', e => {
  if (drag) {
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    drag.moved += Math.abs(dx) + Math.abs(dy);
    if (drag.road) updateRoadDrag(e.clientX, e.clientY);   // 拉线：重算这条直线
    else if (drag.plant) updatePlantDrag(e.clientX, e.clientY);   // 划田：重算这片矩形
    else if (drag.demol) updateDemolDrag(e.clientX, e.clientY);   // 划铲除区：重算要拆的目标
    else if (drag.pan) {                                   // 平移：往右拖 → 镜头往左挪
      const k = dist * 0.0016;
      panCamera(-dx * k, dy * k);
    } else { azim -= dx * 0.005; polar -= dy * 0.004; updateCamera(); }
    drag.x = e.clientX; drag.y = e.clientY;
  }
  /* 手里拿着东西：幽灵预览一直跟着鼠标（转镜头的时候也跟）。
     拉线 / 划田时跳过 —— 那会儿要显示的是整条线 / 整片田的预览，不是光标下那一格。 */
  if (S.place && !(drag && (drag.road || drag.plant || drag.demol))) updatePlaceGhost(e.clientX, e.clientY);
  else if (!drag) hover(e.clientX, e.clientY);
});
canvas.addEventListener('pointerup', e => {
  if (drag && drag.road) {
    commitRoadDrag();                                 // 拉线：把这条线铺下去
  } else if (drag && drag.plant) {
    commitPlantDrag();                                // 划田：把这片田种下去（单击一格 = 1 株的特例）
  } else if (drag && drag.demol) {
    commitDemolDrag();                                // 划铲除区：确认弹框 → 批量拆（单击 = 拆 1 个的特例）
  } else if (drag && !drag.pan && drag.moved < 6) {
    if (S.place && S.place.kind !== 'plant' && S.place.kind !== 'demolish') placeAt(e.clientX, e.clientY);
    else if (!S.place) pick(e.clientX, e.clientY);    // 空手 → 这一下是"选中"
    else {
      /* 拿着田 / 铲除时点到"格子之外"的地方（建筑本体 / 山 / 天空）：
         点到建筑 = 玩家想看它 —— 顺手放下手里的并选中它，别把点击静默吞掉
         （不然面板一直停在"手里拿着"的放置提示，玩家会以为拉田按钮丢了）。 */
      const hit = castAt(e.clientX, e.clientY);
      const u = hit && hit.object.userData;
      if (u && u.kind === 'building') { cancelPlace(true); select({ kind:'building', id:u.id }); }
    }
  }
  if (drag && drag.pan && e.button === 2) rightMoved = drag.moved;
  drag = null;
});
canvas.addEventListener('wheel', e => {
  e.preventDefault(); dist *= 1 + e.deltaY * 0.0012; updateCamera();
}, { passive:false });
/* 右键 = 放下手里的东西（不弹系统菜单）；但刚才是右键拖着镜头的话，不该顺手把它取消掉 */
canvas.addEventListener('contextmenu', e => {
  e.preventDefault();
  if (rightMoved < 6 && S.place) cancelPlace();
});

const ray = new THREE.Raycaster(), ptr = new THREE.Vector2();
function castAt(cx, cy) {
  ptr.x = (cx / innerWidth) * 2 - 1;
  ptr.y = -(cy / innerHeight) * 2 + 1;
  ray.setFromCamera(ptr, camera);
  return ray.intersectObjects(pickables, false)[0] || null;
}
function hover(cx, cy) {
  const hit = castAt(cx, cy);
  canvas.style.cursor = S.place ? 'crosshair' : (hit ? 'pointer' : 'grab');
  if (!S.place && hit && hit.object === gridMesh && hit.instanceId != null) {
    const c = landCells[hit.instanceId];
    const [x, z] = cellToWorld(c.x, c.z);
    hoverBox.position.set(x, TOP_Y + cellH(c.x, c.z) + 0.12, z); hoverBox.visible = true;
  } else hoverBox.visible = false;
}
function pick(cx, cy) {
  const hit = castAt(cx, cy);
  if (!hit) { select(null); return; }
  const u = hit.object.userData;
  if (u.kind === 'building') select({ kind:'building', id:u.id });
  else if (u.kind === 'cell') select({ kind:'cell', x:u.x, z:u.z });
  /* 点到山 / 矿 / 岛体底块：InstancedMesh 用 instanceId 反查是哪一格 */
  else if (u.kind === 'terrain' && hit.instanceId != null) {
    const c = u.cells && u.cells[hit.instanceId];
    select(c ? { kind:'cell', x:c[0], z:c[1] } : null);
  }
  /* 连续山体是普通 Mesh（没有 instanceId）：用命中点的世界坐标反查格子 */
  else if (u.kind === 'terrain' && hit.point) {
    select({ kind:'cell',
      x: Math.round(hit.point.x / CELL + (GRID - 1) / 2),
      z: Math.round(hit.point.z / CELL + (GRID - 1) / 2) });
  }
  else if (hit.object === gridMesh && hit.instanceId != null) {
    const c = landCells[hit.instanceId];
    select({ kind:'cell', x:c.x, z:c.z });
  } else select(null);
}

/* ============================================================
   10.5 放置模式：**点建筑 → 拿在手上 → 点到岛上放下**
   ------------------------------------------------------------
   正常城建游戏的做法：不是"先点格子、再从列表里挑"，而是先把要盖的东西
   拿在手上（S.place），鼠标在岛上移动时幽灵预览跟着走，左键落下。
   地面网格线也只在这个模式下显示（平时岛上就是一整片草地）。

   与格子拾取的区别很关键：**幽灵预览走的是数学平面求交**（y = 地表的无限平面），
   不是打 mesh。否则鼠标划到山、树、建筑上时命中物不是地面，预览就会"卡住不动"。
   ============================================================ */
const groundPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), -TOP_Y);
const hillPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), -TOP_Y);
const planeHit = new THREE.Vector3();

/** 鼠标指着哪一格（可能越界；越界返回 null）。纯平面求交，不受山石树木遮挡影响。
    台地修正：基准平面在 y=TOP_Y，但台地上的地表要高出最多 0.48 —— 直接取交点
    会"点丘选到丘后面的格"。先用基准交点猜一格，再用那格的高度重求交一次，
    收敛（猜的格 = 重算的格）就采纳；两轮足够，缓坡最多差一格。 */
function cellAtPointer(cx, cy) {
  ptr.x = (cx / innerWidth) * 2 - 1;
  ptr.y = -(cy / innerHeight) * 2 + 1;
  ray.setFromCamera(ptr, camera);
  if (!ray.ray.intersectPlane(groundPlane, planeHit)) return null;
  let [x, z] = worldToCell(planeHit.x, planeHit.z);
  for (let it = 0; it < 2; it++) {
    if (x < 0 || z < 0 || x >= GRID || z >= GRID) break;
    hillPlane.constant = -(TOP_Y + cellH(x, z));
    if (!ray.ray.intersectPlane(hillPlane, planeHit)) break;
    const [nx, nz] = worldToCell(planeHit.x, planeHit.z);
    if (nx === x && nz === z) break;
    x = nx; z = nz;
  }
  if (x < 0 || z < 0 || x >= GRID || z >= GRID) return null;
  return { x, z };
}

/** 手里这件东西要花多少钱（放置前先看口袋，别等放下去了才被服务端拒绝） */
function placeCost(p) {
  if (!p) return 0;
  if (p.kind === 'building') return (BLD_MAP[p.type] && BLD_MAP[p.type].cost) || 0;
  if (p.kind === 'road') return ROAD_KIND(p.roadKind).cost;
  if (p.kind === 'demolish') return 0;   // 铲除不花钱（农田种子钱也不退，建筑照常返一半）
  return (CROP_MAP[p.type] && CROP_MAP[p.type].seed) || 0;
}

/** 手里这件东西叫什么（放置条上显示） */
function placeLabel(p) {
  if (!p) return '';
  if (p.kind === 'building') return (BLD_MAP[p.type] && BLD_MAP[p.type].label) || p.type;
  if (p.kind === 'road') return ROAD_KIND(p.roadKind).label;
  if (p.kind === 'demolish') return '铲除';
  return (CROP_MAP[p.type] && CROP_MAP[p.type].label) || p.type;
}

/** 开始放置：把一种建筑 / 马路 / 作物拿在手上。
 * 不需要先选格子 —— 目标是"鼠标划到哪就放到哪"。
 * kind='demolish' 是反向的工具：不放置，而是铲除（点一格确认拆一个，拖一片确认拆一类）。
 */
function beginPlace(kind, type) {
  if (!S.island) { toast('还没有岛', 'bad'); return; }
  if (kind === 'building') {
    const gate = residentGate(type);
    if (gate) { toast(gate, 'bad'); return; }
  }
  S.place = { kind, type, rot:null, count:0, roadKind: S.roadKind || 'DIRT' };
  S.hoverCell = null; S.hoverCheck = null; S.selected = null; selRing.visible = false; hideChopRing();
  setGridLines(true);
  updateFootprint(); renderSel(); renderToolBar(); renderPlaceBar();
  const label = placeLabel(S.place);
  if (kind === 'road') toast(`拿着${ROAD_KIND(S.roadKind).label}：按住左键往外拖，会拉出一条直线 —— 松手一次铺完整条；下方可换路面，点旧路改铺`, 'good');
  else if (kind === 'demolish') toast('拿着铲除：点一个目标 → 确认后拆掉；按住左键划一片 → 只拆第一格那一类，确认后批量拆', 'good');
  else toast(`拿着 ${label}：移到岛上（绿=能放），左键放下`, 'good');
}

/** 纪元式拉田（核心入口）：点一座农场建筑 → 把"这座农场的田"拿在手上。
 *  作物不用挑 —— 农场类型绑定了作物（FIELD_CROPS）；田只能拉在农场周围 FIELD_RANGE 格内。
 *  服务端 plant 接口会带 buildingId，田的归属 / 距离校验以服务端为权威。 */
function beginPullField(farmId) {
  if (!S.island) { toast('还没有岛', 'bad'); return; }
  const farm = farmById(farmId);
  if (!farm || !isFieldFarm(farm.type)) { toast('这座建筑不能拉田 —— 只有农场可以', 'bad'); return; }
  const cropKey = FIELD_CROPS[farm.type];
  S.place = { kind:'plant', type:cropKey, farmId, rot:null, count:0, roadKind:S.roadKind || 'DIRT' };
  S.hoverCell = null; S.hoverCheck = null; S.selected = null; selRing.visible = false; hideChopRing();
  setGridLines(true);
  updateFootprint(); renderSel(); renderToolBar(); renderPlaceBar();
  toast(`拿着${CROP_MAP[cropKey] ? CROP_MAP[cropKey].label : cropKey}田（${farm.label} @ ${farm.gridX},${farm.gridZ}）：`
    + `拉到农场周围 ${FIELD_RANGE} 格内，点一格种一株 / 拖一片批量种`, 'good');
}

/** 放下手里的东西（Esc / 右键 / 「取消」按钮都走这里） */
function cancelPlace(silent) {
  if (!S.place) return;
  const p = S.place;
  S.place = null; S.hoverCell = null; S.hoverCheck = null;
  /* 正拉着一条马路 / 划着一片田 / 划着铲除区时按 Esc：把手里的活作废 —— 否则松手那一刻它还会照执行 */
  if (drag && drag.road) { drag.road = null; clearRoadGhost(); }
  if (drag && drag.plant) { drag.plant = null; clearPlantGhost(); }
  if (drag && drag.demol) { drag.demol = null; clearDemolGhost(); }
  setGridLines(false);
  updateFootprint(); renderSel(); renderToolBar(); renderPlaceBar();
  if (!silent) toast(p.count ? `已放下 ${p.count} 个${placeLabel(p)}` : '已取消放置');
}

/** 手动转 90°：换大门朝向，同时决定横着摆还是竖着摆 */
function rotatePlace() {
  const p = S.place;
  if (!p || p.kind !== 'building') { toast('先把一种建筑拿在手上（点一下建造卡）', 'bad'); return; }
  const cur = p.rot != null ? p.rot
    : autoRotation(p.type, S.hoverCell ? S.hoverCell.x : 0, S.hoverCell ? S.hoverCell.z : 0);
  p.rot = normRot(cur + 90);
  const { w, h } = sizeOfRot(p.type, p.rot);
  updateFootprint(); renderToolBar(); renderPlaceBar();
  toast(`大门改为朝${ROT_LABEL[p.rot]}，占地 ${w}×${h}`);
}

/** 鼠标移动时更新幽灵预览：算出落在哪一格，能不能放 */
function updatePlaceGhost(cx, cy) {
  if (!S.place) return;
  const cell = cellAtPointer(cx, cy);
  const same = cell && S.hoverCell && cell.x === S.hoverCell.x && cell.z === S.hoverCell.z;
  S.hoverCell = cell;
  updateFootprint();
  if (!same) renderPlaceBar();     // 只在换格时动 DOM
}

/**
 * 把手里这件东西放到鼠标那一格。
 * 服务端才是权威 —— 这里只做客户端预判（能把明显不行的当场挡掉、给个原因），
 * 真正放下去之后仍以服务端的答案为准（路网可能是几秒前轮询来的，会旧一点）。
 */
async function placeAt(cx, cy) {
  const p = S.place;
  if (!p) return;
  const cell = cellAtPointer(cx, cy);
  if (!cell) { toast('把鼠标移到岛上再放下', 'bad'); return; }

  if (placeCost(p) > S.treasury) {
    toast(`资金不足：${placeLabel(p)} 要 ${money(placeCost(p))} 金，你还有 ${money(S.treasury)}`, 'bad');
    if (p.kind === 'building') cancelPlace(true);
    return;
  }

  try {
    if (p.kind === 'building') {
      const rot = currentRotation(p.type, cell.x, cell.z);
      const { w, h } = sizeOfRot(p.type, rot);
      const a = anchorFor(cell.x, cell.z, w, h);
      const pre = canPlaceAt(a.x, a.z, w, h, p.type);
      if (!pre.ok) { toast(pre.why, 'bad'); return; }
      const body = { playerId:S.playerId, islandId:S.island.id, type:p.type, x:a.x, z:a.z, rotation:rot };
      /* 朝向**永远显式下发**：预览里看到的就是 rot，服务端照它落库（不合法就直接报错）。
         以前只有手动转过才发、自动的交给服务端再吸一次 —— 两边路网/算法稍差一点，
         玩家就会看到"预览朝南、落下去朝东"。所见即所得优先。 */
      const r = await api('/api/buildings', 'POST', body);
      p.count++;
      toast(`${r.label} 已开工（占 ${r.sizeW}×${r.sizeH} 格，大门朝${ROT_LABEL[normRot(r.rotation)]}）`, 'good');
      await refreshBuildings(); await refreshPlayer();
      renderPlaceBar();
      return;
    }

    if (p.kind === 'road') {
      /* 已经有路 → 是不是想改铺成手里的路面（收差价）；空地 → 修新路 */
      if (hasRoad(cell.x, cell.z)) {
        if ((roadKindMap.get(keyOf(cell.x, cell.z)) || 'DIRT') === p.roadKind) {
