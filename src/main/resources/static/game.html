<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>纪元1800 · 3D 海岛</title>
<style>
  :root{
    --bg:#0b1a24; --panel:rgba(12,26,36,.86); --panel2:rgba(18,38,52,.92);
    --line:rgba(120,180,210,.22); --txt:#dcecf5; --dim:#8fb0c4;
    --gold:#ffcc55; --up:#ff5b5b; --down:#31d67a; --acc:#4fc3f7;
    /* 底部建造坞的实测高度（renderToolBar 每次重建后写进来）：
       坞会随窗口宽度换行、高度不固定，所以两侧面板的底边、日志和放置条
       全部按这个变量让位，而不是各写一个魔法数字。 */
    --dockH:160px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--txt);
    font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  canvas{display:block;position:fixed;inset:0}
  .panel{position:fixed;background:var(--panel);border:1px solid var(--line);border-radius:12px;
    backdrop-filter:blur(8px);box-shadow:0 8px 30px rgba(0,0,0,.45)}
  #hud{top:12px;left:50%;transform:translateX(-50%);display:flex;gap:18px;align-items:center;
    padding:9px 18px;font-size:13px;white-space:nowrap}
  #hud b{color:var(--gold);font-size:15px;font-variant-numeric:tabular-nums}
  #hud button{padding:3px 9px;font-size:12.5px;line-height:1}
  #hud .sep{width:1px;height:20px;background:var(--line)}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--down);margin-right:5px;vertical-align:1px}
  .dot.off{background:#888}
  /* 两侧面板的底边停在建造坞上方 20px —— 坞多高由 --dockH 说了算 */
  #left{left:12px;top:64px;width:276px;max-height:calc(100vh - var(--dockH) - 96px);overflow-y:auto;padding:14px}
  #right{right:12px;top:64px;width:330px;max-height:calc(100vh - var(--dockH) - 96px);overflow-y:auto;padding:12px}
  h3{margin:0 0 9px;font-size:13px;color:var(--acc);letter-spacing:1px;font-weight:600}
  .sect{margin-bottom:16px}
  .row{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12.5px;padding:3px 0}
  .muted{color:var(--dim)}
  button{font-family:inherit;cursor:pointer;border:1px solid var(--line);background:rgba(79,195,247,.10);
    color:var(--txt);border-radius:7px;padding:6px 10px;font-size:12px;transition:.15s}
  button:hover:not(:disabled){background:rgba(79,195,247,.26);border-color:var(--acc)}
  button:disabled{opacity:.38;cursor:not-allowed}
  button.gold{background:rgba(255,204,85,.14);border-color:rgba(255,204,85,.45);color:var(--gold)}
  button.gold:hover:not(:disabled){background:rgba(255,204,85,.3)}
  button.danger{background:rgba(255,91,91,.14);border-color:rgba(255,91,91,.45)}
  /* 手里正拿着的那张建造卡：和 tab 选中态一个观感 */
  button.on{background:rgba(79,195,247,.34);border-color:var(--acc);color:#fff}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .bar{height:7px;border-radius:4px;background:rgba(255,255,255,.10);overflow:hidden;margin:6px 0}
  .bar>i{display:block;height:100%;background:linear-gradient(90deg,#4fc3f7,#7cf29b);border-radius:4px;transition:width .4s}
  .tabs{display:flex;gap:6px;margin-bottom:10px}
  .tabs button{flex:1;padding:6px 0}
  .tabs button.on{background:rgba(79,195,247,.32);border-color:var(--acc);color:#fff}
  table{width:100%;border-collapse:collapse;font-size:12px}
  th{text-align:left;color:var(--dim);font-weight:500;padding:4px 4px;border-bottom:1px solid var(--line)}
  td{padding:4px;border-bottom:1px solid rgba(120,180,210,.09);font-variant-numeric:tabular-nums}
  tr.click td{cursor:pointer}
  tr.click:hover td{background:rgba(79,195,247,.10)}
  .up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--dim)}
  input,select{font-family:inherit;background:rgba(0,0,0,.3);border:1px solid var(--line);color:var(--txt);
    border-radius:6px;padding:5px 7px;font-size:12px;width:100%}
  .form{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px}
  /* 日志挂在右上角、右侧面板左边一条（右面板 330px + 边距 12px → 让出 354px）。
     历史条目上限 120 条，超出面板高度后内部上下滚动 —— 最新一条永远在最上面，
     往下滚就是翻历史。空的时候直接不占位 */
  #log{right:354px;top:64px;width:300px;max-height:34vh;overflow-y:auto;padding:10px 12px;font-size:12px}
  #log:empty{display:none}
  #log div{padding:2px 0;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #log div.hot{color:var(--gold)}
  /* 日志是独立浮层，滚动条压窄一点，别抢正文的存在感 */
  #log::-webkit-scrollbar{width:5px}
  #toasts{position:fixed;top:70px;left:50%;transform:translateX(-50%);z-index:50;display:flex;
    flex-direction:column;gap:6px;align-items:center;pointer-events:none}
  .toast{background:rgba(12,26,36,.94);border:1px solid var(--line);border-radius:20px;padding:7px 16px;
    font-size:13px;animation:pop .3s ease}
  .toast.good{border-color:rgba(49,214,122,.6);color:#9ff5c4}
  .toast.bad{border-color:rgba(255,91,91,.6);color:#ffb0b0}
  @keyframes pop{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}

  /* 铲除确认弹框：全屏遮罩 + 居中小卡。显示/隐藏全靠 .show 类 */
  #confirmMask{position:fixed;inset:0;z-index:90;background:rgba(4,10,16,.55);display:none;
    align-items:center;justify-content:center}
  #confirmMask.show{display:flex}
  #confirmBox{background:var(--panel,#101d29);border:1px solid var(--line);border-radius:12px;
    padding:18px 22px;max-width:420px;box-shadow:0 12px 40px rgba(0,0,0,.5);animation:pop .25s ease}
  #confirmTitle{font-size:15px;font-weight:600;margin-bottom:8px}
  #confirmBody{font-size:13px;color:var(--dim);line-height:1.6;margin-bottom:16px}
  #confirmBtns{display:flex;gap:10px;justify-content:flex-end}
  #confirmBtns button{padding:7px 18px}

  /* 世界市场：右下角小按钮 + 居中弹层。行情数据照旧每个快照/周期刷，
     只是画进弹层里 —— 弹层关着也照画，点开永远是新鲜的 */
  #worldBtn{position:fixed;right:12px;bottom:calc(var(--dockH) + 14px);z-index:42;padding:9px 16px;font-size:13px}
  #worldMask{position:fixed;inset:0;z-index:80;background:rgba(4,10,16,.55);display:none;
    align-items:center;justify-content:center}
  #worldMask.show{display:flex}
  #worldBox{width:430px;max-height:70vh;overflow-y:auto;background:var(--panel2);
    border:1px solid var(--line);border-radius:14px;padding:16px 18px;
    box-shadow:0 12px 40px rgba(0,0,0,.5);animation:pop .25s ease}
  #worldHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:14px}
  #worldHead button{padding:2px 11px;font-size:15px}

  /* 远征探险：🧭 按钮挨着 🌍 世界按钮；弹层同 worldMask 一套语言。
     事件卡是独立遮罩（z 更高）：弹层关着它也能弹出 —— 原作式"航行途中的抉择" */
  #expBtn{position:fixed;right:96px;bottom:calc(var(--dockH) + 14px);z-index:42;padding:9px 16px;font-size:13px}
  #expMask{position:fixed;inset:0;z-index:80;background:rgba(4,10,16,.55);display:none;
    align-items:center;justify-content:center}
  #expMask.show{display:flex}
  #expBox{width:470px;max-height:76vh;overflow-y:auto;background:var(--panel2);
    border:1px solid var(--line);border-radius:14px;padding:16px 18px;
    box-shadow:0 12px 40px rgba(0,0,0,.5);animation:pop .25s ease}
  #expHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:14px}
  #expHead button{padding:2px 11px;font-size:15px}
  .expDest{display:flex;gap:8px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;
    padding:8px 10px;margin-bottom:8px;cursor:pointer}
  .expDest.on{border-color:var(--gold);background:rgba(230,180,90,.08)}
  .expDest b{font-size:13px}
  .expDest .cost{font-size:11px;color:var(--dim)}
  .expRow{border-top:1px solid var(--line);padding:9px 2px;font-size:12.5px}
  .expRow .bar{height:6px;background:rgba(255,255,255,.08);border-radius:3px;overflow:hidden;margin:5px 0}
  .expRow .bar i{display:block;height:100%;background:linear-gradient(90deg,#3f9b7a,#7fc98f);border-radius:3px}
  .expRow .meta{display:flex;gap:12px;font-size:11px;color:var(--dim)}
  .expBadge{font-size:10.5px;padding:1px 8px;border-radius:8px;border:1px solid var(--line);margin-left:6px}
  .expBadge.EVENT{color:#ffb35c;border-color:#ffb35c}
  .expBadge.DONE{color:#8fd8a0;border-color:#8fd8a0}
  .expBadge.FAILED{color:#ff9a9a;border-color:#ff9a9a}
  #expCardMask{position:fixed;inset:0;z-index:90;background:rgba(2,6,10,.72);display:none;
    align-items:center;justify-content:center}
  #expCardMask.show{display:flex}
  #expCard{width:400px;background:var(--panel2);border:1px solid var(--gold);border-radius:14px;
    padding:20px 22px;box-shadow:0 16px 50px rgba(0,0,0,.6);animation:pop .3s ease}
  #expCard h3{margin:0 0 8px;color:var(--gold);font-size:17px;letter-spacing:1px}
  #expCardText{font-size:13px;line-height:1.7;margin-bottom:12px;color:#d8cdb8}
  #expCardStats{display:flex;gap:16px;font-size:12px;margin-bottom:12px}
  #expCardOpts{display:flex;flex-direction:column;gap:8px}
  #expCardOpts button{text-align:left;padding:9px 12px;line-height:1.4}
  #expCardOpts button small{display:block;font-size:10.5px;color:var(--dim)}
  #expCardOpts button:disabled{opacity:.38;cursor:not-allowed}
  #expCardTimer{height:4px;background:rgba(255,255,255,.08);border-radius:2px;overflow:hidden;margin-top:12px}
  #expCardTimer i{display:block;height:100%;background:var(--gold);border-radius:2px;transition:width 1s linear}
  .expDisc{display:flex;gap:10px;align-items:baseline;font-size:12px;border-top:1px dashed var(--line);padding:6px 2px}
  .expDisc b{color:var(--gold)}

  /* 造船厂：点岛上船厂弹出的对话框（同远征弹层一套语言），船型卡 + 船台进度 + 舰队列表 */
  #shipMask{position:fixed;inset:0;z-index:80;background:rgba(4,10,16,.55);display:none;
    align-items:center;justify-content:center}
  #shipMask.show{display:flex}
  #shipBox{width:470px;max-height:76vh;overflow-y:auto;background:var(--panel2);
    border:1px solid var(--line);border-radius:14px;padding:16px 18px;
    box-shadow:0 12px 40px rgba(0,0,0,.5);animation:pop .25s ease}
  #shipHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:14px}
  #shipHead button{padding:2px 11px;font-size:15px}
  .shipType{display:flex;gap:8px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;
    padding:8px 10px;margin-bottom:8px}
  .shipType b{font-size:13px}
  .shipType .cost{font-size:11px;color:var(--dim)}
  .shipBadge{font-size:10.5px;padding:1px 8px;border-radius:8px;border:1px solid var(--line);margin-left:6px}
  .shipBadge.IDLE{color:#8fd8a0;border-color:#8fd8a0}
  .shipBadge.AWAY{color:#ffb35c;border-color:#ffb35c}

  /* 放置条：手里拿着东西时才出现，浮在建造坞上面 —— 离鼠标近，不用回头找按钮 */
  #placeBar{left:50%;bottom:calc(var(--dockH) + 22px);transform:translateX(-50%);display:none;gap:10px;align-items:center;
    padding:8px 14px;font-size:12.5px;white-space:nowrap;z-index:41}
  #placeBar .why{font-size:11.5px}
  #placeBar button{padding:5px 10px;font-size:11.5px}
  /* 路面选择片（土路/石板/砖/大道）：只在手里拿着马路时出现 */
  #roadKinds{display:flex;gap:6px;align-items:center}
  .rkChip{padding:4px 9px !important;font-size:11.5px}
  .rkChip.on{background:var(--gold,#d8a531);color:#1c1509;border-color:#d8a531}
  .rkChip.locked{opacity:.42;cursor:not-allowed}
  #roadKinds .rkTip{color:var(--dim);font-size:11px}
  /* 建造坞：**常驻**屏幕底部 —— 马路 / 播种 / 全部建筑卡都在这儿，不依赖"先选一格"，
     想建随时点，拿在手上再去岛上点（和纪元 1800 的建造菜单一个道理）。
     三行：第一行是马路与农田；第二行是**分类页签**（按居民阶层排，越往后越要人口）；
     第三行是当前页的建筑卡 —— 一百多座建筑分到十一页，一屏放得下也翻得动。 */
  #toolBar{left:50%;bottom:12px;transform:translateX(-50%);display:flex;flex-direction:column;
    gap:5px;padding:7px 12px;font-size:12px;white-space:nowrap;z-index:40;max-width:calc(100vw - 24px)}
  #toolBar .tbRow{display:flex;gap:6px;align-items:stretch;justify-content:center;flex-wrap:wrap}
  #toolBar .tbHint{font-size:11px;color:var(--dim);text-align:center}
  #toolBar button{padding:5px 8px;font-size:11.5px;line-height:1.3;min-width:66px;text-align:center}
  #toolBar .tbLabel{font-size:11px;color:var(--dim);align-self:center;letter-spacing:1px;padding-right:1px}
  #toolBar .tbDiv{width:1px;background:var(--line);margin:2px 4px}
  #toolBar .tbInfo{font-size:10.5px;color:var(--dim);align-self:center;padding-left:6px}
  /* 建造坞的**分类页签**（纪元1800 式：按居民阶层往上排，最后三项是不分阶层的公共设施 / 港口 / 军事） */
  #toolBar .tbTabs{gap:4px;padding-top:1px;border-top:1px solid var(--line);margin-top:1px}
  #toolBar .tbTab{padding:3px 8px;font-size:11px;min-width:0;letter-spacing:0}
  #toolBar .tbTab.on{border-color:var(--gold);color:var(--gold);background:rgba(212,175,55,.14)}
  #toolBar .tbTab .tbN{font-size:9.5px;color:var(--dim);margin-left:3px}
  #toolBar .tbTab.on .tbN{color:var(--gold)}
  /* 建筑卡：图标 + 名字 + 造价占地三行；放不下 / 没解锁的卡灰掉（原因写在 title 里） */
  #toolBar .tbCards{max-height:96px;overflow-y:auto;justify-content:flex-start}
  #toolBar .tbCards button{min-width:72px;max-width:104px;padding:4px 5px}
  #toolBar .bcIco{display:block;font-size:15px;line-height:1.15}
  #toolBar .bcName{display:block;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #toolBar .bcSub{display:block;font-size:9.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #toolBar button.locked{opacity:.42}
  #login{position:fixed;inset:0;background:radial-gradient(circle at 50% 40%,#123246,#08131b 70%);
    display:flex;align-items:center;justify-content:center;z-index:100}
  #login .box{width:400px;background:var(--panel2);border:1px solid var(--line);border-radius:16px;padding:28px}
  #login h1{margin:0 0 6px;font-size:24px;color:var(--gold);letter-spacing:2px}
  #login p{margin:0 0 18px;color:var(--dim);font-size:13px}
  #login .box>*{margin-bottom:10px}
  .err{color:#ff9a9a;font-size:12px;min-height:16px}
  ::-webkit-scrollbar{width:7px}::-webkit-scrollbar-thumb{background:rgba(120,180,210,.25);border-radius:4px}
</style>
</head>
<body>

<canvas id="scene"></canvas>

<div id="hud" class="panel">
  <span><i id="wsdot" class="dot off"></i><span id="wsTxt">未连接</span></span>
  <span class="sep"></span>
  <span>金币 <b id="hGold">0</b></span>
  <span>声望 <b id="hRep">0</b></span>
  <span class="sep"></span>
  <span>在线 <b id="hOnline">0</b></span>
  <span>心跳 <b id="hTick">0</b></span>
  <span class="sep"></span>
  <span>街上 <b id="hNpc">0</b></span>
  <span id="hClock" class="muted">第 1 天 07:00</span>
  <span id="hWeather" class="muted">☀ 晴</span>
  <button id="musicBtn" title="背景音乐 开/关">🎵</button>
  <button id="sfxBtn" title="音效 开/关">🔔</button>
  <span class="sep"></span>
  <span id="hIsland" class="muted">—</span>
</div>

<div id="left" class="panel">
  <div class="sect"><h3>选中目标</h3><div id="selBox"></div></div>
</div>

<div id="right" class="panel">
  <div class="tabs">
    <button data-tab="stock" class="on">仓库</button>
    <button data-tab="trade">交易</button>
  </div>
  <div id="tab-stock"></div>
  <div id="tab-trade" style="display:none"></div>
</div>

<!-- 世界市场入口：右下角常驻小按钮 —— 行情不再常驻右侧面板，收进弹层，
     点开才能看（点商品行照样能买卖，走 openTradeDialog） -->
<button id="worldBtn" title="世界市场行情">🌍 世界</button>
<div id="worldMask">
  <div id="worldBox">
    <div id="worldHead"><b>🌍 世界市场</b><button id="worldClose" title="关闭（Esc）">×</button></div>
    <div id="worldMarket"></div>
  </div>
</div>

<!-- 远征探险：组建远征队 / 航行进度 / 事件抉择 / 探险图鉴 -->
<button id="expBtn" title="远征探险：组建远征队出海，寻找传说中的骷髅岛">🧭 远征</button>
<div id="expMask">
  <div id="expBox">
    <div id="expHead"><b>🧭 远征探险</b><button id="expClose" title="关闭（Esc）">×</button></div>
    <div id="expCreate"></div>
    <div id="expList"></div>
    <div id="expDiscBox"></div>
  </div>
</div>
<div id="expCardMask">
  <div id="expCard">
    <h3 id="expCardTitle">—</h3>
    <div id="expCardText"></div>
    <div id="expCardStats"></div>
    <div id="expCardOpts"></div>
    <div id="expCardTimer"><i style="width:100%"></i></div>
  </div>
</div>

<!-- 造船厂对话框：点岛上的造船厂建筑打开 —— 船型开工 / 船台进度 / 舰队一览 -->
<div id="shipMask">
  <div id="shipBox">
    <div id="shipHead"><b>🚢 造船厂</b><button id="shipClose" title="关闭（Esc）">×</button></div>
    <div id="shipBody"></div>
  </div>
</div>

<div id="toolBar" class="panel"></div>

<div id="placeBar" class="panel">
  <span id="placeWhat">—</span>
  <span id="roadKinds"></span>
  <span id="placeWhy" class="why"></span>
  <button id="placeRot" title="旋转 90°（快捷键 R）：门会改开在下一个方向，同时决定横着摆还是竖着摆">旋转 90°</button>
  <button id="placeCancel" class="danger" title="放下手里的东西（快捷键 Esc / 鼠标右键）">取消</button>
</div>

<div id="log" class="panel"></div>
<div id="toasts"></div>

<!-- 铲除确认弹框：松手/点击后先弹这个，「确认铲除」点了才真动手 -->
<div id="confirmMask">
  <div id="confirmBox">
    <div id="confirmTitle"></div>
    <div id="confirmBody"></div>
    <div id="confirmBtns">
      <button id="confirmNo">取消</button>
      <button id="confirmYes" class="danger">确认铲除</button>
    </div>
  </div>
</div>

<div id="login">
  <div class="box">
    <h1>纪元 1800</h1>
    <p>3D 海岛 · 修路 / 种植 / 生产 / 贸易</p>
    <input id="nameIn" placeholder="你的贸易公司名，如：南海商会" autocomplete="off">
    <div class="err" id="loginErr"></div>
    <button class="gold" id="enterBtn" style="width:100%;padding:9px">进入世界</button>
    <div style="font-size:11.5px;color:var(--dim);margin-top:6px">首次进入会自动注册；同名会帮你找回上次的存档。</div>
  </div>
</div>

<script type="importmap">
{
  "imports": {

function fieldDist(farm, x, z) {
  const w = farm.sizeW || 1, h = farm.sizeH || 1;
  const dx = Math.max(0, Math.max(farm.gridX - x, x - (farm.gridX + w - 1)));

}

/* ------------------------------------------------------------
   朝向（rotation）：0=门朝南(+z) / 90=门朝东(+x) / 180=门朝北(-z) / 270=门朝西(-x)
   —— 和服务端 BuildingType.normalizeRotation / perimeterSideOf 是同一套规则，
   改规则时两边必须一起改。
   它同时是"这厂怎么摆"：90°/270° 会把占地宽高对调，
   所以 4×3 的纺织厂既能横着占 4×3，也能竖着占 3×4。
   ------------------------------------------------------------ */
const ROT_LABEL = { 0:'南', 90:'东', 180:'北', 270:'西' };
const normRot  = deg => (((Math.round(deg / 90) * 90) % 360) + 360) % 360;
const rotAngle = rot => normRot(rot) * Math.PI / 180;          // three.js 里的 Y 轴旋转角
const isQuarterTurn = rot => normRot(rot) % 180 !== 0;

/** 按朝向换算实际占地：90°/270° 宽高对调 */
function sizeOfRot(type, rotation) {
  const b = sizeOf(type);
  return isQuarterTurn(rotation) ? { w:b.h, h:b.w } : { w:b.w, h:b.h };
}

/** 占地外圈某一侧（门那一侧）贴着占地外边的那些格子 —— 不含角格，门只能开在一条边上 */
function sideCells(x, z, w, h, rotation) {
  const cells = [];
  switch (normRot(rotation)) {
    case 0:   for (let i = x; i < x + w; i++) cells.push([i, z + h]); break;
    case 90:  for (let j = z; j < z + h; j++) cells.push([x + w, j]); break;
    case 180: for (let i = x; i < x + w; i++) cells.push([i, z - 1]); break;
    case 270: for (let j = z; j < z + h; j++) cells.push([x - 1, j]); break;
  }
  return cells;
}

/** 占地外圈某一侧有几格马路（**不含角格**，门只能开在一条边上） */
function sideRoadCount(x, z, w, h, rotation) {
  return sideCells(x, z, w, h, rotation).filter(([cx, cz]) => hasRoad(cx, cz)).length;
}

/**
 * 门那一侧外面有多少水：**网格之外**的格数 ×100 + **海岸带**格数。
 * 与服务端 ProductionService.seaOnSide 同一套打分 —— 权重取 100 是为了让
 * "贴着岛边、门前就是水"永远赢过"站在沙滩上但门朝内陆"，平手才轮到海岸格数。
 */
function sideSeaCount(x, z, w, h, rotation) {
  let out = 0, coast = 0;
  for (const [cx, cz] of sideCells(x, z, w, h, rotation)) {
    if (!isLandCell(cx, cz)) out++;
    else if (isCoastCell(cx, cz)) coast++;
  }
  return out * 100 + coast;
}

/**
 * 自动朝向：把大门吸附到"门口马路最多"的那一侧。
 * 与服务端 ProductionService.autoRotation **逐条对齐**，否则预览里看到的门
 * 和落库后的 rotation 会打起来（玩家眼里就是"放下去才拐了个弯"）：
 *   ① 候选顺序：分数高的优先，平手按 南→东→北→西；
 *   ② 分数：普通建筑数门口那一侧的马路格，骑岸线的建筑数水格（×100）+ 沙滩格；
 *   ③ 取第一个**放得下**的朝向（岛边可能只有横着放得下，这时门朝向让位于"能不能放下"）。
 * <p>
 * 【参数是鼠标那一格（占地中心），不是左上角】90°/270° 会把宽高对调，
 * 四个朝向的**锚点各不相同** —— 必须逐个朝向先算锚点再打分，
 * 拿中心格当锚点去数是这套逻辑最经典的错位（看起来只差一格，吸到的却是另一条边）。
 */
function autoRotation(type, cx, cz) {
  const coastal = isCoastalBld(type);
  const cands = [0, 90, 180, 270].map(rot => {
    const { w, h } = sizeOfRot(type, rot);
    const a = anchorFor(cx, cz, w, h);                 // ← 每个朝向自己的左上角
    const score = coastal ? sideSeaCount(a.x, a.z, w, h, rot) : sideRoadCount(a.x, a.z, w, h, rot);
    return { rot, score, ok: canPlaceAt(a.x, a.z, w, h, type).ok };
  });
  cands.sort((a, b) => (b.score - a.score) || (a.rot - b.rot));
  return (cands.find(c => c.ok) || cands[0]).rot;
}

/**
 * 当前这块地实际会用哪个朝向：手里按过 R 就听玩家的（S.place.rot），否则自动吸附道路。
 * 「自动」是常态 —— 玩家不必每次都想门朝哪边；**吸附结果必须在预览里就看得到**，
 * 所以预览（`updateFootprint`）和落子（`placeAt`）都走这一个函数，
 * 落子时还要把它显式发给服务端：看见什么朝向，建出来就是什么朝向。
 *
 * @param cx 鼠标那一格（占地中心），内部会按朝向换算锚点
 */
function currentRotation(type, cx, cz) {
  const p = S.place;
  const manual = (p && p.kind === 'building' && p.type === type) ? p.rot : null;
  return manual != null ? manual : autoRotation(type, cx, cz);
}

async function api(path, method = 'GET', body) {
  const res = await fetch(API + path, {
    method,
    headers: body ? { 'Content-Type':'application/json' } : {},
    body: body ? JSON.stringify(body) : undefined,
  });
  const json = await res.json();
  if (!json.ok) throw new Error(json.message || '请求失败');
  return json.data;
}

let ws = null;
function connectWS() {
  try { ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws'); }
  catch { return; }
  ws.onopen = () => {
    S.wsOk = true; syncWsDot();
    ws.send(JSON.stringify({ type:'auth', playerId:S.playerId }));
    logLine('已接入联机世界', true);
  };
  ws.onclose = () => { S.wsOk = false; syncWsDot(); setTimeout(connectWS, 3000); };
  ws.onerror = () => { S.wsOk = false; syncWsDot(); };
  ws.onmessage = ev => {
    let m; try { m = JSON.parse(ev.data); } catch { return; }
    if (m.type === 'world') {
      S.market = m.data.market || []; S.online = m.data.onlinePlayers || 0; S.tick = m.data.tick || 0;
      renderMarket(); renderHud();
    } else if (m.type === 'snapshot') applySnapshot(m.data);   // 自己的世界：金币 / 库存 / 建筑 / 人口
    else if (m.type === 'event') onGameEvent(m.data);
    else if (m.type === 'expedition') onExpeditionPush(m.data); // 远征：事件卡 / 结算即时推给本人
    else if (m.type === 'ship') onShipPush(m.data);             // 造船：新船下水 / 船台被拆
    else if (m.type === 'chat') logLine('💬 ' + m.data.from + '：' + m.data.text);
  };
}

/* 事件现在只负责"报个信"。
   数据不再由事件触发回拉 —— 服务端每 3 秒推一份**完整个人快照**（type:"snapshot"），
   客户端收到就整体重画。原先每收到一个事件（尤其是厂房每产完一轮的 PRODUCED）
   都要回拉 1~2 个 HTTP，世界越热闹请求越多，现在这条路整个拿掉了。 */
function onGameEvent(e) {
  if (!e) return;
  /* 马车动画：只演自己岛上的车（事件是全服广播的）。DISPATCHED 起一辆、ARRIVED 收掉一辆 */
  if (e.type === 'CART_DISPATCHED') { spawnCart(e.payload || {}); }
  if (e.type === 'CART_ARRIVED') { returnCart((e.payload || {}).buildingId); }
  /* 伐木场真砍树：把那棵树从森林里"领走"（数据层立即），倒下演出交给伐木工
     挥斧触发 —— 没工人在场才立即兜底演出（不 toast —— 10 秒一条太吵） */
  if (e.type === 'TREE_CHOPPED') {
    const p = e.payload || {};
    if (!S.island || p.islandId === S.island.id) chopTreeAt(p.x, p.z, p.buildingId, p.regrowAt);
  }
  /* 满仓滞留：门口那辆车标成 stuck —— 兜底收车跳过它，等 ARRIVED 再演回程 */
  if (e.type === 'WAREHOUSE_FULL' && e.payload) {
    const c = carts.get(e.payload.buildingId);
    if (c) c.stuck = true;
  }
  const mine = !e.payload || e.payload.playerId == null || String(e.payload.playerId) === String(S.playerId);
  const f = EVENT_TEXT[e.type];
  const text = f ? f(e.payload || {}) : e.type;
  if (mine) { toast(text); logLine(text, true); } else logLine(text);
  /* 音效：自己的事响亮些，别人的事音量减半 —— 世界热闹但不吵 */
  const sf = EVENT_SFX[e.type];
  if (sf) playSfx(sf, mine ? 1 : 0.45);
}

const WATER_DAY = new THREE.Color(0x0e3d57), WATER_NIGHT = new THREE.Color(0x021524);

{

    waterOBR.call(this, renderer, sc, cam, geo, mat, group);

/* 深海床：Water 半透明后下面得有"底" —— 深海色平板，把整体水色压深。

const oceanBed = new THREE.Mesh(new THREE.PlaneGeometry(4000, 4000),

/**
 * 虚拟浪高：四道正弦叠出来的有机波动（相对平均水面的偏移）。
 * <p>
 * 【海面换官方 Water 后它不再驱动几何】水面是平的，本函数只剩一个消费者：
 * 商船浮沉（jsm/ships.js 的 seaHeight 参数）—— 且经 seaLevelAt 压小后再用。
 * 它仍是**世界坐标 + 时间**的纯函数，不依赖任何逐帧可变的外部状态。
 */
function seaHeight(x, z, t) {
  const w = Math.sin(x * 0.075 + t * 0.85) * 0.26
          + Math.cos(z * 0.100 - t * 0.65) * 0.18
          + Math.sin((x + z) * 0.140 + t * 1.50) * 0.09
          + Math.sin((x - z) * 0.090 + t * 1.10) * 0.10;
  /* 幅度随离岛距离衰减（260 内全浪，430 外归零）：贴岸浪花明显、远海平静 */
  const r = Math.sqrt(x * x + z * z);
  if (r >= 430) return 0;
  if (r > 260) { const k = 1 - (r - 260) / 170; return w * k * k * (3 - 2 * k); }
  return w;
}
/** 水面在世界里的高度（船直接用它摆位置）。
    官方 Water 的水面是平的，全幅起伏会让船在平水上"沉"半截 —— 压到 1/4 当呼吸感 */
function seaLevelAt(x, z, t) { return SEA_Y + seaHeight(x, z, t) * 0.25; }

/* ---- 岛屿（由服务端下发的地形图逐格拼出来，见 buildTerrainMesh） ---- */

const TOP_Y = 0.61;

/* 射线拾取目标：按类别分开维护，任一类重建后调用 refreshPickables() 汇总，
   避免"已拆掉的马路 / 旧建筑"残留在拾取列表里被点中。
   pickTerrain 是"岛体本身"：底块 / 山地 / 矿脉。地形图逐格拼岛之后，岛不再是那个大方盒，
   不把这几块也收进拾取列表，点到山和矿就会"什么都没选中"。 */
const pickables = [];
const pickGrid = [], pickPlots = [], pickRoads = [], pickBlds = [], pickTerrain = [];
function refreshPickables() {
  pickables.length = 0;
  for (const arr of [pickGrid, pickPlots, pickRoads, pickBlds, pickTerrain]) pickables.push(...arr);
}

/** 清空分组，并释放本轮自己 new 出来的 geometry（共享 geometry 不要塞进来） */
function clearOwned(group, owned) {
  for (const g of owned) g.dispose();
  owned.length = 0;
  group.clear();
}
const plotOwnedGeo = [], bldOwnedGeo = [], roadOwnedGeo = [];

/**
 * 岛屿是由**地形图逐格拼出来的**，不是一个大方盒 ——
 * 轮廓不规则、岸线弯弯曲曲，海里还有山。
 *
 * 做法：两层 InstancedMesh。
 *   ① 底块：每格陆地一块厚板，从水下一直长到地表，颜色是沙土色 —— 从侧面看就是"岛壁入海"，
 *      不再需要那个"往外扩一圈"的假沙滩边。
 *   ② 地表砖：每格一块薄砖，按地形上色（沙滩 / 草地 / 岩地 / 矿脉）。
 * 两层都用 InstancedMesh（一个 draw call 画上千格），36×36 也不掉帧。
 */
let landBaseMesh = null, mountainMesh = null, oreMesh = null;

function buildIslandMesh() {
  buildTerrainMesh();
}

function buildTerrainMesh() {
  for (const m of [landBaseMesh, mountainMesh, oreMesh]) {
    if (m) { island.remove(m); m.geometry.dispose(); m.material.dispose(); }
  }
  landBaseMesh = mountainMesh = oreMesh = null;
  pickTerrain.length = 0;

  const ground = [], rocks = [], ores = [];
  for (let z = 0; z < GRID; z++) {
    for (let x = 0; x < GRID; x++) {
      if (!isLandCell(x, z)) continue;
      const [wx, wz] = cellToWorld(x, z);
      ground.push([wx, wz, x, z]);
      if (isMountainCell(x, z)) rocks.push([wx, wz, x, z]);
      else if (oreAtCell(x, z) !== TERRAIN.PLAIN) ores.push([wx, wz, x, z]);
    }
  }

  /* ① 底块：厚 3.4，顶面在 TOP_Y + 台地高（丘陵格整体抬高，沙土侧壁就是土坎） */
  if (ground.length) {
    const geo = new THREE.BoxGeometry(CELL * 1.0, TOP_Y + 3.4, CELL * 1.0);
    const mat = new THREE.MeshStandardMaterial({ color:0xcdb98a, roughness:.95 });
    landBaseMesh = new THREE.InstancedMesh(geo, mat, ground.length);
    const d = new THREE.Object3D();
    ground.forEach(([wx, wz, gx, gz], n) => {
      const h = cellH(gx, gz);
      const th = TOP_Y + h + 3.4;                       // 抬升后的整块高
      d.position.set(wx, (TOP_Y + h) - th / 2, wz);
      d.scale.set(1, th / (TOP_Y + 3.4), 1);            // 只纵向拉伸，顶面正好落在 TOP_Y + h
      d.updateMatrix();
      landBaseMesh.setMatrixAt(n, d.matrix);
    });
    landBaseMesh.instanceMatrix.needsUpdate = true;
    /* 让射线能反查"点到的是哪一格"：cells 与实例一一对应（见上面的布局循环） */
    landBaseMesh.userData = { kind:'terrain', cells: ground.map(g => [g[2], g[3]]) };
    island.add(landBaseMesh);
    pickTerrain.push(landBaseMesh);
  }

  /* ② 山地：**一整张连续高度场网格**，不是每格一座锥。
     做法：距离场决定每格山的目标高度（山脚矮、山心高）→ 把高度摊到**格点**
     （每点取周围 2×2 格的平均）→ 相邻格共享格点，山脊是一条贯穿多格的连贯坡线，
     整片山熔成一个山体，彻底去掉"一个格子一座山"的格子感。
     低多边形味靠 flatShading 的棱面；颜色按高度分层：山脚草灰 → 岩灰 → 浅岩 → 峰顶积雪。 */
  if (rocks.length) {
    const seed = (S.island ? S.island.id : 1) * 7919;

    /* 距离场：山格到"最近非山格"的步数（BFS，4 邻域）—— 山脚 0，越往山心越大。
       多格山连片时，中心的格子自然最高，边上的自然矮下去，山脉的"大势"就出来了。 */
    const dist = new Map();
    let frontier = [];
    for (const [, , x, z] of rocks) {
      for (const [dx, dz] of [[1,0],[-1,0],[0,1],[0,-1]]) {
        if (!isMountainCell(x + dx, z + dz)) { dist.set(x + ',' + z, 0); frontier.push([x, z]); break; }
      }
    }
    while (frontier.length) {
      const next = [];
      for (const [x, z] of frontier) {
        const base = dist.get(x + ',' + z);
        for (const [dx, dz] of [[1,0],[-1,0],[0,1],[0,-1]]) {
          const k = (x + dx) + ',' + (z + dz);
          if (isMountainCell(x + dx, z + dz) && !dist.has(k)) { dist.set(k, base + 1); next.push([x + dx, z + dz]); }
        }
      }
      frontier = next;
    }
    let maxD = 1;
    for (const v of dist.values()) maxD = Math.max(maxD, v);
    const CAP = Math.min(5, maxD);   // 超过这个深度就算"山心"：改按对数继续长高（见 peakF）

    /* 距离场做**两遍** 4 邻域均值模糊：山脊的高度过渡是条顺滑的坡线，而不是逐格台阶 */
    let smooth = new Map(dist);
    for (let pass = 0; pass < 2; pass++) {
      const next = new Map();
      for (const [k, v] of smooth) {
        const [x, z] = k.split(',').map(Number);
        let sum = v, cnt = 1;
        for (const [dx, dz] of [[1,0],[-1,0],[0,1],[0,-1]]) {
          const nv = smooth.get((x + dx) + ',' + (z + dz));
          if (nv !== undefined) { sum += nv; cnt++; }
        }
        next.set(k, sum / cnt);
      }
      smooth = next;
    }

    /* 每格的目标峰高（世界单位）。t：0 山脚 → 1 山心边缘。
       【山脚必须贴地】基础高度只给 0.35 格 —— 若山脚太高，山地与平原的交界一格外就
       拔起两个单位，边缘每格都成悬崖锥，整座山看着就是"一排排尖刺"。
       【山心绝不"限高"钳平】距离场超过 CAP 的部分不能钳到同一个最大高度 ——
       那会把大山的 interior 削成一块 plateau（120 格大岛山块又大，平顶尤其扎眼）。
       超深部分按近线性继续涨（每深 1 格高度照常走，山心越深峰越尖），
       再叠一道低频脊线噪声调制涨幅：同一座大山里有的峰猛、有的缓，长出"一主几次"的真山脊。
       起伏不靠逐格随机（那会留下"一格一包"的蛋壳纹），低频值噪声做大尺度调制。 */
    const cellH = new Map();
    let minX = 1e9, maxX = -1e9, minZ = 1e9, maxZ = -1e9;
    for (const [, , x, z] of rocks) {
      const raw = smooth.get(x + ',' + z) || 0;
      const t = raw / CAP;
      const mod = 0.86 + 0.28 * smoothNoise(x * 0.13 + seed * 0.017, z * 0.13 + seed * 0.011);
      const ridge = smoothNoise(x * 0.085 + seed * 0.031, z * 0.085 - seed * 0.023);
      const peakF = t <= 1
        ? Math.pow(t, 1.35)
        : 1 + (t - 1) * 1.1 * (0.45 + 0.55 * ridge);
      cellH.set(x + ',' + z, CELL * (0.35 + peakF * 2.5) * mod);
      if (x < minX) minX = x; if (x > maxX) maxX = x;
      if (z < minZ) minZ = z; if (z > maxZ) maxZ = z;
    }
    /** 格点高度：取周围 2×2 格峰高的平均（缺格算 0）—— 这一步就是"熔合成一座山"的关键，
        相邻格在格点处共用同一个高度，坡面连续、再没有逐格断层 */
    const cornerH = (vx, vz) => {
      let sum = 0;
      for (const [ox, oz] of [[-1,-1],[0,-1],[-1,0],[0,0]]) sum += cellH.get((vx + ox) + ',' + (vz + oz)) || 0;
      return sum / 4;
    };

    /* 网格范围往外扩 1 格：边缘格点高度必为 0，山坡正好落地接到平原 */
    const x0 = minX - 1, z0 = minZ - 1, W = maxX - minX + 3, H = maxZ - minZ + 3;
    const cC = (GRID - 1) / 2;
    const pos = new Float32Array(W * H * 3), colArr = new Float32Array(W * H * 3);
    const idx = [];
    let maxH = 0.1;
    for (let j = 0; j < H; j++) {
      for (let i = 0; i < W; i++) {
        const vx = x0 + i, vz = z0 + j;
        /* 高频细部噪声只留一丝棱面变化（按高度比例缩放，平地格点保持 0）——
           幅度一大就是逐格波纹，山又变回"锯齿" */
        const n1 = (smoothNoise(vx * 0.3 + seed * 0.017, vz * 0.3 + seed * 0.011) - 0.5) * 0.05;
        const h = cornerH(vx, vz) * (1 + n1);
        if (h > maxH) maxH = h;
        const o = (j * W + i) * 3;
        pos[o] = (vx - cC) * CELL;
        pos[o + 1] = TOP_Y - 0.06 + h;
        pos[o + 2] = (vz - cC) * CELL;
      }
    }
    /* 顶点色：按高度占满峰高的比例分层，叠一层确定性抖动免得太"等高线" */
    const C_FOOT = new THREE.Color(0x8f9573), C_ROCK = new THREE.Color(0x7b7566),
          C_HIGH = new THREE.Color(0x9a948a), C_SNOW = new THREE.Color(0xe9edf2);
    const col = new THREE.Color();
    for (let j = 0; j < H; j++) {
      for (let i = 0; i < W; i++) {
        const o = (j * W + i) * 3;
        const h = pos[o + 1] - (TOP_Y - 0.06);
        const dith = (smoothNoise((x0 + i) * 0.53 + 7, (z0 + j) * 0.53 + 13) - 0.5) * 0.08;
        /* 按实际峰高归一（0.88*maxH ≈ 旧版写死的 CELL*2.85）：山加高后雪线跟着峰顶走，
           不会从半山腰就开始一片白 */
        const tone = Math.max(0, Math.min(1, h / (maxH * 0.88) + dith));
        if (tone < 0.3) col.copy(C_FOOT).lerp(C_ROCK, tone / 0.3);
        else if (tone < 0.62) col.copy(C_ROCK).lerp(C_HIGH, (tone - 0.3) / 0.32);
        else if (tone < 0.92) col.copy(C_HIGH).lerp(C_SNOW, (tone - 0.62) / 0.3);
        else col.copy(C_SNOW);
        colArr[o] = col.r; colArr[o + 1] = col.g; colArr[o + 2] = col.b;
      }
    }
    /* 四边形**棋盘式交替**切对角线：同一方向切的话，flat shading 下每条折边平行排列，
       山面会出现规则的"灯芯绒"斜纹；交替切分把棱面打散成自然的低多边形 mosaic */
    for (let j = 0; j < H - 1; j++) {
      for (let i = 0; i < W - 1; i++) {
        const a = j * W + i, b = a + 1, c2 = a + W, d2 = c2 + 1;
        if ((i + j) % 2 === 0) idx.push(a, c2, b, b, c2, d2);   // 斜线 b-c2
        else idx.push(a, c2, d2, a, d2, b);                     // 斜线 a-d2
      }
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    geo.setAttribute('color', new THREE.BufferAttribute(colArr, 3));
    geo.setIndex(idx);
    geo.computeVertexNormals();
    mountainMesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({
      vertexColors:true, roughness:.95, flatShading:true }));
    /* 普通 Mesh 没有 instanceId：拾取处用命中点坐标反查格子（见 pick 的 terrain 分支） */
    mountainMesh.userData = { kind:'terrain', heightfield:true, cells: rocks.map(g => [g[2], g[3]]) };
    island.add(mountainMesh);
    pickTerrain.push(mountainMesh);
  }

  /* ③ 矿脉：几颗露头的矿石堆。铁矿偏青灰、黏土偏赭石，一眼能认出"这里能开矿" */
  if (ores.length) {
    const geo = new THREE.DodecahedronGeometry(CELL * 0.34, 0);
    const mat = new THREE.MeshStandardMaterial({ color:0xffffff, roughness:.6, flatShading:true });
    oreMesh = new THREE.InstancedMesh(geo, mat, ores.length * 2);
    const d = new THREE.Object3D(), col = new THREE.Color();
    const seed = (S.island ? S.island.id : 1) * 104729;
    let n = 0;
    ores.forEach(([wx, wz, x, z]) => {
      const iron = atCell(x, z) === TERRAIN.IRON;
      for (let k = 0; k < 2; k++) {
        const r1 = seededRand(seed + x * 131 + z * 17 + k), r2 = seededRand(seed + x * 977 + z * 53 + k);
        d.position.set(wx + (r1 - .5) * CELL * 0.42, TOP_Y + CELL * 0.2, wz + (r2 - .5) * CELL * 0.42);
        d.rotation.set(r1 * Math.PI, r2 * Math.PI, r1 * 2);
        d.scale.setScalar(0.7 + r2 * 0.5);
        d.updateMatrix();
        oreMesh.setMatrixAt(n, d.matrix);
        col.setHex(iron ? 0x6d8b9a : 0xc0764a);
        oreMesh.setColorAt(n, col);
        n++;
      }
    });
    oreMesh.count = n;
    oreMesh.instanceMatrix.needsUpdate = true;
    if (oreMesh.instanceColor) oreMesh.instanceColor.needsUpdate = true;
    /* 矿脉一格摆了两颗石头，所以 cell 列表要跟着重复一份，才能和 instanceId 对齐 */
    const oreCells = [];
    for (const g of ores) { oreCells.push([g[2], g[3]], [g[2], g[3]]); }
    oreMesh.userData = { kind:'terrain', cells: oreCells };
    island.add(oreMesh);
    pickTerrain.push(oreMesh);
  }
  buildShallowWater();
  buildBeachSkirt();
  refreshPickables();
}

/* ---- 浅海：贴岸的渐变水色 + 与海面同频的浪花 ----
   官方 Water 是一整块平的，贴岸那几格的青绿渐变铺不开 —— 所以贴岸 3 圈
   另起一层**格分辨率**的浅水网格：颜色由"离岸距离"决定，贴岸一圈清透的
   绿松石色，往外逐圈溶回水色，外圈 +0.02 与平水面齐平无缝。
   【与官方 Water 同频】之前浅水的泡沫是自备的正弦节奏，跟海面波光两套钟各跳各的
   （用户实锤截图：岸边的浪和海"不契合"）。现在泡沫改在 shader 里采
   **Water 同一张 waternormals + 同一个 time uniform**（buildShallowMaterial）——
   岸边浪花跟着海面波光一起动，看起来才是同一片海。
   【必须加 SEA_Y】水面基准 -0.6 挂在 Water 网格的 position.y 上；浅水网格挂的是
   island 组（y=0），自己不加的话整层浅水悬空在水面上方 0.6 —— 海滩的水和海
   "隔空"（实锤截图，修过一次）。 */
const SHALLOW_RINGS = 3;
const SHALLOW_NEAR = new THREE.Color(0x8fe4d2), SHALLOW_FOAM = new THREE.Color(0xe8fbf4);
let shallowMesh = null;
let shallowDistCache = { sig:'', dist:null };

/** 水格离岸多远：BFS 从陆地长进水里（贴岸 1，最多算 SHALLOW_RINGS 圈）。
    【网格外也算海】老岛的陆地可能压在网格边上（新岛已由服务端边界退让避免），
    压边的岸如果只认网格内的水格，边界那条"直线切口"就没有裙边、没有浪 ——
    一条被尺子切出来的直壁。把 BFS 撒到网格外 M 圈，裙边和浅水就能包住切口。 */
const SEA_MARGIN = 3;   // 网格外扩圈数（≥ SHALLOW_RINGS 才够裙边铺满）
function waterDistanceMap() {
  const sig = GRID + '|' + terrain;
  if (shallowDistCache.sig === sig) return shallowDistCache.dist;
  const dist = new Map(), q = [];
  const outMargin = (x, z) => x < -SEA_MARGIN || z < -SEA_MARGIN || x >= GRID + SEA_MARGIN || z >= GRID + SEA_MARGIN;
  for (let z = 0; z < GRID; z++) for (let x = 0; x < GRID; x++) {
    if (!isWaterCell(x, z)) continue;
    for (const [dx, dz] of [[1,0],[-1,0],[0,1],[0,-1]]) {
      const nx = x + dx, nz = z + dz;
      if (nx >= 0 && nz >= 0 && nx < GRID && nz < GRID && !isWaterCell(nx, nz)) {
        dist.set(keyOf(x, z), 1); q.push([x, z]); break;
      }
    }
  }
  /* 网格边的陆地，外面那一圈格外出海也是贴岸水（d=1 起） */
  for (let z = 0; z < GRID; z++) for (let x = 0; x < GRID; x++) {
    if (isWaterCell(x, z)) continue;
    for (const [dx, dz] of [[1,0],[-1,0],[0,1],[0,-1]]) {
      const nx = x + dx, nz = z + dz;
      if (!outMargin(nx, nz) && isWaterCell(nx, nz) && !dist.has(keyOf(nx, nz))) {
        dist.set(keyOf(nx, nz), 1); q.push([nx, nz]);
      }
    }
  }
  for (let i = 0; i < q.length; i++) {
    const [x, z] = q[i], d = dist.get(keyOf(x, z));
    if (d >= SHALLOW_RINGS) continue;
    for (const [dx, dz] of [[1,0],[-1,0],[0,1],[0,-1]]) {
      const nx = x + dx, nz = z + dz;
      if (outMargin(nx, nz) || !isWaterCell(nx, nz)) continue;
      const k = keyOf(nx, nz);
      if (!dist.has(k)) { dist.set(k, d + 1); q.push([nx, nz]); }
    }
  }
  shallowDistCache = { sig, dist };
  return dist;
}

function buildShallowWater() {
  if (shallowMesh) { island.remove(shallowMesh); shallowMesh.geometry.dispose(); shallowMesh.material.dispose(); }
  shallowMesh = null;
  const dist = waterDistanceMap();
  if (!dist.size) return;

  /* 顶点去重：相邻格共享角点（Indexed 几何）。每个顶点记下邻接格的最小离岸距离 ——
     颜色按"离岸最近的那个格"取，浅色带才贴得住岸线 */
  const vid = new Map(), xs = [], zs = [], vd = [], quads = [];
  const corner = (x, z) => {
    const k = x + ',' + z;
    if (vid.has(k)) return vid.get(k);
    const id = xs.length;
    /* (x,z) 是**格点**（四格共享的角），不是格子 —— cellToWorld 给的是格心，
       必须再往左上收半格，顶点才真正落在格子的角上；差这半格，岸线就会露出一条水带 */
    const [wx, wz] = cellToWorld(x - 0.5, z - 0.5);
    xs.push(wx); zs.push(wz); vd.push(999);
    vid.set(k, id);
    return id;
  };
  for (const [k, d] of dist) {
    const [x, z] = k.split(',').map(Number);
    const a = corner(x, z), b = corner(x + 1, z), c = corner(x, z + 1), e = corner(x + 1, z + 1);
    quads.push(a, b, c, e);
    vd[a] = Math.min(vd[a], d); vd[b] = Math.min(vd[b], d);
    vd[c] = Math.min(vd[c], d); vd[e] = Math.min(vd[e], d);
  }
  const n = xs.length, pos = new Float32Array(n * 3), col = new Float32Array(n * 3),
        shore = new Float32Array(n), idx = [];
  for (let i = 0; i < n; i++) {
    const d = vd[i];
    /* 贴岸权重 w：1 贴岸 → 0 最外圈。旧版外圈 k 还剩 1/3，青色没褪干净，
       浅水与深海交界就是一圈硬边；现在外圈归零，颜色与海面完全接轨 */
    const w = Math.max(0, Math.min(1, 1 - (d - 1) / (SHALLOW_RINGS - 1)));
    shore[i] = w;
    /* 基准高度一次烘进顶点（SEA_Y + 贴岸抬升），逐帧的 wig 摆动搬进 shader */
    pos[i * 3] = xs[i]; pos[i * 3 + 1] = SEA_Y + 0.02 + 0.08 * w; pos[i * 3 + 2] = zs[i];
    const c = _gcA.copy(SEA_MID).lerp(SHALLOW_NEAR, Math.pow(w, 0.8) * 0.9);
    col[i * 3] = c.r; col[i * 3 + 1] = c.g; col[i * 3 + 2] = c.b;
  }
  for (let q = 0; q < quads.length; q += 4) {
    const a = quads[q], b = quads[q + 1], c = quads[q + 2], e = quads[q + 3];
    idx.push(a, c, b, b, c, e);   // 与山体高度场同一套朝上绕序
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
  geo.setAttribute('aShore', new THREE.BufferAttribute(shore, 1));
  geo.setIndex(idx);
  shallowMesh = new THREE.Mesh(geo, buildShallowMaterial());
  shallowMesh.renderOrder = 2;   // 浅水永远叠在海面（renderOrder 1）之上
  island.add(shallowMesh);
}

/** 浅水材质：MeshStandardMaterial 打补丁（onBeforeCompile）。
    核心是"跟官方 Water 认同一个海"：
    ① uniform 直接引用 water 的 time 对象 —— 同一份时钟，零漂移；
    ② 片元里采**同一张 waternormals** 出波纹，叠上"浪往岸上卷"的低频节奏，
       高于阈值就翻白沫 —— 泡沫带跟着海面波光同频起伏，不再是两套节奏各跳各的；
    ③ 顶点里只做水线 wig 摆动（原来的 CPU 逐帧顶点/颜色上传整个删掉）。 */
function buildShallowMaterial() {
  const mat = new THREE.MeshStandardMaterial({
    vertexColors:true, flatShading:true, roughness:.5, metalness:.05,
    transparent:true, opacity:.68, depthWrite:false });
  mat.onBeforeCompile = (shader) => {
    /* 编译探针：验证注入真的发生了（tools 脚本读 window.__annoShallowInfo） */
    window.__annoShallowInfo = {
      compiled: true,
      fragHasColorChunk: shader.fragmentShader.includes('#include <color_fragment>'),
      vertHasBegin: shader.vertexShader.includes('#include <begin_vertex>'),
    };
    shader.uniforms.uTime = water.material.uniforms['time'];   // 共享引用：与海面完全同步
    shader.uniforms.uNormals = { value: waterNormals };
    shader.uniforms.uFoam = { value: SHALLOW_FOAM };
    shader.vertexShader = `
      attribute float aShore;
      varying float vShore;
      varying vec2 vXZ;
      uniform float uTime;
    ` + shader.vertexShader.replace('#include <begin_vertex>', `
      #include <begin_vertex>
      vShore = aShore;
      vXZ = position.xz;
      transformed.y += aShore * 0.05 * sin(position.x * 1.7 + uTime * 3.0)
                                        * cos(position.z * 1.3 - uTime * 2.4);
    `);
    shader.fragmentShader = `
      varying float vShore;
      varying vec2 vXZ;
      uniform float uTime;
      uniform sampler2D uNormals;
      uniform vec3 uFoam;
    ` +     shader.fragmentShader.replace('#include <color_fragment>', `
      #include <color_fragment>
      /* 采样尺度对齐海面波光的细颗粒（0.14，约 7 格一个波纹），
         两层法线贴图相向滚动对出波纹，浪卷节奏叠在阈值上 —— 泡沫跟着海面同频起伏 */
      vec2 suv = vXZ * 0.12;
      float w1 = texture2D(uNormals, suv + uTime * vec2(0.035, 0.028)).g;
      float w2 = texture2D(uNormals, suv * 1.9 - uTime * vec2(0.026, 0.033)).g;
      float wave = w1 * 0.65 + w2 * 0.6;
      float roll = 0.5 + 0.5 * sin(dot(vXZ, vec2(0.42, 0.28)) - uTime * 2.2);
      float foam = smoothstep(0.52, 0.70, wave + roll * 0.25) * smoothstep(0.03, 0.45, vShore);
      diffuseColor.rgb = mix(diffuseColor.rgb, uFoam, foam * 0.9);
      /* 浪头提亮：波峰处加一点白，浅水带自己也有海面那种波光起伏 */
      diffuseColor.rgb += uFoam * smoothstep(0.78, 0.92, wave) * 0.3;
      /* 外圈淡出：透明度随贴岸权重走，浅水带溶进海面，不再有"奶玻璃"硬边 */
      diffuseColor.a *= smoothstep(0.0, 0.5, vShore);
    `);
  };
  return mat;
}

/* ---- 沙滩斜坡裙边：岸线从"断崖入水"变成"缓坡入水" ----
   之前的地表是一块块平板砖（顶面 y=0.71），海面在 -0.6 上下，中间是垂直岛壁 ——
   岸线永远是"断崖式落差"，一眼假。
   做法（与山体高度场同一套哲学 —— **一张连续网格，角点共享，绝无缝隙**）：
   覆盖贴岸 3 圈水格，每个角点按"离岸距离"沉降 —— 岸线角点与沙滩砖面齐平，
   水侧角点逐圈扎到海面以下。斜坡上缘与砖边共线无缝；浅海层的波浪一涨一落，
   **水线就在斜坡上来回进出**，浪花白斑时隐时现 —— 拍岸的效果是白送的。
   【沉降剖面必须"过水线就扎到浪谷以下"】浪谷最深到 -0.6-0.59=-1.19。若斜坡
   降得太缓（旧剖面第 2 圈才到 -0.74），浪一回落，第 2、3 圈整片坡体露出水面 ——
   看着就像海水"透明"了、能看见裙边底。现在第 2 圈直接扎到 -2.49（低于最深浪谷），
   水线被钳在第 2 圈这 1 格宽的带里进出，湿沙带窄而清晰。
   【别按"每条临水边拼一片斜面"做】转角处两片斜面方向不同，外缘一错开
   就是楔形缺口，岸线看着全是碎三角 —— 必须角点连续。 */
const SKIRT_TOP = TOP_Y + 0.1;         // 与地表砖顶面齐平
const SKIRT_DROP = [0.18, 3.2, 3.9];   // 水侧角点按 minDist 沉降：贴岸圈只降 0.18（沙滩往海面微微倾斜，
                                       // 不再是"平板 + 断崖"），第 2 圈扎到 -2.49（低于最深浪谷 -1.19，留足余量），第 3 圈更深（接近海床 -4.2）
const SKIRT_JITTER = 0.24 * CELL;      // 水侧角点的确定性水平扰动：坡脚线弯弯扭扭，不是一段段直线
/* 【沙滩不是一条泥边】纪元1800 的岸线是**一条亮金色的沙带**：陆地这边越往里越干越亮，
   到潮线压成湿沙，水下才是暗沙洲。之前水侧第 1 圈整片 0x8a7a58 深褐、陆地只有 1 圈暗黄，
   合起来就是"全是裙边、没有沙滩"。现在四档按"离水越远越干"排：
   干沙（岸线内缘）→ 湿沙（潮线）→ 水下暗沙（浅水层是半透明青绿，会再压一层蓝，所以水下沙可以比想象中亮）。 */
/* 沙滩四档，从陆地往海一层层压暗（水陆交界的那条才是"湿沙"）：
   干沙 #e8d5a4（陆地沙滩砖）/ 半湿 #dac294（沙洲内缘）/ 湿沙 #c0a877（沙洲外缘＝潮线）
   / 水下暗沙 #b09a6d → #7a6a4c（浅水层是半透明青绿，会再压一层蓝，所以水下沙可以比想象中亮）。 */
const SAND_DRY = new THREE.Color(0xe8d5a4);
const SAND_WET_MID = new THREE.Color(0xdac294);
const SAND_WET_DEEP = new THREE.Color(0xb09a6d), SAND_WET_ABYS = new THREE.Color(0x7a6a4c);
let skirtMesh = null;

function buildBeachSkirt() {
  if (skirtMesh) { island.remove(skirtMesh); skirtMesh.geometry.dispose(); skirtMesh.material.dispose(); }
  skirtMesh = null;
  const wd = waterDistanceMap();
  if (!wd.size) return;

  /* 角点表：岸线角点（周围 4 格有陆）高度齐砖面；水侧角点沉降 + 扰动。
     所有面共享同一份角点 → 网格连续；扰动按角点坐标算 → 共享面不撕裂 */
  const vKey = new Map(), vPos = [], vCol = [], quads = [];
  const corner = (x, z) => {
    const key = x + ',' + z;
    if (vKey.has(key)) return vKey.get(key);
    const id = vPos.length / 3;
    /* (x,z) 是**格点**（四格共享的角），不是格子 —— 必须从格心再收半格，
       顶点才落在格角上；差这半格，裙边上缘就离开砖边一条水带（截图里的不衔接） */
    const [wx0, wz0] = cellToWorld(x - 0.5, z - 0.5);
    /* 周围 4 格：这个格点是否还挨着陆地。网格外也照查 —— atCell 把格外出海当水，
       wd 里也有网格外的贴岸水格（老岛的边界切口就是这么包上裙边的） */
    let minD = 999, hasLand = false;
    for (const [ax, az] of [[x - 1, z - 1], [x, z - 1], [x - 1, z], [x, z]]) {
      if (isWaterCell(ax, az)) {
        const d = wd.get(keyOf(ax, az));
        if (d !== undefined) minD = Math.min(minD, d);
      } else { hasLand = true; break; }
    }
    let px = wx0, pz = wz0, py, col;
    /* 岸线内缘（还挨着陆地砖）= **半湿沙**：比陆地沙滩砖暗半档，往外一路压到湿沙、暗沙洲，
       于是"亮沙滩 → 潮线 → 水下"是连续的一条带，而不是"一块草地 + 一圈深色围裙"。 */
    if (hasLand) { py = SKIRT_TOP; col = SAND_WET_MID; }
    else {
      /* 全水角点：在浅水范围内按圈沉降；再往外（minD=999，敞海）直接按最深处理 ——
         绝不能抬回沙面高度，否则外海里会竖起一片沙色碎片 */
      const drop = minD === 999 ? SKIRT_DROP[SKIRT_DROP.length - 1]
        : (SKIRT_DROP[Math.min(minD, SKIRT_DROP.length) - 1] ?? SKIRT_DROP[SKIRT_DROP.length - 1]);
      py = SKIRT_TOP - drop;
      px += (hash2(x * 7.31, z * 5.17) - 0.5) * 2 * SKIRT_JITTER;   // 水侧角点扰动（全水角点，不挨砖边，随便挪）
      pz += (hash2(x * 3.71 + 13.7, z * 8.29 + 3.1) - 0.5) * 2 * SKIRT_JITTER;
      /* 潮线（贴岸第 1 圈外缘）= 湿沙，再往外才一层层沉进水里变暗 */
      col = minD <= 1 ? SAND_WET : (minD === 2 ? SAND_WET_DEEP : SAND_WET_ABYS);
    }
    vPos.push(px, py, pz);
    vCol.push(col.r, col.g, col.b);
    vKey.set(key, id);
    return id;
  };

  for (const [k, d] of wd) {
    if (d > SKIRT_DROP.length) continue;
    const [x, z] = k.split(',').map(Number);
    const a = corner(x, z), b = corner(x + 1, z), c = corner(x, z + 1), e = corner(x + 1, z + 1);
    quads.push(a, b, c, e);
  }
  if (!quads.length) return;
  const idx = [];
  for (let q = 0; q < quads.length; q += 4) {
    const a = quads[q], b = quads[q + 1], c = quads[q + 2], e = quads[q + 3];
    idx.push(a, c, b, b, c, e);   // 与山体/浅海同一套朝上绕序
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(vPos), 3));
  geo.setAttribute('color', new THREE.BufferAttribute(new Float32Array(vCol), 3));
  geo.setIndex(idx);
  geo.computeVertexNormals();
  skirtMesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({
    vertexColors:true, flatShading:true, roughness:.96, side:THREE.DoubleSide }));
  island.add(skirtMesh);
}

/* ---- 远景装饰岛 ----
   【为什么不再是圆盘】上一版这里是"24 边圆柱 + 四棵锥形树"，远看就是四个规规矩矩的圆圈。
   现在和主岛用**同一套**画法：逐格拼地形，海陆由「径向衰减 × 角向起伏 + 值噪声」定 ——
   岸线因此弯弯曲曲，还会自然冒出小海湾和小半岛；四座岛种子不同，形状各不相同。
   纯函数生成（无随机源），同一个位置每次进游戏都是同一座岛，不会"刷新一次变个样"。 */
/* 真正建起来在第 5 节末尾（地表调色板定义之后）—— 这里要复用 groundColorAt，
   而它依赖的 GRASS_/SAND_ 常量声明在下面，此刻还在暂时性死区里。 */
const DECOR_ISLANDS = [
  // 世界坐标 x / z、基准半径、种子 —— 离主岛（半对角 ~144）至少留 180 单位海路，
  // 太近了主岛拉远一看就像"挤在一起"；也不能出 ±450（动画海面的方孔边缘）
  [-280, -210, 20, 7], [310, -130, 15, 23], [-260, 280, 24, 41], [220, 250, 13, 59],
];

function buildDecorIslands() {
  const base = [], top = [], rocks = [], trunks = [];
  const col = new THREE.Color();

  for (const [ox, oz, radius, seed] of DECOR_ISLANDS) {
    const n = Math.round(radius * 2 / CELL) + 1;      // 这座岛铺多少格
    const c = (n - 1) / 2;
    const p1 = seededRand(seed * 3 + 1) * 6.283, p2 = seededRand(seed * 5 + 2) * 6.283,
          p3 = seededRand(seed * 9 + 3) * 6.283;

    /* 高度场。三项正弦（3/5/8 瓣）让轮廓长成三五个凸起，值噪声再把岸线揉碎 —— 圆不了；
       贴到网格边（edge > 0.88）时强制扣分变水，免得岛屿被方形网格**切出一条直边**。 */
    const h = new Float64Array(n * n);
    for (let j = 0; j < n; j++) {
      for (let i = 0; i < n; i++) {
        const dx = i - c, dz = j - c;
        const ang = Math.atan2(dz, dx);
        const mod = 1 + 0.30 * Math.sin(3 * ang + p1)
                      + 0.17 * Math.sin(5 * ang + p2)
                      + 0.09 * Math.sin(8 * ang + p3);
        /* 半径再乘一张平滑的二维噪声场（0.80 ~ 1.20）：把"圆"揉成不规则的坨，
           而不是只让圆周上的点上下抖 —— 后者仍是圆，只是毛糙。 */
        const warp = 0.80 + 0.40 * smoothNoise(i * 0.085 + seed * 7, j * 0.085 + seed * 11);
        const d = Math.sqrt(dx * dx + dz * dz) / (c * 0.46 * mod * warp);
        const edge = Math.max(Math.abs(dx), Math.abs(dz)) / c;
        const nx = i * 0.17 + seed * 13, nz = j * 0.17 + seed * 29;
        const noise = (smoothNoise(nx, nz) * 0.65 + smoothNoise(nx * 2.3, nz * 2.3) * 0.35) - 0.5;
        h[j * n + i] = (1 - d) + noise * 0.55 - Math.max(0, edge - 0.88) * 8;
      }
    }
    /* 取分位数当海平面：陆地占比固定 ≈ 48%，岛不会忽大忽小 */
    const thr = Float64Array.from(h).sort()[Math.floor(n * n * 0.48)];

    const land = [];
    for (let k = 0; k < n * n; k++) if (h[k] > thr) land.push(k);
    /* 石峰：大岛只立 3 座小石峰（最高分位的几格挤在一起 = 一座小山丘），
       小岛全是绿洲不长石头 —— 旧版 12% 陆地各插一个灰锥，小岛中心糊成黑疙瘩 */
    const peakN = radius >= 18 ? 3 : 0;
    const peaks = new Set(land.slice().sort((a, b) => h[b] - h[a]).slice(0, peakN));

    for (const k of land) {
      const i = k % n, j = (k - i) / n;
      const wx = ox + (i - c) * CELL, wz = oz + (j - c) * CELL;
      /* 沙滩 = 四邻里有一格是水（或出了这座岛自己的网格） */
      const coast = [[1, 0], [-1, 0], [0, 1], [0, -1]].some(([a, b]) => {
        const ii = i + a, jj = j + b;
        return ii < 0 || jj < 0 || ii >= n || jj >= n || h[jj * n + ii] <= thr;
      });
      base.push([wx, wz]);
      top.push([wx, wz, coast]);
      if (peaks.has(k)) { rocks.push([wx, wz, seededRand(seed * 31 + k)]); continue; }
      /* 树：内陆、非山顶，约 22% 的格子长一棵 */
      if (coast || seededRand(seed * 977 + k) > 0.22) continue;
      trunks.push([wx + (seededRand(seed * 131 + k) - 0.5) * CELL * 0.5,
                   wz + (seededRand(seed * 313 + k) - 0.5) * CELL * 0.5,
                   0.7 + seededRand(seed * 733 + k) * 0.55,
                   seededRand(seed * 547 + k) * 6.283]);
    }
  }

  /* 底块：每格一块厚板，从水下一直长到地表（和主岛一样，侧面就是"岛壁入海"）。
     底块 / 地表砖 / 山 / 树干 / 树叶各一个 draw call，四座岛一共 5 个。 */
  const o = new THREE.Object3D();
  const addMesh = (geo, mat, list, place) => {
    if (!list.length) return null;
    const mesh = new THREE.InstancedMesh(geo, mat, list.length);
    /* mesh 一并交给回调：否则回调里没法引用"正在构造的这个 mesh"——
       用 const 接返回值会在 TDZ 里，list.forEach 是在赋值完成前就执行的 */
    list.forEach((it, i) => { place(it, i, mesh); mesh.setMatrixAt(i, o.matrix); });
    mesh.instanceMatrix.needsUpdate = true;
    scene.add(mesh);
    return mesh;
  };

  addMesh(new THREE.BoxGeometry(CELL, TOP_Y + 3.4, CELL),
      new THREE.MeshStandardMaterial({ color:0xcdb98a, roughness:.95 }), base, ([wx, wz]) => {
    o.position.set(wx, TOP_Y - (TOP_Y + 3.4) / 2, wz);
    o.rotation.set(0, 0, 0); o.scale.setScalar(1); o.updateMatrix();
  });

  const topMesh = addMesh(new THREE.BoxGeometry(CELL, 0.1, CELL),
      new THREE.MeshStandardMaterial({ color:0xffffff, roughness:.96 }), top, ([wx, wz, coast], i, mesh) => {
    o.position.set(wx, TOP_Y + 0.05, wz);
    o.rotation.set(0, 0, 0); o.scale.setScalar(1); o.updateMatrix();
    mesh.setColorAt(i, groundColorAt(wx, wz, coast, col));
  });
  if (topMesh && topMesh.instanceColor) topMesh.instanceColor.needsUpdate = true;

  addMesh(new THREE.ConeGeometry(CELL * 0.55, CELL * 1.15, 5),
      new THREE.MeshStandardMaterial({ color:0x7b7566, roughness:.95, flatShading:true }),
      rocks, ([wx, wz, r]) => {
    o.position.set(wx, TOP_Y + CELL * 0.575 * (0.6 + r * 0.5), wz);
    o.rotation.set(0, r * 6.283, 0);
    o.scale.setScalar(1.0 + r * 0.7); o.updateMatrix();
  });

  const trunkGeo = new THREE.CylinderGeometry(0.11, 0.15, 0.9, 6); trunkGeo.translate(0, 0.45, 0);
  const leafGeo = new THREE.ConeGeometry(0.72, 1.9, 7); leafGeo.translate(0, 1.25, 0);
  const leafMesh = addMesh(leafGeo,
      new THREE.MeshStandardMaterial({ color:0x2f7a3a, roughness:.85 }), trunks, ([wx, wz, sc, rot]) => {
    o.position.set(wx, TOP_Y + 0.05, wz);
    o.rotation.set(0, rot, 0); o.scale.setScalar(sc); o.updateMatrix();
  });
  if (leafMesh) {
    const trunkMesh = new THREE.InstancedMesh(trunkGeo,
        new THREE.MeshStandardMaterial({ color:0x6b4f2a, roughness:.95 }), trunks.length);
    trunks.forEach(([wx, wz, sc, rot], i) => {
      o.position.set(wx, TOP_Y + 0.05, wz);
      o.rotation.set(0, rot, 0); o.scale.setScalar(sc); o.updateMatrix();
      trunkMesh.setMatrixAt(i, o.matrix);
    });
    trunkMesh.instanceMatrix.needsUpdate = true;
    scene.add(trunkMesh);
  }
}

/* ============================================================
   4. 网格坐标与**地形查询**
   —— 下面这几个 isXxxCell 是客户端所有落地判定的地基，
      与服务端 TerrainMap 必须逐条对齐（改一边就得改另一边）。
   ============================================================ */
function cellToWorld(i, j) {
  const c = (GRID - 1) / 2;
  return [(i - c) * CELL, (j - c) * CELL];
}

/** 世界坐标 → 格坐标（NPC 走出格子中间时也要知道脚下属于哪一格） */
function worldToCell(wx, wz) {
  const c = (GRID - 1) / 2;
  return [Math.round(wx / CELL + c), Math.round(wz / CELL + c)];
}

/**
 * 某个世界坐标上，人脚底该踩多高 —— 两层地面本来就不一样高：
 * 地砖顶面 ≈ TOP_Y + 0.10（见 buildGrid 的 0.05 中心 + 0.05 半高），
 * 马路石板顶面 ≈ TOP_Y + 0.155（见 buildRoads 的 ROAD_H + 0.014）。
 * 不给 NPC 分这两档，人走在路上就会陷进石板里半只脚。
 * 丘陵台地也算进来：内地平原按格抬升（见 cellH）。
 */
function groundAt(wx, wz) {
  const [x, z] = worldToCell(wx, wz);
  return TOP_Y + cellH(x, z) + (hasRoad(x, z) ? 0.155 : 0.102);
}

/* ---- 平原丘陵：梯田式缓丘 --------------------------------------------
   岛不该只有"山脉/平原"两档。低频噪声把内陆平原抬成 0~4 级、每级 0.12 的台地，
   相邻格的高差就是一级小土坎（底块的沙土侧壁自然露出来），远看是和缓起伏的坡。
   【贴海 / 贴山 / 矿脉保持平】海岸一圈要平（港口、码头、沙滩）；山脚 3 格内
   不起丘（山地网格的坡脚在邻格落地，挨着起丘会裂出缝）；矿脉要露在地面。
   【地形常量】高度只由岛 id + 地形决定，路/田/建筑一概不影响 ——
   重建多少次、先修哪条路，同一座岛永远长同一片丘陵。 */
const cellHCache = new Map();
function nearMountain(x, z, r) {
  for (let dx = -r; dx <= r; dx++)
    for (let dz = -r; dz <= r; dz++)
      if (isMountainCell(x + dx, z + dz)) return true;
  return false;
}
function cellH(x, z) {
  const k = keyOf(x, z);
  const hit = cellHCache.get(k);
  if (hit !== undefined) return hit;
  let h = 0;
  if (isPlainCell(x, z) && !isCoastCell(x, z) && !nearMountain(x, z, 3)) {
    const seed = (S.island ? S.island.id : 1) * 7919;
    const n = smoothNoise(x * 0.05 + seed * 0.013, z * 0.05 - seed * 0.007) * 0.72
            + smoothNoise(x * 0.12 + 5.2, z * 0.12 + 9.1) * 0.28;
    /* 阈值 0.58：只有噪声高处的格子隆起，其他保持平原 —— 丘陵成片而不是全岛一块饼。
       分级 0.14 一档：同一片丘内也有 1~2 级的缓差，不是平顶阶梯 */
    h = n > 0.58 ? Math.min(4, 1 + Math.floor((n - 0.58) / 0.14)) * 0.12 : 0;
  }
  cellHCache.set(k, h);
  return h;
}
/** 一块占地（w×h 格）的平均台地高：建筑底盘按它落，跨高差时半嵌入半悬空都不明显 */
function footprintH(gx, gz, w, h) {
  let s = 0, n = 0;
  for (let cx = gx; cx < gx + w; cx++)
    for (let cz = gz; cz < gz + h; cz++) { s += cellH(cx, cz); n++; }
  return n ? s / n : 0;
}

/** 出网格当作水（岛外都是海）；地形串还没到手时按"整片陆地"兜底，免得白屏 */
function atCell(x, z) {
  if (x < 0 || z < 0 || x >= GRID || z >= GRID) return TERRAIN.WATER;
  return terrain.length === GRID * GRID ? terrain[z * GRID + x] : TERRAIN.PLAIN;
}
/** 陆地 = 平原 + 山地 + 矿脉（山与矿也算岛的一部分，只是不能随便盖） */
function isLandCell(x, z) { return atCell(x, z) !== TERRAIN.WATER; }
function isWaterCell(x, z) { return atCell(x, z) === TERRAIN.WATER; }
function isMountainCell(x, z) { return atCell(x, z) === TERRAIN.MOUNTAIN; }
/** 能修路 / 能种地的地：只有平原 */
function isPlainCell(x, z) { return atCell(x, z) === TERRAIN.PLAIN; }
/** 这一格是不是某种矿脉（不是就返回 PLAIN） */
function oreAtCell(x, z) {
  const c = atCell(x, z);
  return (c === TERRAIN.IRON || c === TERRAIN.CLAY) ? c : TERRAIN.PLAIN;
}
/** 这格能不能盖普通建筑：陆地且不是山地 */
function isBuildableCell(x, z) {
  return isLandCell(x, z) && !isMountainCell(x, z);
}
/** 这一格的类型名（选格面板显示"平原 / 沙滩 / 山地 / 铁矿脉 / 水面"） */
function cellLabel(x, z) {
  if (isWaterCell(x, z)) return CELL_LABEL[TERRAIN.WATER];
  if (isMountainCell(x, z)) return CELL_LABEL[TERRAIN.MOUNTAIN];
  const ore = oreAtCell(x, z);
  if (ore !== TERRAIN.PLAIN) return CELL_LABEL[ore];
  return isCoastCell(x, z) ? '沙滩' : CELL_LABEL[TERRAIN.PLAIN];
}

/**
 * 海岸带（沙滩）：**离水不超过 COAST 格**的陆地。
 * <p>
 * 注意不是"网格最外几圈"——岛形不规则，网格最外一圈大多本来就是水，那条定义已经没有意义。
 * 这里按 BFS 算"离水步数"，与服务端 TerrainMap.coastDistances 同一套；
 * 网格外算水，所以一整片平原的平岛会退化成"最外 COAST 圈是沙滩"，与老版完全一致。
 */
let coastDistCache = { sig:'', dist:null };
function coastDistanceMap() {
  const sig = GRID + '|' + terrain;
  if (coastDistCache.sig === sig) return coastDistCache.dist;
  const INF = 999, dist = new Map(), q = [];
  for (let z = 0; z < GRID; z++) for (let x = 0; x < GRID; x++) {
    if (!isLandCell(x, z)) { dist.set(keyOf(x, z), 0); q.push([x, z]); }
    else if (x === 0 || z === 0 || x === GRID - 1 || z === GRID - 1) {
      dist.set(keyOf(x, z), 1); q.push([x, z]);
    }
  }
  for (let i = 0; i < q.length; i++) {
    const [x, z] = q[i], d = dist.get(keyOf(x, z));
    if (d >= INF) continue;
    for (const [dx, dz] of [[1,0],[-1,0],[0,1],[0,-1]]) {
      const nx = x + dx, nz = z + dz;
      if (!isLandCell(nx, nz)) continue;
      const k = keyOf(nx, nz), cur = dist.has(k) ? dist.get(k) : INF;
      if (cur <= d + 1) continue;
      dist.set(k, d + 1); q.push([nx, nz]);
    }
  }
  coastDistCache = { sig, dist };
  return dist;
}
function isCoastCell(x, z) {
  if (COAST <= 0 || !isLandCell(x, z)) return false;
  return (coastDistanceMap().get(keyOf(x, z)) ?? 999) <= COAST;
}
const keyOf = (x, z) => x + ',' + z;

/* ---- 建筑占地工具（与服务端 BuildingType.cells / perimeterHas 同一套逻辑） ----
   建筑不是都占一格：伐木场 2×2、锯木厂 3×3、炼钢厂 4×4。
   客户端所有冲突判定都必须按**整块占地**做，只比左上角那格就会画出穿模的布局。 */

/** 占地 (x,z,w,h) 的外圈是否临路（大厂贴一条边就能建，不必四面环街） */
function nearRoadRect(x, z, w, h) {
  for (let cx = x - 1; cx <= x + w; cx++) {
    if (hasRoad(cx, z - 1) || hasRoad(cx, z + h)) return true;
  }
  for (let cz = z; cz < z + h; cz++) {
    if (hasRoad(x - 1, cz) || hasRoad(x + w, cz)) return true;
  }
  return false;
}

/**
 * 占地 (x,z,w,h) 有没有压到水面上 —— 港口"骑在岸线上"的判定。
 * 与服务端"港口骑在岸线上"同一口径：占地里**压到了水面**才算数。
 * 只看沙滩是不够的 —— 整块建在岸上的沙滩仓库不是码头，伸进海里那半边才是。
 */
function rectHasWater(x, z, w, h) {
  for (let cx = x; cx < x + w; cx++)
    for (let cz = z; cz < z + h; cz++) if (isWaterCell(cx, cz)) return true;
  return false;
}

/**
 * 能否把占地 w×h 的建筑放在 (x,z)：整块在界内、不压马路/作物/建筑，且外圈临路。
 * <p>
 * type 传了建筑类型才会跑"用途相关"的判定 —— 目前两条，都只对**贸易站（港口）**放宽：
 * 它允许占地压水（但必须水陆各占一部分），并且不必临路。
 * 不传 type 表示只问"这块地放得下多大的普通建筑"，选格面板的"最大可放几×几"就是这么问的。
 * <p>
 * **判定顺序必须与服务端 `ProductionService.validatePlacement` 逐条对齐**
 * （① 界内/压水/压山 → ② 港口骑岸线 → ③ 不压马路/作物/建筑 → ④ 外圈临路），
 * 否则会出现"3D 里说这里能建、点下去服务端骂你占地压了马路"这种前后矛盾的体验。
 * 所以①和③拆成两遍循环：港口那条必须夹在它们中间。
 */
function canPlaceAt(x, z, w, h, type) {
  /* ① 逐格看占地：出界 / 压水 / 压山 —— 三种原因必须报三种话，
        以前一律说"超出岛屿边界"，玩家压到水也会以为是出界了。
        骑岸线的建筑（港口 / 岸炮）是例外：码头本来就要一半在水里（见②）；
        采石场之类相反：**非一压到山地**（见②b）。 */
  const rule = terrainOf(type);
  const seaType = isCoastalBld(type);
  let landN = 0, waterN = 0, mountainN = 0, coastN = 0;
  for (let cx = x; cx < x + w; cx++) {
    for (let cz = z; cz < z + h; cz++) {
      if (cx < 0 || cz < 0 || cx >= GRID || cz >= GRID) {
        if (!seaType)
          return { ok:false, why:`占地 ${w}×${h} 格，放在这里会超出岛屿边界，往岛内挪几格` };
        continue;
      }
      const t = atCell(cx, cz);
      if (t === TERRAIN.WATER) {
        if (!seaType)
          return { ok:false, why:`占地压到了水面（(${cx}, ${cz}) 是海），往陆地上挪` };
        waterN++; continue;
      }
      if (t === TERRAIN.MOUNTAIN) {
        if (rule !== 'MOUNTAIN')
          return { ok:false, why:`占地里有山地（(${cx}, ${cz})），往平原上放` };
        mountainN++; landN++; continue;
      }
      if (rule === 'COAST' && isCoastCell(cx, cz)) coastN++;
      landN++;
    }
  }
  /* ② 骑岸线的建筑：占地里既要有陆地、又要有水面（贴着地图边缘也算 —— 网格外就是外海，
        这与服务端"出界当海"是同一份约定，否则平岛上一个泊位都建不出来） */
  if (seaType) {
    const touchesEdge = x === 0 || z === 0 || x + w - 1 >= GRID - 1 || z + h - 1 >= GRID - 1;
    if (!waterN && !touchesEdge)
      return { ok:false, why:`这座建筑要骑在岸线上 —— 往海里挪几格，让 ${w}×${h} 的占地压到至少 1 格水面（贴着地图边缘也算临海）` };
    if (!landN)
      return { ok:false, why:'它不能整座泡在海里 —— 占地里至少要留 1 格陆地' };
  }
  /* ②b 依山 / 贴岸：整块占地至少压到一格对应地形 */
  if (rule === 'MOUNTAIN' && !mountainN)
    return { ok:false, why:'这类建筑必须开在山地里 —— 占地上至少要有 1 格山地，把它挪到山上' };
  if (rule === 'COAST' && !coastN)
    return { ok:false, why:'这类建筑只能建在海岸沙滩上 —— 把它挪到岛边那一圈' };
  /* ③ 占地里每一格都不能压马路 / 作物 / 其它建筑 */
  for (let cx = x; cx < x + w; cx++) {
    for (let cz = z; cz < z + h; cz++) {
      if (hasRoad(cx, cz)) return { ok:false, why:'占地压到了马路' };
      if (plotCells.has(keyOf(cx, cz))) return { ok:false, why:'占地里有格子种着作物' };
      if (bldCells.has(keyOf(cx, cz))) return { ok:false, why:'占地和别的建筑重叠了' };
    }
  }
  /* ④ 占地外圈随便哪一格临路就行（骑岸线的建筑除外 —— 它靠船运货，不该强求公路通到海边） */
  if (!isCoastalBld(type) && !nearRoadRect(x, z, w, h))
    return { ok:false, why:'外圈不挨着马路，建筑必须沿路建' };
  /* ⑤ 采掘类必须压在矿脉上：矿石只在地图那几处，"能不能就地开矿"是这类建筑的本体玩法 */
  const wantOre = oreOf(type);
  if (wantOre) {
    let ok = false;
    for (let cx = x; cx < x + w; cx++)
      for (let cz = z; cz < z + h; cz++)
        if (oreAtCell(cx, cz) === wantOre) ok = true;
    if (!ok) return { ok:false, why:'这类采掘建筑必须压在对应的矿脉上 —— 把它挪到地图上的矿石堆' };
  }
  return { ok:true };
}

/**
 * 这一格能不能修马路 —— 与服务端 `RoadService.requireFreeCell` 同一套判定、同一个顺序。
 * 「放置模式」下鼠标划过的每一格都要当场给出能否铺路的结论，所以这条判定必须在客户端有一份。
 */
function canRoadAt(x, z) {
  if (isWaterCell(x, z)) return { ok:false, why:'这里是水面，修不了马路' };
  if (isMountainCell(x, z)) return { ok:false, why:'这里是山地（陡坡），马路修不过去' };
  if (plotCells.has(keyOf(x, z))) return { ok:false, why:'这一格种了作物，先收获或清理再修路' };
  if (bldCells.has(keyOf(x, z))) return { ok:false, why:'这里是建筑的占地，先拆掉才能修路' };
  if (hasRoad(x, z)) return { ok:false, why:'这里已经是马路了' };
  return { ok:true };
}

/**
 * 这一格能不能播种 —— 与服务端 `FarmService.requirePlantableCell` 同一套判定。
 * 注意矿脉**不能**种（那几格要留着开矿），但修路是允许压矿脉的。
 */
function canPlantAt(x, z) {
  if (isWaterCell(x, z)) return { ok:false, why:'这里是水面，种不了地' };
  if (isMountainCell(x, z)) return { ok:false, why:'这里是山地（陡坡），种不了地' };
  const ore = oreAtCell(x, z);
  if (ore !== TERRAIN.PLAIN) return { ok:false, why:'这一格是矿脉，留着开矿吧' };
  if (hasRoad(x, z)) return { ok:false, why:'这里是马路，不能种地' };
  if (bldCells.has(keyOf(x, z))) return { ok:false, why:'这里是建筑的占地，不能种地' };
  if (plotCells.has(keyOf(x, z))) return { ok:false, why:'这一格已经种了作物' };
  if ((S.plots || []).length >= PLOT_LIMIT)
    return { ok:false, why:`农田已满（本岛上限 ${PLOT_LIMIT} 株），先收获或清理一些` };
  /* 纪元式拉田：田必须拉在**手里这座农场**周围 FIELD_RANGE 格内（服务端 requireFieldRange
     仍是权威 —— 这里的农场数据来自几秒前的快照，可能旧一点，但先给玩家一个当场的原因）。 */
  if (S.place && S.place.kind === 'plant' && S.place.farmId) {
    const farm = farmById(S.place.farmId);
    if (farm && fieldDist(farm, x, z) > FIELD_RANGE)
      return { ok:false, why:`离${farm.label || '农场'}太远（田最多拉到它周围 ${FIELD_RANGE} 格）` };
  }
  return { ok:true };
}

/* ============================================================
   5. 地面：一整片**草地** + 建造时才出现的网格线
   —— 平时看过去是连成一片的草皮（每格只有极轻微的色差，看不出格子边界）；
      只有手里拿着建筑 / 马路 / 作物准备放下去的时候，才把格线亮出来。
   ============================================================ */
const gridGroup = new THREE.Group(); island.add(gridGroup);
let gridMesh = null, gridLineMesh = null;
let landCells = [];

/* 地表配色：草地与沙滩各是一条**连续色带**，颜色由一张平滑噪声场决定 ——
   采样点是**世界坐标**，与格子边界无关，相邻格拿到的值必然相近，所以整片地连成一体。
   【别再改回"从几档颜色里按格伪随机挑一档"】那正是"满屏棋盘格"的来源：
   逐格取整色 + 逐格明暗抖动，等于给每一格描了个看不见的边。 */
const GRASS_DARK = new THREE.Color(0x4b8541), GRASS_LIGHT = new THREE.Color(0x64a456);
/* 干沙要"亮金"不要"土黄"：和深绿草地拉开明度与色相，远看才是一圈白沙滩，
   而不是一圈泥边（旧值 0xd8c793/0xeee1ba 偏灰黄，压在暗绿草地上几乎分不出来）。 */
const SAND_DARK  = new THREE.Color(0xdcc389), SAND_LIGHT  = new THREE.Color(0xf5e8c0);

/** 格点哈希（纯函数，无随机源）：同坐标永远同一个值 */
function hash2(x, y) {
  const n = Math.sin(x * 127.1 + y * 311.7) * 43758.5453;
  return n - Math.floor(n);
}

/** 平滑值噪声：格点哈希 + smoothstep 双线性插值 —— 输入连续变化时输出也连续 */
function smoothNoise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y);
  const xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = hash2(xi, yi), b = hash2(xi + 1, yi);
  const c = hash2(xi, yi + 1), e = hash2(xi + 1, yi + 1);
  return (a * (1 - u) + b * u) * (1 - v) + (c * (1 - u) + e * u) * v;
}

/** 地表颜色：在草/沙各自的色带里按噪声取一个位置。两个尺度叠加 = 大块草皮 + 小片斑驳。
 *  【频率上限是硬约束】颜色每格只采一次样，所以噪声频率必须**远低于 0.5 次/格**，
 *  否则相邻两格采到的是不相关的值，等于又退回"逐格随机取色"的棋盘格。
 *  当前 0.05（周期 20 格）+ 0.13（周期约 8 格），实测相邻格色差 ≤3/255 —— 看不出格子。 */
function groundColorAt(x, z, coast, out) {
  const n = smoothNoise(x * 0.05, z * 0.05) * 0.7 + smoothNoise(x * 0.13, z * 0.13) * 0.3;
  return out.copy(coast ? SAND_DARK : GRASS_DARK).lerp(coast ? SAND_LIGHT : GRASS_LIGHT, n);
}

const SAND_WET = new THREE.Color(0xc0a877);   // 潮线湿沙：比干沙暗一档，但仍得是"沙"不是"泥"
const _gcA = new THREE.Color(), _gcB = new THREE.Color();
/** 沙滩分带（格）：贴水 BEACH_WET 圈是湿沙，往外到 BEACH_SAND 圈是干沙，再往外一圈是沙草过渡。
 *  【为什么干沙至少 2 圈】纪元1800 的海滩是一条**看得见的沙带**，1 圈（1.7 世界单位）
 *  在默认镜头下就是一条细边，压根读不出"沙滩"。配置里 anno.coast-width 更大就跟着更宽。 */
const BEACH_WET = 1;
const beachSand = () => Math.max(2, COAST);    // 每次现算：换岛 / 服务端下发更宽的 coast-width 时同步
/**
 * 主岛地表配色（干沙 → 湿沙 → 草）：不是"沙滩圈"一刀切，而是**四层过渡** ——
 *   离岸 ≤ BEACH_WET 圈（贴水）= 干沙略压暗 0.15（真正的"湿沙"在岸线外的沙洲上，见 buildBeachSkirt）；
 *   再往外到 BEACH_SAND 圈 = **干沙本体**，最亮最白 —— 这是沙滩的主体，
 *     和草地明度差了一大截，远看就是一圈白得发亮的沙带；
 *   再往外一圈 = 沙草混合带，混合比例由低频噪声决定 —— 有的地方沙"渗"进草地、
 *   有的地方草"长回"沙滩，岸线的内边界因此弯弯扭扭，不再是死板的方格圈；
 *   更往内 = 纯草地。
 * 混合采样仍走世界坐标噪声（频率远低于 0.5 次/格），不会出现逐格棋盘。
 */
function groundColorBlend(x, z, i, j, out) {
  const cd = coastDistanceMap().get(keyOf(i, j)) ?? 999;
  const sandRings = beachSand();
  if (cd > sandRings + 1) return groundColorAt(x, z, false, out);
  if (cd <= BEACH_WET) {                       // 贴水那圈略压暗 0.15：给沙带一点层次，但不压成泥
    groundColorAt(x, z, true, out);
    return out.lerp(SAND_WET, 0.15);
  }
  if (cd <= sandRings) return groundColorAt(x, z, true, out);   // 干沙：亮金白
  const n = smoothNoise(x * 0.09 + 31.7, z * 0.09 + 11.3);
  const sand = Math.max(0, Math.min(1, (n - 0.34) / 0.38)) * 0.75;
  if (sand <= 0.02) return groundColorAt(x, z, false, out);
  if (sand >= 0.73) return groundColorAt(x, z, true, out);
  groundColorAt(x, z, false, _gcA);
  groundColorAt(x, z, true, _gcB);
  return out.copy(_gcA).lerp(_gcB, sand);
}

/* 远景装饰岛在这里才真正建起来：它复用 groundColorAt，必须等上面的调色板就位 */
buildDecorIslands();

function buildGrid() {
  for (const m of [gridMesh, gridLineMesh]) if (m) { gridGroup.remove(m); m.geometry.dispose(); m.material.dispose(); }
  gridMesh = gridLineMesh = null; gridGroup.clear(); landCells = [];

  const cells = [];
  for (let i = 0; i < GRID; i++) for (let j = 0; j < GRID; j++) {
    if (isLandCell(i, j)) cells.push([i, j]);
  }
  const d = new THREE.Object3D(), col = new THREE.Color();

  /* ① 地表：严丝合缝的**整格**砖（CELL × CELL，不留缝）。
     几何仍是逐格一块（这样"哪些格是陆地""点到的是哪一格"才好算），
     但**颜色由世界坐标上的平滑噪声给**，相邻格必然相近 ——
     于是看着是一整片草地，而不是一格一块色板。 */
  const geo = new THREE.BoxGeometry(CELL, 0.1, CELL);
  const mat = new THREE.MeshStandardMaterial({ color:0xffffff, roughness:.96 });
  gridMesh = new THREE.InstancedMesh(geo, mat, cells.length);
  const HILL_TINT = new THREE.Color(0xc9bd7a);          // 高处草偏干黄，一眼读出"这块地高"
  cells.forEach(([i, j], n) => {
    const [x, z] = cellToWorld(i, j);
    const h = cellH(i, j);
    d.position.set(x, TOP_Y + h + 0.05, z); d.rotation.set(0, 0, 0); d.scale.setScalar(1); d.updateMatrix();
    gridMesh.setMatrixAt(n, d.matrix);
    gridMesh.setColorAt(n, h > 0
      ? groundColorBlend(x, z, i, j, col).lerp(HILL_TINT, Math.min(1, h / 0.48) * 0.35)
      : groundColorBlend(x, z, i, j, col));
    landCells.push({ x:i, z:j });
  });
  gridMesh.instanceMatrix.needsUpdate = true;
  if (gridMesh.instanceColor) gridMesh.instanceColor.needsUpdate = true;
  gridGroup.add(gridMesh);
  pickGrid.length = 0; pickGrid.push(gridMesh);

  /* ② 网格线：默认**不显示**（见 setGridLines，只有拿着东西要放时才亮）。
        LineSegments 的 1px 线在 WebGL 里几乎看不见，所以画成细长条；
        相邻两格共用一条边，用 Map 去重 —— 56 格的岛四千根线也只是一个 draw call。
        它**不进拾取列表**：点格子靠地表那层，网格线只负责好看。 */
  const lines = new Map();                       // 'a,b,h|v' -> 是不是竖线
  const add = (k, vert) => { if (!lines.has(k)) lines.set(k, vert); };
  for (const [i, j] of cells) {
    add(`${i},${j},h`, false);                   // 这一格的上边
    add(`${i},${j + 1},h`, false);               // 下边
    add(`${i},${j},v`, true);                    // 左边
    add(`${i + 1},${j},v`, true);                // 右边
  }
  const lineGeo = new THREE.BoxGeometry(CELL, 0.03, 0.05);
  const lineMat = new THREE.MeshBasicMaterial({ color:0xffffff, transparent:true, opacity:.42, depthWrite:false });
  gridLineMesh = new THREE.InstancedMesh(lineGeo, lineMat, Math.max(1, lines.size));
  const c = (GRID - 1) / 2;
  let ln = 0;
  for (const [k, vert] of lines) {
    const [a, b] = k.split(',').map(Number);
    d.position.set((a - (vert ? 0.5 : 0) - c) * CELL, TOP_Y + cellH(a, b) + 0.108, (b - (vert ? 0 : 0.5) - c) * CELL);
    d.rotation.set(0, vert ? Math.PI / 2 : 0, 0); d.scale.setScalar(1); d.updateMatrix();
    gridLineMesh.setMatrixAt(ln++, d.matrix);
  }
  gridLineMesh.count = ln;
  gridLineMesh.instanceMatrix.needsUpdate = true;
  gridLineMesh.visible = !!S.place;              // 平时岛上只有草地
  gridGroup.add(gridLineMesh);

  refreshPickables();
}

/** 网格线只在"手里拿着东西"的时候亮（放置模式进出时调它） */
function setGridLines(on) {
  if (gridLineMesh) gridLineMesh.visible = !!on;
}

/* ---- 悬停高亮（空手时鼠标划过一格，淡淡提亮一下） ---- */
const hoverBox = new THREE.Mesh(new THREE.BoxGeometry(CELL * 0.98, 0.06, CELL * 0.98),
    new THREE.MeshBasicMaterial({ color:0xffffff, transparent:true, opacity:.16 }));
hoverBox.visible = false; island.add(hoverBox);

/* ---- 占地预览框：显示"这个东西要占几格、能不能放" ----
   尺寸随手里的建筑类型变化，绿色=可建、红色=不行；马路 / 作物就是一格。
   只在**手里拿着东西**（S.place）时出现 —— 空手点格子不该冒出任何建造形状。 */
const fpShape = new THREE.BoxGeometry(1, 0.06, 1);
const fpBox = new THREE.Mesh(fpShape,
    new THREE.MeshBasicMaterial({ color:0x66ff88, transparent:true, opacity:.3 }));
fpBox.visible = false; island.add(fpBox);
const fpEdgeShape = new THREE.BoxGeometry(1, 0.02, 1);
const fpEdge = new THREE.Mesh(fpEdgeShape,
    new THREE.MeshBasicMaterial({ color:0x2ecc71, transparent:true, opacity:.85 }));
fpEdge.visible = false; island.add(fpEdge);

/* 大门朝向预览：一条贴在"门那一侧"的亮条，让玩家一眼看出门会开在哪条路上 */
const fpDoor = new THREE.Mesh(new THREE.BoxGeometry(1, 0.07, 1),
    new THREE.MeshBasicMaterial({ color:0xffcc55, transparent:true, opacity:.95 }));
fpDoor.visible = false; island.add(fpDoor);

/* ---- 建筑幽灵：**长得必须和落下去那座一模一样** ----
   之前这里是一个"大概这么大"的半透明方块（只给体积感），于是玩家看到的预览
   和点下去之后冒出来的建筑完全是两样东西 —— 预览失去了意义。
   现在幽灵直接复用真建筑的**同一套零件**：有 GLB 模型就 clone 模型（没加载完就先画
   真建筑此刻的占位体块，等模型到位再刷新），没有模型就走 makeProcBuilding 同一形制同
   一主色 —— 只是把所有材质换成半透明的绿/红，表示"能不能放"。 */
const ghostGroup = new THREE.Group(); island.add(ghostGroup);
const GHOST_OK  = new THREE.MeshBasicMaterial({ color:0x9df5b4, transparent:true, opacity:.45, depthWrite:false });
const GHOST_BAD = new THREE.MeshBasicMaterial({ color:0xff6b6b, transparent:true, opacity:.45, depthWrite:false });
let ghostKey = '';               // 当前挂在场景里的幽灵是"哪个类型 + 哪个朝向"
const ghostCache = new Map();    // (类型|朝向) -> 幽灵体：换回来不用重建，也不会越攒越多

/** 某个类型的模型刚到位：把它所有朝向的幽灵缓存作废，下次重画成真模型 */
function invalidateGhost(type) {
  for (const k of [...ghostCache.keys()]) if (k.startsWith(type + '|')) ghostCache.delete(k);
  if (ghostKey.startsWith(type + '|')) ghostKey = '';
}

/**
 * 取 (类型, 朝向) 的幽灵体并挂到场景上。返回它，由调用方摆位置。
 * 模型是异步的：真建筑此刻长什么样，幽灵就长什么样 —— 模型到位后再作废缓存重画。
 */
function ghostProto(type, rot) {
  const key = type + '|' + rot;
  const cached = ghostCache.get(key);
  if (cached) {
    if (ghostKey !== key) { ghostGroup.clear(); ghostGroup.add(cached); ghostKey = key; }
    return cached;
  }
  const meta = BLD_MAP[type] || { label:type, color:0x90a4ae, w:1, h:1 };
  const bs = sizeOf(type);
  const fa = rotAngle(rot);
  let obj = null;
  if (MODEL_HAVE.has(type) && MODEL_CACHE.has(type)) {
    obj = MODEL_CACHE.get(type).clone(true);          // 有真模型：直接用它
  } else if (MODEL_HAVE.has(type)) {
    /* 模型还在下载：画真建筑此刻的占位体块（与 buildBuildings 同一个函数），
       下载完了再重画一次幽灵，预览不会停在方块上 */
    obj = buildPlaceholderParts(meta, Math.max(bs.w, bs.h),
        bs.w * CELL * 0.86, bs.h * CELL * 0.86, bs.w, bs.h, fa).group;
    loadModel(type, bs.w, bs.h).then(() => {
      invalidateGhost(type);
      if (S.place && S.place.type === type) updateFootprint();
    }).catch(() => {});
  } else {
    obj = makeProcBuilding(meta.form || 'FACTORY',
        meta.tint != null ? meta.tint : (meta.color != null ? meta.color : 0x90a4ae),
        bs.w, bs.h, 1);
    for (const nm of ['windmill', 'minewheel']) {     // 会转的零件：预览里摆个静止的就行
      const part = obj.getObjectByName(nm);
      if (part) part.rotation.z = 0.4;
    }
  }
  obj.rotation.y = fa;
  obj.traverse(o => { if (o.isMesh) { o.material = GHOST_OK; o.castShadow = false; } });
  ghostCache.set(key, obj);
  ghostGroup.clear(); ghostGroup.add(obj); ghostKey = key;
  return obj;
}

/** w×h 的占地以"鼠标那一格"为中心时，左上角锚点落在哪 —— 服务端要的正是左上角 */
function anchorFor(cx, cz, w, h) {
  return { x: cx - Math.round((w - 1) / 2), z: cz - Math.round((h - 1) / 2) };
}

/**
 * 刷新占地预览。**只有一种来源**：手里拿着东西（S.place）→ 跟着鼠标走（见「5.5 放置模式」）。
 * 空手时一律不画 —— 建造形状只在"点过建造卡、拿在手上"之后才该出现。
 */
function updateFootprint() {
  const p = S.place;
  let kind = null, type = null, cell = null;
  if (p) { kind = p.kind; type = p.type; cell = S.hoverCell; }

  ghostGroup.visible = false;
  hideChopRing();
  if (!cell || !type) { fpBox.visible = fpEdge.visible = fpDoor.visible = false; S.hoverCheck = null; return; }

  /* ---- 建筑：整块占地 + 大门亮条 + 轮廓体 ---- */
  if (kind === 'building') {
    const rot = currentRotation(type, cell.x, cell.z);
    const { w, h } = sizeOfRot(type, rot);
    const a = anchorFor(cell.x, cell.z, w, h);
    const chk = canPlaceAt(a.x, a.z, w, h, type);
    const [cx, cz] = cellToWorld(a.x + (w - 1) / 2, a.z + (h - 1) / 2);
    const sx = w * CELL * 0.98, sz = h * CELL * 0.98;
    const fh = footprintH(a.x, a.z, w, h);
    for (const m of [fpBox, fpEdge]) { m.position.set(cx, TOP_Y + fh + 0.17, cz); m.scale.set(sx, 1, sz); }
    fpBox.material.color.setHex(chk.ok ? 0x66ff88 : 0xff5a5a);
    fpEdge.material.color.setHex(chk.ok ? 0x2ecc71 : 0xd63031);
    fpBox.visible = fpEdge.visible = true;

    /* 幽灵体 = 这座建筑落下去之后的样子（同一套零件、同一朝向），只是半透明 */
    const ghost = ghostProto(type, rot);
    if (ghost) {
      ghostGroup.position.set(cx, TOP_Y + fh, cz);
      ghostGroup.visible = true;
      const mat = chk.ok ? GHOST_OK : GHOST_BAD;
      ghost.traverse(o => { if (o.isMesh) o.material = mat; });
    }
    /* 伐木场：手里拿着时同步画砍伐范围圈（纪元1800 放置体验） */
    if (type === 'LUMBERJACK') showChopRing(cx, cz);

    /* 大门亮条：贴在朝向那一侧的边上，宽度约占该边的 6 成 */
    const dw = CELL * 0.62, dt = CELL * 0.2, off = 0.5;   // 贴边略微外移，避免和占地框重叠
    const alongX = rot === 0 || rot === 180;
    fpDoor.scale.set(alongX ? dw : dt, 1, alongX ? dt : dw);
    fpDoor.position.set(
      cx + (rot === 90 ? sx / 2 + off : rot === 270 ? -sx / 2 - off : 0),
      TOP_Y + fh + 0.22,
      cz + (rot === 0 ? sz / 2 + off : rot === 180 ? -sz / 2 - off : 0));
    fpDoor.material.color.setHex(chk.ok ? 0xffcc55 : 0xff8a8a);
    fpDoor.visible = true;
    S.hoverCheck = { ok: chk.ok, why: chk.why || '', w, h, rot, manual: p.rot != null };
    return;
  }

  /* ---- 马路 / 作物：都是一格，也没有门 ---- */
  const chk = kind === 'road' ? canRoadAt(cell.x, cell.z) : canPlantAt(cell.x, cell.z);
  const [cx, cz] = cellToWorld(cell.x, cell.z);
  const ch1 = cellH(cell.x, cell.z);
  for (const m of [fpBox, fpEdge]) { m.position.set(cx, TOP_Y + ch1 + 0.17, cz); m.scale.set(CELL * 0.98, 1, CELL * 0.98); }
  fpBox.material.color.setHex(chk.ok ? 0x66ff88 : 0xff5a5a);
  fpEdge.material.color.setHex(chk.ok ? 0x2ecc71 : 0xd63031);
  fpBox.visible = fpEdge.visible = true;
  fpDoor.visible = false;
  S.hoverCheck = { ok: chk.ok, why: chk.why || '', w:1, h:1, rot:0 };
}

/* ============================================================
   6. 作物（玩家自己在空地上播种，一格一株）
   ============================================================ */
const plotGroup = new THREE.Group(); island.add(plotGroup);
let plotNodes = [];                 // 每株作物的 3D 节点
const plotCells = new Map();        // 'x,z' -> 作物数据（点格面板 / 树木避让共用）
const stemGeo = new THREE.CylinderGeometry(0.04, 0.055, 0.62, 6); stemGeo.translate(0, 0.31, 0);
const headGeo = new THREE.IcosahedronGeometry(0.15, 0);
const SOIL = { EMPTY:0x8a6a45, GROWING:0x6f5232, RIPE:0x7a5c30, WITHERED:0x5b4a3a };

/** 按服务端返回的作物列表重建 3D（每株占一格，位置由玩家自己选） */
function buildPlots(list) {
  clearOwned(plotGroup, plotOwnedGeo);
  plotNodes = []; plotCells.clear(); pickPlots.length = 0;
  const size = CELL * 0.92;
  for (const p of (list || [])) {
    const [x, z] = cellToWorld(p.cellX, p.cellZ);
    const g = new THREE.Group(); g.position.set(x, TOP_Y + cellH(p.cellX, p.cellZ), z);
    const tile = new THREE.Mesh(new THREE.BoxGeometry(size, 0.22, size),
        new THREE.MeshStandardMaterial({ color:SOIL[p.state] ?? SOIL.EMPTY, roughness:1 }));
    tile.position.y = 0.11; tile.userData = { kind:'cell', x:p.cellX, z:p.cellZ };
    g.add(tile); pickPlots.push(tile); plotOwnedGeo.push(tile.geometry);

    const plants = [];
    const step = size / 3.4;
    for (let px = -1; px <= 1; px++) for (let pz = -1; pz <= 1; pz++) {
      const pl = new THREE.Group(); pl.position.set(px * step, 0.22, pz * step);
      const stem = new THREE.Mesh(stemGeo, new THREE.MeshStandardMaterial({ color:0x4c8f3c, roughness:.8 }));
      const head = new THREE.Mesh(headGeo, new THREE.MeshStandardMaterial({ color:0x7cb342, roughness:.7 }));
      pl.add(stem, head); pl.visible = false; g.add(pl);
      plants.push({ g:pl, stem, head, cur:0 });
    }
    const marker = new THREE.Mesh(new THREE.ConeGeometry(0.24, 0.44, 4),
        new THREE.MeshStandardMaterial({ color:0xffd54f, emissive:0xffa000, emissiveIntensity:.9 }));
    marker.rotation.x = Math.PI; marker.position.y = 1.15; marker.visible = false; g.add(marker);
    plotOwnedGeo.push(marker.geometry);

    plotGroup.add(g);
    plotNodes.push({ id:p.id, group:g, tile, plants, marker, view:p, target:0,
                     cellX:p.cellX, cellZ:p.cellZ });
    plotCells.set(keyOf(p.cellX, p.cellZ), p);
  }
  refreshPickables();
}

/* ============================================================
   7. 马路（相邻自动拼接：直路 / 拐角 / T 字 / 十字）
   ------------------------------------------------------------
   每格马路只画"中心方块 + 朝有路邻居伸出的车道"这一段，
   车道正好铺到格子边界，相邻两格的车道在同一位置对齐，
   于是连起来就是一条不断的路面 —— 不需要额外的转角模型。
   ============================================================ */
const roadGroup = new THREE.Group(); island.add(roadGroup);
const roadSet = new Set();
const roadKindMap = new Map();   // keyOf -> 这格路的路面种类（拖拽改铺判定用，buildRoads 重建时填）

const HALF = CELL * 0.5;          // 半格：路面铺到格子边界
const RW = CELL * 0.30;           // 路面半宽（总宽 0.6 格）
const ROAD_H = 0.14;              // 路基顶面（相对马路分组原点）

const roadBedMat  = new THREE.MeshStandardMaterial({ color:0xa8926c, roughness:.97 });  // 泥土路肩
const roadBedGeo  = new THREE.BoxGeometry(CELL, 0.16, CELL);   // 共享：整格路基，相邻无缝
const roadSlabGeo = new THREE.BoxGeometry(CELL * 0.34, 0.02, CELL * 0.34);

/* ---- 路面四档（服务端 RoadKind 同一套表，改数值两边一起改）----
   土路 / 石板路 / 砖路 / 林荫大道：kind 存在路格上（RoadEntity.kind），
   铺路时选、建好还能改铺（收差价）。gate = 哪个阶层的人口到位才能铺：
   石板路等工人搬进来（农夫 120）、砖路等工匠（工人 200）、大道等工程师（工匠 300）。 */
const ROAD_KINDS = {
  DIRT:      { label:'土路',     cost:30, gate:null,                        surf:0xa8895f, slab:0xbfa172 },
  STONE:     { label:'石板路',   cost:45, gate:{ tier:'FARMER',  pop:120 }, surf:0x9a9da1, slab:0xb4b7ba },
  BRICK:     { label:'砖路',     cost:60, gate:{ tier:'WORKER',  pop:200 }, surf:0x9a5a42, slab:0xb06a50 },
  BOULEVARD: { label:'林荫大道', cost:90, gate:{ tier:'ARTISAN', pop:300 }, surf:0xb9bec2, slab:0xd2d6d8 },
};
for (const k of Object.values(ROAD_KINDS)) {
  k.mat     = new THREE.MeshStandardMaterial({ color:k.surf, roughness:.92 });
  k.slabMat = new THREE.MeshStandardMaterial({ color:k.slab, roughness:.85 });
}
const ROAD_KIND = k => ROAD_KINDS[k] || ROAD_KINDS.DIRT;
/** 这档路面解锁了没（客户端只做灰显，真正的门槛服务端再验一遍） */
const roadKindLocked = k => !!k.gate && tierPop(k.gate.tier) < k.gate.pop;

/* ---- 路缘石 + 排水沟：贴在"没有路邻居"的开口边上 ----
   开口边 = 路牙（浅色石条，略高于路面），路牙内侧一条暗沟；
   按 16 种邻居掩码把所有条块合并成单个几何（一格最多一个 mesh）。
   林荫大道另有一套**人行道**条块（更宽、更亮，代替路牙）。 */
const curbMat  = new THREE.MeshStandardMaterial({ color:0xcac6ba, roughness:.9 });
const drainMat = new THREE.MeshStandardMaterial({ color:0x6b6455, roughness:.95 });
const walkMat  = new THREE.MeshStandardMaterial({ color:0xd6d9da, roughness:.88 });
const _edgeBox = (w, h, d, x, y, z) => { const g = new THREE.BoxGeometry(w, h, d); g.translate(x, y, z); return g; };

/** 某个开口边上的路牙 / 排水沟条块（局部坐标，side: 0上 1右 2下 3左） */
function edgeStrips(side, curbOut, drainOut) {
  const C = ROAD_H + 0.028, D = ROAD_H + 0.010;
  if (side === 0) { curbOut.push(_edgeBox(CELL, .05, .09, 0, C, -HALF + .045)); drainOut.push(_edgeBox(CELL, .018, .06, 0, D, -HALF + .13)); }
  if (side === 1) { curbOut.push(_edgeBox(.09, .05, CELL, HALF - .045, C, 0)); drainOut.push(_edgeBox(.06, .018, CELL, HALF - .13, D, 0)); }
  if (side === 2) { curbOut.push(_edgeBox(CELL, .05, .09, 0, C, HALF - .045)); drainOut.push(_edgeBox(CELL, .018, .06, 0, D, HALF - .13)); }
  if (side === 3) { curbOut.push(_edgeBox(.09, .05, CELL, -HALF + .045, C, 0)); drainOut.push(_edgeBox(.06, .018, CELL, -HALF + .13, D, 0)); }
}

/** 某个开口边上的人行道条块（林荫大道专用，宽 0.3 格、略高于路面） */
function edgeWalk(side, out) {
  const W = ROAD_H + 0.035, s = 0.30;
