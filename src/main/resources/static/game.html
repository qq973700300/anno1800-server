          toast('这一格已经是这种路面了', 'bad'); return;
        }
        const r = await api('/api/roads/restyle', 'POST', {
          playerId:S.playerId, islandId:S.island.id, kind:p.roadKind, cells:[{ x:cell.x, z:cell.z }],
        });
        if (r.restyled) {
          await refreshRoads();                       // 改了材质要整网重画（路牙/灯型都跟路面走）
          toast(`改铺成${r.kindLabel}，花了 ${money(r.spent)} 金`, 'good');
        } else if (r.stop) toast(r.stop, 'bad');
        renderPlaceBar();
        return;
      }
      const pre = canRoadAt(cell.x, cell.z);
      if (!pre.ok) { toast(pre.why, 'bad'); return; }
      const r = await api('/api/roads', 'POST', { playerId:S.playerId, islandId:S.island.id, x:cell.x, z:cell.z, kind:p.roadKind });
      afterRoadPainted(cell, r);
      renderPlaceBar();
      return;
    }

    /* 播种：一格一株 */
    const pre = canPlantAt(cell.x, cell.z);
    if (!pre.ok) { toast(pre.why, 'bad'); return; }
    await api('/api/farm/plant', 'POST',
      { playerId:S.playerId, islandId:S.island.id, x:cell.x, z:cell.z, crop:p.type,
        buildingId:p.farmId || null });             // 纪元式拉田：田归属到这座农场
    p.count++;
    toast(`在 (${cell.x}, ${cell.z}) 种下 ${placeLabel(p)}`, 'good');
    await refreshPlots(); await refreshPlayer();
    renderPlaceBar();
  } catch (err) {
    toast(err.message, 'bad');
  }
}

/**
 * 刚铺好一格马路：把本地状态更新掉（画面由调用方统一重建）。
 * <p>
 * 【为什么必须**同时**改 roadSet 和 S.roads】
 * <ul>
 *   <li>{@code roadSet} 决定 hasRoad —— 拉线时每一格的合法性判定、
 *       以及"预览会不会说这里已经是马路"，都读它；</li>
 *   <li>{@code S.roads} 是增量同步的**基线**：applyRoads() 拿服务端的列表和它比对签名，
 *       只有先把它也更新掉，下一次快照回来才不会把刚铺的路当成"没变过"而漏掉重建。</li>
 * </ul>
 * 这里**不重建画面**：一条线动辄几十格，逐格重建路网纯属浪费，
 * 由 commitRoadDrag 在整条铺完后统一刷一次。
 */
function afterRoadPainted(cell, road) {
  const k = keyOf(cell.x, cell.z);
  roadSet.add(k);
  S.roads = (S.roads || []).filter(r => keyOf(r.cellX, r.cellZ) !== k);
  S.roads.push(road || { id:-1, cellX:cell.x, cellZ:cell.z, kind:(S.place && S.place.roadKind) || 'DIRT' });
  roadKindMap.set(k, (road && road.kind) || (S.place && S.place.roadKind) || 'DIRT');
  S.treasury -= placeCost(S.place);   // 路面不同价不同（土路 30 / 石板 45 / 砖 60 / 大道 90）
  const p = S.place; if (p) p.count++;
  renderHud();          // 扣的是本地这份钱，先把金币数字改掉，别等下一次快照
}

/** 放置条：手里拿着东西时才出现 */
function renderPlaceBar() {
  const bar = document.getElementById('placeBar');
  const p = S.place;
  renderToolBar();      // 拿起 / 放下都要同步工具条上的高亮
  if (!p) { bar.style.display = 'none'; return; }
  bar.style.display = 'flex';
  /* 旋转只对建筑有意义（马路 / 作物转了也没用），拿着别的东西时把按钮收起来 */
  document.getElementById('placeRot').style.display = p.kind === 'building' ? '' : 'none';
  const label = placeLabel(p);
  const cost = placeCost(p);
  let what = `正在放置 <b style="color:var(--gold)">${label}</b>`;
  if (p.kind === 'demolish') {
    what = `<b style="color:#ff8a7a">🧨 铲除模式</b> · 点目标或划一片 → 弹框确认后拆除`;
  } else if (p.kind === 'building') {
    const rot = p.rot != null ? p.rot
      : (S.hoverCell ? autoRotation(p.type, S.hoverCell.x, S.hoverCell.z) : 0);
    const { w, h } = sizeOfRot(p.type, rot);
    /* 朝向是"吸"出来的还是手拧的，当场写出来 —— 玩家看到门拐弯时得知道是谁拐的 */
    const how = p.rot != null ? '<span style="color:#ffd479">手动</span>'
      : isCoastalBld(p.type) ? '<span style="color:#9fd8ff">自动面海</span>'
      : '<span style="color:#9ff5c4">自动朝路</span>';
    what += ` · ${w}×${h} 格 · ${money(cost)}金 · 大门朝${ROT_LABEL[rot]}（${how}）`;
  } else {
    what += ` · ${money(cost)}金/格`;
    if (p.kind === 'plant' && p.farmId) {
      const farm = farmById(p.farmId);
      what += ` · 来自${farm ? farm.label : '农场'}（≤${FIELD_RANGE} 格）`;
    }
  }
  if (p.count) what += ` · <b>已放 ${p.count}</b>`;
  document.getElementById('placeWhat').innerHTML = what;

  /* 路面选择片：只有手里拿着马路时出现 —— 点片换路面，拿着新路面去点旧路就是改铺 */
  const chips = document.getElementById('roadKinds');
  if (p.kind === 'road') {
    chips.style.display = 'flex';
    chips.innerHTML = Object.entries(ROAD_KINDS).map(([id, k]) => {
      const locked = roadKindLocked(k);
      const on = (p.roadKind || 'DIRT') === id;
      const tip = locked
        ? `${TIER_LABEL[k.gate.tier] || k.gate.tier}满 ${k.gate.pop} 人解锁`
        : `${k.label} · ${k.cost}金/格 · 点旧路改铺收差价`;
      return `<button class="rkChip${on ? ' on' : ''}${locked ? ' locked' : ''}" data-road-kind="${id}" title="${tip}">${k.label}</button>`;
    }).join('');
  } else { chips.style.display = 'none'; chips.innerHTML = ''; }

  const chk = S.hoverCheck;
  const why = document.getElementById('placeWhy');
  if (!S.hoverCell) { why.textContent = '把鼠标移到岛上'; why.style.color = 'var(--dim)'; }
  else if (!chk) { why.textContent = ''; }
  else if (chk.ok) { why.textContent = '✅ 这里能放'; why.style.color = '#9ff5c4'; }
  else { why.textContent = '⛔ ' + chk.why; why.style.color = '#ffb0b0'; }
}

/**
 * 底部**常驻**建造坞：马路 + 五种作物 + **全部建筑卡**，都在这一条里。
 * <p>
 * 【为什么要有它】这些入口原先散在左侧面板里（马路 / 播种挂在"选中目标"，得先点一格空地
 * 才看得见；建筑卡在「建造」区），而它们跟"当前选中的是哪一格"毫无关系 ——
 * 玩家想种地想盖房，不该先随便点一格。所以统统搬到这儿常驻：随时点、随时拿起，
 * 落点由鼠标决定（见「10.5 放置模式」）。
 * <p>
 * 一行放不下 20 多个按钮，所以按「马路+农田 / 厂房 / 居民与港口」分三行排。
 * 只在"手上的东西 / 钱够不够 / 耕地满没满 / 住宅前置通没通"变了才重建 DOM，
 * 避免每秒轮询把按钮刷一遍（那会把 hover 的 tooltip 也刷没）。
 */
/**
 * 建造菜单的分页顺序：和纪元1800 一样按居民阶层往上排，最后三个是"不分阶层"的类别
 * （公共设施 / 港口 / 军事）。农夫那一页从开局就全可用，越往右越要先把人口堆上去。
 */
const DOCK_TABS = ['INFRA', 'FARMERS', 'WORKERS', 'ARTISANS', 'ENGINEERS', 'INVESTORS',
                   'SCHOLARS', 'TOURISTS', 'PUBLIC', 'HARBOR', 'MILITARY'];
const GROUP_LABEL = { INFRA:'基础设施', FARMERS:'农夫', WORKERS:'工人', ARTISANS:'工匠',
                      ENGINEERS:'工程师', INVESTORS:'投资者', SCHOLARS:'学者', TOURISTS:'游客',
                      PUBLIC:'公共', HARBOR:'港口', MILITARY:'军事' };
const GROUP_ICON  = { INFRA:'🛠️', FARMERS:'🧑‍🌾', WORKERS:'⚒️', ARTISANS:'🎩', ENGINEERS:'🎓',
                      INVESTORS:'💼', SCHOLARS:'📚', TOURISTS:'🧳', PUBLIC:'🏛️', HARBOR:'⚓', MILITARY:'⚔️' };

/** 当前停在哪一页（存 localStorage：下次进游戏还停在那儿，不用重新找） */
let dockTab = (() => {
  try { const v = localStorage.getItem('anno1800_dockTab'); return DOCK_TABS.includes(v) ? v : 'FARMERS'; }
  catch { return 'FARMERS'; }
})();

function renderToolBar() {
  const bar = document.getElementById('toolBar');
  if (!bar) return;
  const p = S.place;
  const plots = (S.plots || []).length;
  /* 建筑卡会被"没贸易站 / 某阶层人口不够 / 钱不够"置灰，所以门槛状态也得进签名，
     不然人口一变按钮不跟着刷新（这是真踩过的坑：按钮点了才被服务端驳回）。 */
  const gates = BUILDINGS.map(b => buildGate(b.key) ? 1 : 0).join('');
  /* 材料够不够也进签名：仓库一有木头进来，置灰的卡要立刻亮回来 */
  const matsSig = BUILDINGS.map(b => (b.goodsCost || []).map(m => stockOfGood(m.good) >= m.qty ? 1 : 0).join('')).join('');
  const sig = [p ? p.kind : '', p ? p.type : '', S.treasury < ROAD_COST,
    plots, PLOT_LIMIT, ROAD_COST,
    modelBadgeText, gates, matsSig, dockTab, BUILDINGS.length].join('|');
  if (sig === toolBarSig) return;
  toolBarSig = sig;

  /* ---- 第一行：马路（农田不再放工具条 —— 点农场建筑，在左侧"选中目标"面板里拉田） ---- */
  const roadOn = !!p && p.kind === 'road';
  let row1 = `<span class="tbLabel">建造</span>`
    + `<button data-road="1" class="${roadOn ? 'on' : ''}" ${S.treasury < ROAD_COST ? 'disabled' : ''} `
    + `title="拿起马路后按住左键往外拖，拉出一条直线，松手一次铺完整条（土路 ${ROAD_COST} 金/格，放置条上可换路面）">`
    + `🛣️ 马路<br><span class="muted">土路 ${ROAD_COST}金/格</span></button>`
    + `<span class="tbDiv"></span>`
    + `<span class="tbInfo">耕地 ${plots}/${PLOT_LIMIT}</span>`
    + `<span class="tbDiv"></span>`
    + `<button data-demolish-tool="1" class="${p && p.kind === 'demolish' ? 'on' : ''}"`
    + ` title="铲除工具：点一个目标 → 弹框确认后拆掉；按住左键划一片 → 只拆第一格那一类（农田 / 某种建筑 / 马路），确认后批量拆。作物种子钱不退，建筑返还一半造价">`
    + `🧨 铲除<br><span class="muted">点格或划片</span></button>`;

  /* ---- 分类标签：一页一页翻（纪元1800 的建造菜单就是这么排的） ---- */
  const tabs = DOCK_TABS.map(k => {
    const n = BUILDINGS.filter(b => (b.group || 'INFRA') === k).length;
    if (!n) return '';
    return `<button class="tbTab ${dockTab === k ? 'on' : ''}" data-dock-tab="${k}">`
      + `${GROUP_ICON[k] || '🏗️'} ${GROUP_LABEL[k] || k}<span class="tbN">${n}</span></button>`;
  }).join('');

  /* ---- 建筑卡：一张卡 = 一座建筑 ----
     卡上三行：图标 / 名字 / 造价·占地。副标题按用途换说法（住宅写"住多少人"、
     公共设施写"提供什么服务"、厂房写"几个工人"），一眼能分清它到底是干什么的。
     没解锁的卡灰掉并写明差多少人口 —— 这是"下一层长什么样"的预告，也是努力方向。
     **卡片能不能点只看钱、材料与门槛**（材料 = 服务端图鉴的 goodsCost） —— "这块地放不放得下"由拿在手里的幽灵预览回答。 */
  const card = (b) => {
    const { w, h } = sizeOf(b.key);
    const gate = buildGate(b.key);
    /* 建造材料（纪元1800式）：钱之外还要木头/木板 —— 不足的卡置灰（服务端也会驳回，这里只是提前拦） */
    const mats = b.goodsCost || [];
    const lackMats = mats.filter(m => stockOfGood(m.good) < m.qty);
    const matTxt = mats.length ? '+' + mats.map(m => `${m.label}${m.qty}`).join('+') : '';
    const poor = S.treasury < b.cost;
    const on = !!p && p.kind === 'building' && p.type === b.key;
    const sub = isResidence(b.key)
      ? `${b.cost}金${matTxt} · ${w}×${h} · 住${b.capacity || 0}人`
      : isProducer(b.key)
        ? `${b.cost}金${matTxt} · ${w}×${h} · ${b.workers || 0}工人`
        : b.serviceLabel
          ? `${b.cost}金${matTxt} · ${w}×${h} · ${b.serviceLabel}`
          : `${b.cost}金${matTxt} · ${w}×${h}`;
    const detail = (b.hint || b.recipe || '').replace(/"/g, '');
    const tip = gate ? gate
      : lackMats.length ? `材料不足（${lackMats.map(m => `${m.label} 现有 ${stockOfGood(m.good)}/${m.qty}`).join('、')}）—— 伐木场产木材，锯木厂把木材锯成木板`
      : poor ? `资金不足（要 ${money(b.cost)} 金）`
      : `${b.label}：${detail}\n占 ${w}×${h} 格${b.coastal ? ' · 骑岸线' : ''}`
        + (mats.length ? `\n建造材料：${mats.map(m => `${m.label}×${m.qty}（现有 ${stockOfGood(m.good)}）`).join('、')}` : '')
        + (b.serviceLabel ? `\n提供「${b.serviceLabel}」服务` : '') + '\n点一下拿在手上，再点到岛上放下（R 可转向）';
    return `<button data-build="${b.key}" class="${on ? 'on' : ''}${gate ? ' locked' : ''}" `
      + `${(poor || lackMats.length || gate) ? 'disabled' : ''} title="${tip}">`
      + `<span class="bcIco">${b.icon || '🏗️'}</span><span class="bcName">${b.label}</span>`
      + `<span class="bcSub">${sub}</span></button>`;
  };
  const group = BUILDINGS.filter(b => (b.group || 'INFRA') === dockTab);
  const row2 = group.length ? group.map(card).join('')
    : '<span class="tbInfo">这一类还没有建筑</span>';

  /* ---- 顶部一行状态提示：就是原来左侧「建造」区底下那句 ---- */
  let hint = '点一张卡把建筑拿在手上，再点到岛上放下（拿起后才显示网格线）· 上面一排是分类，越往后的类别要先把人口堆上去';
  if (p && p.kind === 'building') hint = `正在放置 ${placeLabel(p)}：绿=能放、红=不行 · 左键放下 · R 转向 · Esc 取消`;
  else if (p && p.kind === 'road') hint = '正在铺马路：按住左键往外拖，拉出一条直线，松手铺下去（只铺一格就直接点） · Esc 取消';
  else if (p && p.kind === 'plant' && p.farmId) hint = `正在为农场拉 ${placeLabel(p)} 田：田只能拉在农场周围 ${FIELD_RANGE} 格内 · 左键**点一格**种一株，**拖一片**批量种（已开垦 ${plots}/${PLOT_LIMIT}） · Esc 取消`;
  else if (p && p.kind === 'plant') hint = `正在种 ${placeLabel(p)}：左键**点一格**种一株，**拖一片**批量种（已开垦 ${plots}/${PLOT_LIMIT}） · Esc 取消`;
  else if (p && p.kind === 'demolish') hint = '铲除模式：左键**点目标**弹框确认拆一个，**拖一片**只拆第一格那一类（农田/建筑/马路），确认后批量拆 · Esc 取消';

  /* 这行提示就是原来左侧「建造」区底下那句；id 保持不变，
     因为拉马路的时候 renderRoadDragHint 会往它里面写"几格、多少钱" */
  bar.innerHTML = `<div class="tbHint" id="buildHint">${hint}</div>`
    + `<div class="tbRow">${row1}</div>`
    + `<div class="tbRow tbTabs">${tabs}</div>`
    + `<div class="tbRow tbCards">${row2}</div>`;
  syncDockHeight();
}

/**
 * 量一次建造坞的**实际**高度，写进 CSS 变量 --dockH。
 * <p>
 * 坞里三行按钮会随窗口宽度换行，高度不是定值（宽屏 160 出头，窄屏能到 220+），
 * 所以两侧面板的底边、日志和放置条都按这个变量往上让位，而不是各写一个魔法数字 ——
 * 否则坞一换行就会盖住它们（见 CSS 里 :root 的 --dockH）。
 */
function syncDockHeight() {
  const bar = document.getElementById('toolBar');
  /* 坞还没渲染出内容时不动变量（那会儿只有内边距、量出来才十几像素），
     免得把让位高度算成十几像素而让两侧面板糊到屏幕底下 */
  if (bar && bar.children.length) {
    document.documentElement.style.setProperty('--dockH', bar.offsetHeight + 'px');
  }
}

/* ============================================================
   11. 选中与数据同步
   ============================================================ */
function select(sel) {
  S.selected = sel;
  selRing.visible = false;
  hideChopRing();
  if (sel) {
    let x, z, y = TOP_Y + 0.14, fw = 0, fh = 0;
    if (sel.kind === 'cell') {
      [x, z] = cellToWorld(sel.x, sel.z);
      y = TOP_Y + cellH(sel.x, sel.z) + 0.14;
    } else {
      const n = bldNodes.find(b => b.view.id === sel.id);
      if (n) {
        x = n.group.position.x; z = n.group.position.z; y = n.group.position.y + 0.14;
        /* 伐木场：选中即展示它的"林区"（半径同服务端砍伐范围） */
        if (n.view.type === 'LUMBERJACK') showChopRing(x, z);
        /* 选中圈按建筑**实际占地**放大（转向后 w/h 互换）——圈要框住整座建筑，
           不是只圈锚点那一格 */
        const fs = sizeOfRot(n.view.type, n.rot);
        fw = fs.w; fh = fs.h;
      }
    }
    if (x !== undefined) {
      selRing.position.set(x, y, z); selRing.visible = true;
      const base = CELL * 0.55;   // 基准半径 = 圈住 1×1 格
      if (fw) selRing.scale.set((fw * CELL / 2 + 0.24) / base, (fh * CELL / 2 + 0.24) / base, 1);
      else selRing.scale.set(1, 1, 1);
    }
  }
  renderSel(); renderToolBar(); updateFootprint();
}

function syncPlots() {
  (S.plots || []).forEach(p => {
    const t = plotNodes.find(n => n.id === p.id); if (!t) return;
    t.view = p;
    t.tile.material.color.setHex(SOIL[p.state] ?? SOIL.EMPTY);
    const crop = p.crop ? CROP_MAP[p.crop] : null;
    t.target = p.state === 'GROWING' ? Math.min(1, p.progress || 0) : (p.state === 'EMPTY' ? 0 : 1);
    const ripe = p.state === 'RIPE', dead = p.state === 'WITHERED';
    t.plants.forEach(pl => {
      pl.g.visible = p.state !== 'EMPTY';
      pl.head.material.color.setHex(dead ? 0x8d6e63 : ripe ? (crop ? crop.color : 0xffca28) : 0x6ab04c);
      pl.head.material.emissive.setHex(ripe ? 0x4a3a00 : 0x000000);
      pl.stem.material.color.setHex(dead ? 0x6d5747 : ripe ? 0xc9a227 : 0x4c8f3c);
    });
    t.marker.visible = ripe;
  });
}
/**
 * 头顶状态牌：canvas 画一块圆角文字牌贴成 Sprite（始终面向镜头）。
 * 什么时候浮出来由 updateStatusNote 决定 —— 数据没变就不重画画布（快照 3 秒一轮，别白画）。
 */
function makeStatusNote() {
  const cv = document.createElement('canvas');
  cv.width = 640; cv.height = 128;
  const ctx = cv.getContext('2d');
  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, depthWrite: false }));
  sprite.scale.set(2.8, 0.56, 1);
  let last = '';
  return {
    sprite,
    set(text, bg) {
      if (text === last) return;
      last = text;
      ctx.clearRect(0, 0, 640, 128);
      ctx.font = 'bold 52px "Microsoft YaHei", sans-serif';
      const w = ctx.measureText(text).width + 56;
      ctx.fillStyle = bg;
      ctx.beginPath(); ctx.roundRect(320 - w / 2, 18, w, 92, 28); ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(text, 320, 66);
      tex.needsUpdate = true;
    }
  };
}

/** 这座建筑此刻该不该举牌：住宅看所在阶层的满足度，生产建筑看停工原因。都不满足 → 收牌 */
function updateStatusNote(n, v) {
  if (!n.note) return;
  const meta = BLD_MAP[v.type] || {};
  let text = null, bg = 'rgba(160,35,35,.88)';
  if (meta.kind === 'RESIDENCE' && meta.residentTier && S.population) {
    const t = (S.population.tiers || []).find(x => x.tier === meta.residentTier);
    if (t && t.built !== false && (t.satisfaction || 0) < 0.6) {
      const pct = Math.round((t.satisfaction || 0) * 100);
      text = `😠 幸福度 ${pct}%`;
      bg = pct < 30 ? 'rgba(160,35,35,.88)' : 'rgba(150,105,30,.88)';
    }
  }
  if (text == null && n.stall) {                    // 生产建筑（住宅没有 stall 挂件，天然跳过）
    if (v.noWorkers) { text = '😴 未工作 · 缺工人'; bg = 'rgba(150,105,30,.88)'; }
    else if (v.stalled) { text = '⛔ 未工作 · 缺料'; bg = 'rgba(160,35,35,.88)'; }
  }
  if (!text) { n.note.sprite.visible = false; return; }
  n.note.set(text, bg);
  n.note.sprite.visible = true;
}

function syncBuildings() {
  (S.buildings || []).forEach(v => {
    const n = bldNodes.find(b => b.view.id === v.id); if (!n) return;
    n.view = v;                                  // 选中面板渲染用（见 renderSel）
    if (n.stall) n.stall.visible = !!v.stalled && !v.noWorkers;   // 缺料红灯（住宅 / 贸易站没有，n.stall 为 null）
    if (n.idle) n.idle.visible = !!v.noWorkers;   // 缺工人：琥珀色标记，红黄两种停工原因一眼可分
    updateStatusNote(n, v);                       // 头顶状态牌跟着同一份数据走
    if (n.crates) {                               // 待运货堆：门口的木箱，堆得越多越大
      const pend = v.pendingQty || 0;
      n.crates.visible = pend > 0;
      const k = Math.min(1.6, 0.4 + pend / 12);   // 6 件一车 → 满车时约 0.9 倍大小，堆满封顶 1.6
      n.crates.scale.set(k, k, k);
    }
  });
}

/* ============================================================
   马车物流动画：服务端派车时广播 CART_DISPATCHED（带路网 BFS 路径），
   客户端起一辆小车沿路走到港口；CART_ARRIVED 后空车原路返回工厂再收掉。
   纯演出 —— 入库的权威在服务端（CartService.flushIsland），动画只是把"在路上"演出来。
   ============================================================ */
const carts = new Map();          // buildingId -> { group, pts, start, dur, returning }
let cartMatBody = null, cartMatHorse = null, cartMatWheel = null;

function cartMats() {
  if (!cartMatBody) {
    cartMatBody = new THREE.MeshStandardMaterial({ color:0x9a7443, roughness:.85 });
    cartMatHorse = new THREE.MeshStandardMaterial({ color:0x5d4037, roughness:.9 });
    cartMatWheel = new THREE.MeshStandardMaterial({ color:0x3e2f23, roughness:.95 });
  }
  return true;
}

/* 马车真模型（models/CART.glb）：42KB，后台加载 ——
   没到位前先拿程序化方块车顶着，到位后新派的车自动换成模型，正在路上的车不打扰。
   归一化同 loadModel：包围盒缩放到总长 ~1.35（与程序化车一致）、水平居中、贴地。
   false = 探测过且没有/加载失败：以后不再试，永远走程序化车。 */
let CART_PROTO = null;
function ensureCartModel() {
  if (CART_PROTO !== null) return;
  CART_PROTO = undefined;                       // 占位：加载中
  modelLoader.loadAsync(MODEL_DIR + 'CART.glb').then(gltf => {
    const src = gltf.scene;
    /* 朝向修正：解析 glb 顶点分布——马在 -X 端（马腿/辕杆 Z 跨 0.03~0.13）、
       车斗在 +X 端（车轮 Z 跨 0.29~0.31），即马头朝 -X；
       游戏 lookAt 是 +Z 指向行进方向（同 three 非相机约定），转 +90° 把马头对到 +Z。
       旋转要在算包围盒之前，居中偏移才不会算错。 */
    src.rotation.y = Math.PI / 2;
    const box = new THREE.Box3().setFromObject(src);
    const size = box.getSize(new THREE.Vector3());
    src.scale.setScalar(1.35 / (Math.max(size.x, size.z) || 1));
    const box2 = new THREE.Box3().setFromObject(src);
    const c = box2.getCenter(new THREE.Vector3());
    src.position.set(-c.x, -box2.min.y, -c.z);
    src.traverse(o => { if (o.isMesh && o.material) o.material.side = THREE.DoubleSide; });
    const holder = new THREE.Group(); holder.add(src);
    CART_PROTO = holder;
  }).catch(() => { CART_PROTO = false; });
}
window.__annoCartModel = () => CART_PROTO instanceof THREE.Group;   // 调试钩子：马车模型是否就位
window.__annoCartProto = () => {                                    // 调试钩子：马车母本包围盒（验证朝向旋转）
  if (!(CART_PROTO instanceof THREE.Group)) return null;
  const b = new THREE.Box3().setFromObject(CART_PROTO);
  const s = b.getSize(new THREE.Vector3());
  return { x: +s.x.toFixed(3), y: +s.y.toFixed(3), z: +s.z.toFixed(3) };
};

/* 商船真模型（models/SHIP.glb）：36MB 后台加载，就位后 fleet.setShipProto 热替换。
   归一化：总长 5.6（程序化小船 3.8，"大型商船"大一圈才压得住场）、水平居中、
   船底压进吃水线 0.12；船头朝向赌 glb 正面 +Z（同其他模型），不对就整体转半圈。 */
let SHIP_READY = false;
let SHIP_SRC = null;      // 商船模型母本（holder，含吃水偏移）：造船厂的停泊船 clone 用
function ensureShipModel() {
  modelLoader.loadAsync(MODEL_DIR + 'SHIP.glb').then(gltf => {
    const src = gltf.scene;
    src.rotation.y = Math.PI;                     // glb 船头朝 -Z，转半圈对齐程序化船的 +Z 约定
    const box = new THREE.Box3().setFromObject(src);
    const size = box.getSize(new THREE.Vector3());
    src.scale.setScalar(5.6 / (size.z || 1));
    const box2 = new THREE.Box3().setFromObject(src);
    const c = box2.getCenter(new THREE.Vector3());
    /* 船底压到水面下 0.7：水线要切到船壳中部才像"在开船"（0.45 那版用户实锤
       "贴着水面上行驶"——只淹到船底边缘，配合镜面反射就是滑行感）。
       update() 再叠加 draft 0.16 + 浪 —— 水线会随浪在船壳上上下下，这就是"接触" */
    src.position.set(-c.x, -box2.min.y - 0.7, -c.z);
    src.traverse(o => { if (o.isMesh && o.material) o.material.side = THREE.DoubleSide; });
    const holder = new THREE.Group(); holder.add(src);
    fleet.setShipProto(holder);
    SHIP_SRC = holder;                            // 停泊可视化等它就位后 clone（见 14.6.5）
    SHIP_READY = true;
    syncMooredShips();                            // 若舰队已拉到而模型后到，这里补上停泊船
  }).catch(err => { console.warn('SHIP.glb 加载失败，继续用程序化小船', err); SHIP_READY = false; });
}
window.__annoShipModel = () => ({ ready: SHIP_READY, proto: !!fleet.protoSet, ships: fleet.ships.size });

/** 收集马车克隆体里的可动部件，各配一个轴枢（pivot）：
    轮=几何中心（滚动）、马腿=髋部/顶端（前后摆）、马头=颈底（点头）。
    轴枢是新建的 Group，姿态与车身对齐 —— 动画只动 pivot.rotation.x（车身侧向轴），
    跟 Blender 里各部件自己的局部轴无关，导出坐标怎么转都不怕。 */
function collectCartParts(root) {
  const meshes = [];
  root.traverse(o => { if (o.isMesh) meshes.push(o); });
  const grab = (pred, yAt) => meshes.filter(m => pred(m.name.toLowerCase())).map(mesh => {
    const box = new THREE.Box3().setFromObject(mesh);
    const at = new THREE.Vector3((box.min.x + box.max.x) / 2,
      THREE.MathUtils.lerp(box.min.y, box.max.y, yAt), (box.min.z + box.max.z) / 2);
    const pivot = new THREE.Group();
    pivot.position.copy(root.worldToLocal(at.clone()));
    root.add(pivot);
    pivot.attach(mesh);
    const nm = mesh.name.toLowerCase();
    pivot.userData.ph = (nm.includes('fl') || nm.includes('br')) ? 0 : Math.PI;   // 对角小跑：FL+BR 一组
    return pivot;
  });
  return {
    wheels: grab(n => n.startsWith('wheel'), 0.5),
    legs:   grab(n => n.startsWith('leg'),   1.0),
    head:   grab(n => n === 'head',          0.0)[0] || null,
  };
}

function spawnCart(p) {
  if (!S.island || p.islandId !== S.island.id) return;      // 只演自己岛上的车
  if (!cartMats()) return;
  // 起点终点：从快照里的建筑列表拿格子坐标（车事件只带 buildingId）。
  // 目的地按服务端指定的 destId 找（就近仓库派车后可能是小仓库，不再写死贸易站）
  const bld = (S.buildings || []).find(b => b.id === p.buildingId);
  const port = (S.buildings || []).find(b => b.id === p.destId)
    || (S.buildings || []).find(b => b.type === 'TRADING_POST');
  if (!bld || !port || bld.gridX == null || port.gridX == null) return;
  // 途经点：服务端 BFS 出的路网格序列；没带 path（路不连通走直线）就两点直连
  const cells = Array.isArray(p.path) && p.path.length > 1
    ? p.path.map(c => [c[0], c[1]])
    : [[bld.gridX + bld.sizeW / 2, bld.gridZ + bld.sizeH / 2],
       [port.gridX + port.sizeW / 2, port.gridZ + port.sizeH / 2]];
  /* 贴地高度：真模型归一化时轮底已压到 y=0（-box2.min.y），只留 0.02 防与路面 z-fighting；
     程序化方块车的几何中心低，当年留 0.18 的间隙 —— 两套车两套 lift，别混用 */
  const lift = CART_PROTO ? 0.02 : 0.18;
  const pts = cells.map(([gx, gz]) => { const [wx, wz] = cellToWorld(Math.round(gx), Math.round(gz)); return new THREE.Vector3(wx, groundAt(wx, wz) + lift, wz); });

  const g = new THREE.Group();
  if (CART_PROTO) {
    // 真模型：马 + 车 + 轮子整套都在 glb 里，照常沿路径插值、lookAt 朝前
    g.add(CART_PROTO.clone(true));
  } else {
    ensureCartModel();                        // 模型还在加载：程序化车先顶上，下辆车换真的
    // 一匹马 + 一辆车：矮马身、马头、车斗、两只轮子 —— 远看就是"马车"，不追求建模。
    // 朝向约定：lookAt 让 +Z 指向行进方向 → 马头在 +Z（前面拉车），车斗在 -Z（后面被拉）。
    // 车宽收到 0.44/轮距 ±0.24：路中间这条道留给车，NPC 靠两边走（npc.js lane），互不穿模
    const horse = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.26, 0.62), cartMatHorse);
    const head = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.3, 0.16), cartMatHorse);
    head.position.set(0, 0.16, 0.34);
    const body = new THREE.Mesh(new THREE.BoxGeometry(0.44, 0.3, 0.7), cartMatBody);
    body.position.set(0, 0.04, -0.62);
    const wheelGeo = new THREE.CylinderGeometry(0.16, 0.16, 0.08, 10);
    const w1 = new THREE.Mesh(wheelGeo, cartMatWheel); w1.rotation.z = Math.PI / 2; w1.position.set(-0.24, -0.12, -0.62);
    const w2 = w1.clone(); w2.position.x = 0.24;
    g.add(horse, head, body, w1, w2);
  }
  g.position.copy(pts[0]);
  scene.add(g);
  g.updateMatrixWorld(true);   // 轴枢按世界坐标取位，矩阵不刷新会全错位
  // 真模型才有拆件动画：轮/腿/头各就各位（程序化方块车没有这些命名部件）
  const parts = CART_PROTO ? collectCartParts(g) : null;

  // 回程途中同一建筑又派了新车 → 旧车（空返）让位，别漏收
  const prev = carts.get(p.buildingId);
  if (prev) scene.remove(prev.group);
  carts.set(p.buildingId, { group:g, pts, start:performance.now(), dur:Math.max(500, p.durMs || 3000), returning:false,
                            unloadMs:p.unloadMs || 0, stuck:false, parts, prev:g.position.clone() });
}

function despawnCart(buildingId) {
  const c = carts.get(buildingId);
  if (!c) return;
  scene.remove(c.group);
  carts.delete(buildingId);
}

/** 到港卸货：停 1.4 秒，然后空车把路径倒着走回工厂，走完自收 */
function returnCart(buildingId) {
  const c = carts.get(buildingId);
  if (!c || c.returning) return;          // 没车 / 已经在回程（重复 ARRIVED）→ 忽略
  c.pts = c.pts.slice().reverse();
  c.start = performance.now() + 1400;     // start 在未来 → tick 里 t<0 当"港口停留"
  c.returning = true;
}

/** 每帧推进所有在途马车：沿途经点按长度插值。
    去程 t>=1 = 到站停车等 ARRIVED（服务端卸货 depot-unload-seconds 后才广播，车正好停在门口）；
    兜底收车的时间要给卸货留出余量（unloadMs），stuck（满仓滞留）的车永远等 ARRIVED；
    回程 t>=1 = 到厂收车 */
function tickCarts() {
  const now = performance.now();
  for (const [id, c] of carts) {
    const t = (now - c.start) / c.dur;
    if (t < 0) continue;                              // 港口卸货停留中
    if (t >= 1 && c.returning) { despawnCart(id); continue; }
    const bail = 2.5 + c.unloadMs / c.dur;            // 兜底：行程 ×2.5 再加上卸货窗口
    if (t >= bail && !c.stuck) { despawnCart(id); continue; }   // 去程丢事件兜底
    const segs = c.pts.length - 1;
    const f = Math.min(t, 1) * segs;                  // 去程到站后钳在终点停车
    const i = Math.min(segs - 1, Math.floor(f));
    c.group.position.lerpVectors(c.pts[i], c.pts[i + 1], f - i);
    c.group.lookAt(c.pts[Math.min(segs, i + 1)]);
    /* 拆件动画：本帧位移驱动 —— 车轮按里程自转（ω = v/r，方向：前进时轮顶向前）、
       马腿对角小跑（FL+BR 与 FR+BL 反相）、马头随步点头、车身随步微颠。
       全部用"走了多远"而不是"过了多久"驱动，车速/回程/暂停自动同步，不会腿跟不上车。 */
    const P = c.parts;
    if (P) {
      const dist = c.group.position.distanceTo(c.prev);
      c.prev.copy(c.group.position);
      if (dist > 1e-4) {
        c.phase = (c.phase || 0) + dist * 7;          // 步频：每世界单位 7 rad（≈1.35 长的车 1.5 步/秒 @1格/0.3s）
        for (const w of P.wheels) w.rotation.x -= dist / 0.16;
        for (const l of P.legs)   l.rotation.x = Math.sin(c.phase + l.userData.ph) * 0.45;
        if (P.head) P.head.rotation.x = Math.sin(c.phase) * 0.09;
        c.group.position.y += Math.abs(Math.sin(c.phase)) * 0.02;
      } else {
        // 停车（到站卸货/满仓滞留）：腿慢慢归位、头回正，别定在半空怪姿势
        for (const l of P.legs) l.rotation.x *= 0.85;
        if (P.head) P.head.rotation.x *= 0.85;
      }
    }
  }
}
window.__annoCarts = () => carts.size;   // 调试钩子：无头脚本等"车在路上"时截图用
window.__annoCartSpawn = spawnCart;      // 调试钩子：无头脚本伪造派车、验证动画用
window.__annoCartReturn = returnCart;    // 调试钩子：无头脚本直接触发回程验证用

         v.noWorkers ? '⚠️ 缺工人停工' : v.stalled ? '⛔ 停工' : '运转中'}</span></div>
       <button class="gold" data-upgrade="${v.id}" style="width:100%;margin-top:6px">升级（${meta.cost * v.level} 金）</button>` : ''}
       <button data-rotate="${v.id}" style="width:100%;margin-top:6px">旋转 90°（原地转，横摆 ↔ 竖摆）</button>
       <button class="danger" data-demolish="${v.id}" style="width:100%;margin-top:6px">拆除（返还 ${(meta.cost * 0.5).toFixed(0)} 金，腾出 ${w * h} 格）</button>`;
    return;
  }

  const { x, z } = sel;
  const road = hasRoad(x, z);
  const bld = bldCells.get(keyOf(x, z));
  const crop = plotCells.get(keyOf(x, z));
  /* 空地也要说清"这里是什么"：树 / 成长中的树苗 / 身边正好站着的小动物 */
  const cellKey = keyOf(x, z);
  const faunaHere = (!road && !bld && !crop) ? nearestFauna(x, z) : null;
  const badge = road ? '🛣️ 马路' : bld ? '🏭 建筑用地' : crop ? '🌾 作物'
    : regrowQueue.has(cellKey) ? '🌱 树苗成长中'
    : treeCells.has(cellKey) ? '🌳 树木'
    : faunaHere || '🌿 空地';
  let h = `<div class="row"><span>格子 (${x}, ${z})</span><span>${badge}</span></div>`;

  /* 这一格种着东西：显示作物状态 + 收获 / 清理 */
  if (crop) {
    const name = { EMPTY:'空地', GROWING:'生长中', RIPE:'已成熟', WITHERED:'已枯萎' }[crop.state];
    if (crop.cropLabel) h += `<div class="row"><span>作物</span><span>${crop.cropLabel}</span></div>`;
    h += `<div class="row"><span class="muted">状态</span><span>${name}</span></div>`;
    if (crop.state === 'GROWING')
      h += `<div class="bar"><i style="width:${(crop.progress * 100).toFixed(1)}%"></i></div>
            <div class="row"><span class="muted">进度</span><span>${(crop.progress * 100).toFixed(0)}%</span></div>
            <div class="muted" style="font-size:11.5px;margin-top:4px">成熟后自动入库并原地重种下一茬，不用手动收</div>`;
    if (crop.state === 'RIPE')
      h += `<div class="row"><span>预计产量</span><span>${crop.plannedYield}</span></div>
            <button class="gold" data-harvest="${crop.id}" style="width:100%;margin-top:8px">收获（+${crop.plannedYield}）</button>`;
    if (crop.state === 'WITHERED')
      h += `<button class="danger" data-clear="${crop.id}" style="width:100%;margin-top:8px">清理这一格</button>`;
    box.innerHTML = h; return;
  }

  if (road) {
    const links = [[1,0],[-1,0],[0,1],[0,-1]].filter(([dx, dz]) => hasRoad(x + dx, z + dz)).length;
    const shape = ['孤立场', '尽头', '直路', 'T 字路口', '十字路口'][links];
    const kind = ROAD_KIND(roadKindMap.get(keyOf(x, z)));
    h += `<div class="row"><span class="muted">路面</span><span>${kind.label}（${kind.cost}金/格）</span></div>`;
    h += `<div class="row"><span class="muted">路口形态</span><span>${shape}（${links} 向）</span></div>`;
    h += `<div class="row"><span class="muted">连通路网</span><span>${roadNetworkSize(x, z)} 格</span></div>`;
    h += `<button class="danger" data-unroad="1" style="width:100%;margin-top:8px">拆除${kind.label}（返还 ${(kind.cost / 2).toFixed(0)} 金）</button>`;
    box.innerHTML = h; return;
  }
  if (bld) {
    const bv = (S.buildings || []).find(b => b.id === bld);
    const bw = (bv && bv.sizeW) || 1, bh2 = (bv && bv.sizeH) || 1;
    const meta = (bv && BLD_MAP[bv.type]) || {};
    h += `<div class="muted" style="font-size:11.5px;margin-top:4px">
      被「${meta.label || '建筑'}」占着（占地 ${bw}×${bh2} 格，锚点 ${bv ? bv.gridX : '-'}, ${bv ? bv.gridZ : '-'}），点建筑可升级 / 拆除</div>`;
    box.innerHTML = h; return;
  }

  /* 空格子：只报"这一格本身是什么"，不弹任何建造相关的东西。
     建造卡常驻在底部工具条上（#toolBar，见 renderToolBar）——点一下拿在手里，再点到岛上放下。 */
  if (regrowQueue.has(cellKey)) {
    const e = regrowQueue.get(cellKey);
    const leftMin = Math.max(1, Math.ceil((e.endMs - Date.now()) / 60000));
    h += `<div class="muted" style="font-size:11.5px;margin-top:4px">被砍过的格子正在补种，约 ${leftMin} 分钟后长回成树</div>`;
  } else if (treeCells.has(cellKey)) {
    h += `<div class="muted" style="font-size:11.5px;margin-top:4px">森林的一角：伐木场会来砍，砍完原地补种（约 10 分钟长回）</div>`;
  } else if (faunaHere) {
    h += `<div class="muted" style="font-size:11.5px;margin-top:4px">正好有一只小动物站在这格附近</div>`;
  }
  if (isCoastCell(x, z)) {
    h += `<div class="muted" style="font-size:11.5px;margin-top:6px;color:var(--gold)">`
       + `这一格是<b>海岸带</b>（岛最外 ${COAST} 圈沙滩）</div>`;
  }
  box.innerHTML = h;
}

/** 离这格最近的小动物（1.2 格内算"站在这"），返回它的名字；没有则 null */
function nearestFauna(x, z) {
  const [wx, wz] = cellToWorld(x, z);
  let best = null, bd = 1.2 * CELL;
  for (const list of [sheep, deer, bears]) {
    for (const a of list) {
      const d = Math.hypot(a.g.position.x - wx, a.g.position.z - wz);
      if (d < bd) { bd = d; best = a; }
    }
  }
  return best ? best.label : null;
}

/**
 * 建造门槛（与服务端 {@code ProductionService.requireUnlock} 同一套规则）。
 * <p>
 * 【2026-09-25 泛化】以前只有住宅被卡（"先有贸易站 / 农夫够不够"）。接进全表之后
 * 每一层业态都有自己的门槛：整份工人业态要农夫住够 120、工匠业态要工人住够 200……
 * 所以这里改成"任意建筑都可能被卡"，门槛挂在哪个阶层由服务端下发的
 * requiredTier / requiredPopulation 决定 —— 客户端与服务端因此永远对得上账。
 */
function buildGate(type) {
  const meta = BLD_MAP[type];
  if (!meta) return null;
  const pop = S.population;
  if (isResidence(type)) {
    const hasPost = pop ? pop.hasTradingPost : (S.buildings || []).some(b => b.type === 'TRADING_POST');
    if (!hasPost) return '先在岛上建一座贸易站：居民的生活物资要从港口运进来，没有港口没人肯搬来';
  }
  const req = meta.requiredTier, need = meta.requiredPopulation || 0;
  if (req && need > 0) {
    const have = tierPop(req);
    if (have < need) return `需要岛上先住够 ${need} 名${TIER_LABEL[req] || req}（现在 ${have} 名）`
      + ` —— 先把这一层的人口堆起来`;
  }
  return null;
}

/** 兼容旧调用：老代码按名字把住宅门槛读出来（语义已扩到全部建筑） */
const residentGate = buildGate;

/** 岛上某个阶层现有人口（人口面板没拿到就退回 0） */
function tierPop(tier) {
  const t = S.population && (S.population.tiers || []).find(x => x.tier === tier);
  return t ? t.population : 0;
}

/** 岛上现有农夫人口 */
function farmerCount() { return tierPop('FARMER'); }

/* 【岛上居民面板已删】（纪元 1800 左侧没有常驻人口面板）：总人口/满足度/缺货
   平时不再常驻左栏 —— 房子幸福度由头顶状态牌表达（😠 幸福度 XX%），
   点住宅建筑看工人与产能。S.population 仍是状态牌的数据源，保留不删。 */

async function openTradeDialog(good) {
  const m = (S.market || []).find(x => x.good === good);
  if (!m) return;
  const qty = prompt(`${m.label}　市价 ${m.price.toFixed(2)}\n买入价 ${(m.price * 1.02).toFixed(2)} / 卖出价 ${(m.price * 0.98).toFixed(2)}\n\n输入数量（正数买入，负数卖出）：`, '10');
  if (qty === null) return;
  const q = parseInt(qty, 10);
  if (!q) return;
  try {
    const side = q > 0 ? 'buy' : 'sell';
    const r = await api('/api/market/' + side, 'POST', { playerId:S.playerId, good, quantity:Math.abs(q) });
    toast(`${side === 'buy' ? '买入' : '卖出'} ${r.label} ×${r.quantity}，${side === 'buy' ? '-' : '+'}${money(r.total)} 金`, 'good');
    await Promise.all([refreshPlayer(), refreshStock()]);
  } catch (e) { toast(e.message, 'bad'); }

function logLine(text, hot) {
  const box = document.getElementById('log');
  const d = document.createElement('div');
  if (hot) d.className = 'hot';
  d.textContent = new Date().toLocaleTimeString('zh-CN', { hour12:false }) + '  ' + text;
  box.prepend(d);
  while (box.children.length > 120) box.lastChild.remove();   // 历史留 120 条，靠滚动条翻
}
/* Toast 会**合并同文**：划田种 20 株土豆，服务端就逐株广播 20 条 CROP_PLANTED，
   逐条弹就是用户截图里那一竖列"播种 POTATO"。同一句话在显示中的，只把计数 ×N 往上跳，
   不再新开一条 —— 修路 / 收获 / 下线掉线的连发事件也一并被这兜住。 */
const toastLive = new Map();                     // text -> { el, n, timer }
function toast(text, kind) {
  if (kind === 'bad') playSfx('bad');            // 报错低鸣（交易失败 / 建造校验不过…）
  const box = document.getElementById('toasts');
  const hit = toastLive.get(text);
  if (hit) {                                     // 已有同文 toast：合并，×N 计数
    hit.n++;
    hit.el.textContent = text + (hit.n > 1 ? ` ×${hit.n}` : '');
    clearTimeout(hit.timer);
    hit.timer = setTimeout(() => { hit.el.remove(); toastLive.delete(text); }, 2600);
    return;
  }
  const d = document.createElement('div');
  d.className = 'toast ' + (kind || '');
  d.textContent = text;
  box.appendChild(d);
  const rec = { el: d, n: 1, timer: 0 };
  rec.timer = setTimeout(() => { d.remove(); toastLive.delete(text); }, 2600);
  toastLive.set(text, rec);
}

/* ============================================================
   13. 数据刷新
   —— 分两层：applyXxx(data) 只负责"把手里这份数据画上去"，
      refreshXxx() = 拉一次 HTTP 再交给 applyXxx。
      联机时的主路径是服务端推来的快照（applySnapshot 复用同一批 applyXxx），
      HTTP 只留给"玩家刚操作完要立刻看到结果"和"断线兜底"。
   ============================================================ */

/** 最后一次收到**个人快照**的时刻：用来判断"推送这条路还活着吗"（见 enter 里的兜底轮询） */
let lastSnapAt = 0;

function applyPlayer(p) {
  if (!p) return;
  S.name = p.name; S.treasury = p.treasury; S.reputation = p.reputation;
  renderHud(); renderSel(); renderToolBar();
}
async function refreshPlayer() { applyPlayer(await api(`/api/players/${S.playerId}`)); }

function applyIslands(list) {
  if (!list || !list.length) return;
  S.islands = list;
  const switched = !S.island || S.island.id !== list[0].id;
  S.island = list[0];
  GRID = S.island.gridSize; LAND_R = (GRID - 1) / 2;
  /* 海岸带宽度必须跟服务端同口径（`anno.coast-width`）：它决定沙滩画在哪、
     也决定"贸易站能不能放在这一格"——两边各写一个常量迟早会打架。 */
  /* 地形串必须先落地：isLandCell / isCoastCell / atCell 全部读它，
     下面那句 buildIslandMesh() / buildGrid() 就是照它拼岛、上色、判可建性的。
     不赋值的话 terrain 是空串，atCell 会兜底成"整片平原"，岛就永远是那个大方块。 */
  terrain = S.island.terrain || '';
  cellHCache.clear();                     // 地形换了，台地高度缓存全部作废
  COAST = S.island.coastWidth ?? 1;
  ROAD_COST = S.island.roadCost; PLOT_LIMIT = S.island.plotLimit;
  if (switched) {                       // 换岛：整个场景重建
    S.treeChops = null;                 // 树账跟着岛换：等 refreshTreeChops 拉新账再重建森林
    regrowQueue.clear();                // 上一座岛的树苗队列一并作废
    buildIslandMesh(); buildGrid(); buildPlots([]);
    dist = GRID * CELL * 1.5; updateCamera();
    syncNpcs();                         // 换岛 = 居民全换一批（sync 内部按 islandId 清空重来）
    initFauna();                        // 小动物也是岛的一部分：海鸥 / 羊 / 跳鱼跟着岛重建
    /* 游戏时刻对表：服务端按**岛屿模拟时钟**算出"这座岛现在几点"（与商船/作物同一条
       时间线，离线停摆、重启续走），进游戏从这里接着走 —— 不再客户端写死早上 7 点。
       只在换岛时对一次：之后本地照同速率推进、快照不回拨，"跳到早晨"按钮和
       测试里强制时刻（__annoNpcWorld.clock.hour=…）才不会被 3 秒后的快照冲掉。 */
    if (npcWorld && Number.isFinite(S.island.clockHour)) {
      npcWorld.setServerClock(S.island.clockHour, S.island.clockDaySeconds);
    }
  }
}
async function refreshIslands() {
  let list = await api(`/api/islands?playerId=${S.playerId}`);
  if (!list.length)                   // 新玩家名下还没有岛，先建一座
    list = [await api('/api/islands', 'POST', { playerId:S.playerId, name:S.name + '的主岛' })];
  applyIslands(list);
}

/** 树账：服务端的砍伐记录（[x, z, 复育时刻]；复育时刻已过的格子视为树已长回）。
    必须在任何 buildTrees 之前就位 —— 进岛流程里排在 refreshRoads/refreshBuildings
    （它们会触发 buildTrees）之前 */
async function refreshTreeChops() {
  if (!S.island) return;
  const info = await api(`/api/islands/${S.island.id}/trees`);
  const now = Date.now();
  S.treeChops = new Map();
  for (const c of (info.chopped || [])) {
    if ((c[2] || 0) > now) S.treeChops.set(c[0] + ',' + c[1], c[2]);   // 只留未复育的
  }
  rebuildRegrowQueue();               // 重连 / 换岛：成长中的树苗从账里恢复
}

function applyPlots(list) {
  if (!S.island) return;
  const sig = list.map(p => p.id + '@' + p.cellX + ',' + p.cellZ).join('|');
  const old = (S.plots || []).map(p => p.id + '@' + p.cellX + ',' + p.cellZ).join('|');
  S.plots = list;
  if (sig !== old) {                    // 有作物新增 / 消失：只重建农田和树
    /* 旧版这里连 buildGrid / buildRoads / buildBuildings 一起全量重建 ——
       批量种完那一瞬间的"卡一下"主要就是它：14400 格的地面网格、全部马路、
       全部建筑挨个重画一遍。而作物不改变地砖 / 马路 / 建筑的任何状态，
       重建它们纯属浪费 —— 只重画农田本身 + 让树重新避开新田就够了。 */
    buildPlots(list); buildTrees();
  }
  syncPlots(); buildTrees();
  if (S.selected) renderSel();
}
async function refreshPlots() {
  if (!S.island) return;
  applyPlots(await api(`/api/islands/${S.island.id}/plots`));
}

function applyRoads(list) {
  if (!S.island) return;
  const sig = (l) => (l || []).map(r => r.cellX + ',' + r.cellZ).sort().join('|');
  const changed = sig(list) !== sig(S.roads);
  S.roads = list;
  if (changed) {            // 路网变了才重建（马路轮廓要看四邻；建筑顺带重建一次保持画面一致）
    buildRoads(); buildBuildings(S.buildings); buildTrees();
  }
  syncBuildings();
  if (S.selected) { renderSel(); renderToolBar(); }
  updateFootprint();
  syncNpcs();               // 路网变了 → 路径缓存作废、居民重新规划路线（sync 内部判 roadSig）
}
async function refreshRoads() {
  if (!S.island) return;
  applyRoads(await api(`/api/roads?islandId=${S.island.id}`));
}

function applyBuildings(list) {
  if (!S.island) return;
  /* 签名要带上朝向与旋转后的占地：手动转 90° 之后 gridX/gridZ 可能没变，
     但那块地和模型必须重建，否则画面还停在旧朝向上 */
  const sigOf = (l) => l.map(b => `${b.id}:${b.gridX},${b.gridZ}:${b.sizeW}x${b.sizeH}:${b.rotation || 0}`).join('|');
  const sig = sigOf(list), old = sigOf(S.buildings);
  S.buildings = list;
  if (sig !== old || bldNodes.length !== list.length) {
    buildBuildings(list); buildTrees();
  }
  syncBuildings();
  if (S.selected) renderSel();
  updateFootprint();          // 占地变了 → 手里那件东西"还能不能放"要重判
  syncNpcs();                 // 住宅/厂房/面包房增减 → 居民重新配"住哪、去哪上班、去哪买东西"
  syncLumberCrew();           // 伐木场增减 / 工人变化 → 伐木工上班、下班、遣散
}

/* ---- 商船 ----
   服务端只告诉我们"这趟走到哪了"（phaseMs / cycleMs），船实际在哪由客户端算
   （见 jsm/ships.js）。所以船是连续航行的，而快照 3 秒才来一次 ——
   不为画面流畅加密推送，这是上一轮"降推送"定下的规矩。 */
function applyShips(list) {
  if (!S.island) return;
  S.ships = list || [];
  fleet.sync(buildShipRoutes(S.ships));
  if (S.selected) renderSel();
}
/**
 * 把服务端的"港口建筑"翻译成"航线"：出海口 = 港口朝海那一侧的中点。
 * 服务端建港口时已经按"哪边水多"挑好了朝向（seaFirstRotations），这里直接信它。
 */
function buildShipRoutes(list) {
  const out = [];
  for (const s of list) {
    const b = (S.buildings || []).find(x => x.id === s.harborId);
    if (!b || b.gridX == null || b.gridZ == null) continue;
    const rot = ((b.rotation || 0) * Math.PI) / 180;
    const dirX = Math.sin(rot), dirZ = Math.cos(rot);          // 大门朝向 = 出海方向
    const w = b.sizeW || 3, h = b.sizeH || 3;
    const [cx, cz] = cellToWorld(b.gridX + (w - 1) / 2, b.gridZ + (h - 1) / 2);
    const half = (Math.abs(dirX) > 0.5 ? w : h) * CELL / 2;    // 朝海那一边离中心多远
    out.push({ ...s, x: cx + dirX * (half + 0.6), z: cz + dirZ * (half + 0.6), dirX, dirZ });
  }
  return out;
}
async function refreshShips() {
  if (!S.island) return;
  applyShips(await api(`/api/islands/${S.island.id}/ships`));
}


function applyPopulation(pop) {
  if (!S.island) return;

  (S.buildings || []).forEach(v => {

    if (n && (BLD_MAP[v.type] || {}).kind === 'RESIDENCE') updateStatusNote(n, v);
  });
  syncNpcs();                 // 人口涨落 = 街上人多人少（这是 NPC 数量唯一的来源）
}

/**
 * 应用服务端推来的个人快照 —— 联机时的**主路径**（对应服务端 Views.PlayerSnapshot）。
 * <p>
 * 服务端每 3 秒把"我这座岛上的一切"整体推过来，这里逐个交给 applyXxx 画上去。
 * 不用怕"整份重画"会比原来轮询贵：每块数据的签名比对都在 applyXxx 里，
 * 没变的那几块本来就不会重建画面（重建 three.js 网格才是真开销）。
 * <p>
 * 好处是客户端再也不用"猜"什么变了：没有 5 个 setInterval，也没有收到事件就回拉。
 */
function applySnapshot(snap) {
  if (!snap) return;
  lastSnapAt = Date.now();
  applyPlayer(snap.me);
  /* 还没有岛（首次进入、快照比建岛早一步）：走一次 HTTP 把岛建出来，下一份快照就正常了 */
  if (!snap.island) { refreshIslands().catch(() => {}); return; }
  applyIslands([snap.island]);
  applyRoads(snap.roads || []);
  applyBuildings(snap.buildings || []);
  /* 商船必须排在建筑之后：航线要读港口的 gridX/gridZ 与朝向 */
  applyShips(snap.ships || []);
  applyPlots(snap.plots || []);
  applyPopulation(snap.population);
  applyStock(snap.stock || []);
  renderHud(); renderSel(); renderToolBar();
}

async function refreshAll() {
  await refreshPlayer();
  await refreshIslands();
  await refreshTreeChops();     // 树账先就位：后面的路 / 建筑刷新都会触发 buildTrees，已砍的格子不能长出来
  await refreshRoads();
  await refreshBuildings();
  await refreshShips();
  await refreshPlots();
  await Promise.all([refreshStock(), refreshOffers()]);
  await refreshPopulation();
  await refreshFleetData();          // 舰队：远征选船 + 港口停泊船都要用
  syncMooredShips();
  renderHud(); renderSel(); renderToolBar();
}

  else if (t.dataset.rotate) {

      const r = await api(`/api/buildings/${t.dataset.rotate}/rotate`, 'POST', { playerId:S.playerId });
      toast(`已转到朝${ROT_LABEL[r.rotation]}（占 ${r.sizeW}×${r.sizeH} 格）`, 'good');
      await refreshBuildings();
      select({ kind:'building', id:r.id });
    } catch (err) { toast(err.message, 'bad'); }
  }
  else if (t.dataset.demolish) {
    try {
      const r = await api(`/api/buildings/${t.dataset.demolish}?playerId=${S.playerId}`, 'DELETE');
      toast(`${r.label} 已拆除，返还 ${money(r.refund)} 金，腾出 ${r.sizeW * r.sizeH} 格`, 'good');
      select(null);
      await refreshBuildings(); await refreshPlayer();
    } catch (err) { toast(err.message, 'bad'); }
  }
  else if (t.dataset.upgrade) {
    try {
      await api(`/api/buildings/${t.dataset.upgrade}/upgrade`, 'POST', { playerId:S.playerId });
      toast('建筑已升级', 'good');
      await refreshBuildings(); await refreshPlayer();

/* ============================================================
   14.6 远征探险：组建远征队 → 航行 → 途中事件抉择 → 结算 / 图鉴
   数据流：开弹层 / 收到 WS "expedition" 推送时拉一次列表；
   事件卡是独立遮罩 —— 弹层关着也会弹出来（原作式"航行中的抉择"），
   30 游戏秒不选，服务端自动走 0 号保守项（不暂停游戏）。
   骷髅岛是固定三连事件（雾墙 → 骸骨海岸 → 峡谷巨猿），
   通关点亮图鉴「骷髅岛 / 金刚神像」并带回传说奖励。
   ============================================================ */
const EXP_DEFS = {
  GREEN_ISLES: { label:'绿屿群礁', coin:1200, goods:'烈酒 ×8 · 面包 ×10',
    desc:'常规探险航线，找回礼与航海图。人口 50 + 贸易站解锁。' },
  SKULL_ISLAND:{ label:'🦍 骷髅岛', coin:4000, goods:'烈酒 ×25 · 面包 ×30 · 啤酒 ×15',
    desc:'传说航线：雾墙、骸骨海岸与峡谷巨猿。通关点亮图鉴、带回金刚神像。' },
};
const EXP_STATUS_LABEL = { VOYAGING:'航行中', EVENT:'待抉择', DONE:'已归来', FAILED:'失败' };
const expS = { list:[], disc:[], chosen:'GREEN_ISLES', card:null, cardT:0, poll:null, tick:null };

async function expApi(path, method, body) {
  const r = await fetch('/api/expeditions' + path, { method: method || 'GET',
    headers: { 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined });
  const j = await r.json().catch(() => ({}));
  if (!r.ok || (j.ok === false)) throw new Error(j.message || ('HTTP ' + r.status));
  return j.data;
}

async function refreshExpeditions() {
  if (!S.playerId) return;
  try {
    expS.list = (await expApi('?playerId=' + S.playerId)) || [];
    expS.disc = (await expApi('/discoveries?playerId=' + S.playerId)) || [];
    await refreshFleetData();                          // 组建表单要列出本岛闲置的船
    renderExpeditions();
    syncMooredShips();
  } catch (e) { /* 弹层没开时静默，开了才提示 */ if (document.getElementById('expMask').classList.contains('show')) toast('远征列表拉取失败：' + e.message, 'bad'); }
}

function renderExpeditions() {
  /* 组建区：目的地二选一 + 队名 + 启航按钮 */
  const c = document.getElementById('expCreate');
  /* 出发用船：一艘闲置船 = 一条远征名额（造船厂造出来的就是它） */
  const idleShips = ((shipS.fleet && shipS.fleet.ships) || [])
    .filter(s => S.island && s.islandId === S.island.id && s.state === 'IDLE');
  c.innerHTML = Object.entries(EXP_DEFS).map(([k, d]) => `
    <div class="expDest${expS.chosen === k ? ' on' : ''}" data-dest="${k}">
      <div><b>${d.label}</b> <span class="cost">¥${money(d.coin)} · ${d.goods}</span></div>
      <div class="cost">${d.desc}</div>
    </div>`).join('') +
    `<div style="display:flex;gap:8px;margin:8px 0 4px">
      <select id="expShip" style="flex:1" title="出发用的船">${
        idleShips.map(s => `<option value="${s.id}">⛵ ${s.typeLabel}（闲置停泊）</option>`).join('')
        || '<option value="">🚫 无闲置船 —— 先去造船厂造一艘</option>'}</select>
      <input id="expName" placeholder="远征队名（可留空）" style="flex:1">
      <button id="expLaunch">组建并启航</button>
    </div>`;
  c.querySelectorAll('.expDest').forEach(el => el.addEventListener('click', () => {
    expS.chosen = el.dataset.dest; renderExpeditions();
  }));
  c.querySelector('#expLaunch').addEventListener('click', async () => {
    if (!S.island) { toast('先建岛再组建远征队', 'bad'); return; }
    const shipSel = c.querySelector('#expShip').value;
    if (!shipSel) { toast('没有闲置的船 —— 先在造船厂造一艘（点岛上的造船厂）', 'bad'); return; }
    try {
      await expApi('', 'POST', { playerId: S.playerId, islandId: S.island && S.island.id,
        destination: expS.chosen, name: c.querySelector('#expName').value, shipId: +shipSel });
      toast('🧭 远征队已启航', 'good'); refreshExpeditions();
    } catch (e) { toast(e.message, 'bad'); }
  });

  /* 列表区 */
  const rows = expS.list.slice(0, 8).map(v => {
    const pending = v.status === 'EVENT';
    return `<div class="expRow" data-id="${v.id}">
      <div><b>${v.name}</b><span class="expBadge ${v.status}">${EXP_STATUS_LABEL[v.status] || v.status}</span>
        <span class="meta" style="float:right">${v.destinationLabel}</span></div>
      <div class="bar"><i style="width:${Math.min(100, v.progress).toFixed(1)}%"></i></div>
      <div class="meta"><span>航程 ${Math.round(v.progress)}%</span>
        <span>⚔ 士气 ${Math.round(v.morale)}</span><span>🍖 补给 ${Math.round(v.supplies)}</span></div>
      ${pending ? `<button class="expEventBtn" style="margin-top:6px" data-id="${v.id}">⚖ 处理事件：${v.eventTitle}</button>` : ''}
      ${v.reward ? `<div class="cost" style="margin-top:5px">${v.reward}</div>` : ''}
    </div>`;
  }).join('');
  document.getElementById('expList').innerHTML =
    `<h3 style="margin:12px 0 4px;font-size:13px">远征日志</h3>` + (rows || `<div class="cost">还没有远征队出海</div>`);

  document.querySelectorAll('.expEventBtn').forEach(b =>
    b.addEventListener('click', () => { const v = expS.list.find(x => x.id == b.dataset.id); if (v) openExpeditionCard(v); }));

  /* 图鉴区 */
  document.getElementById('expDiscBox').innerHTML = expS.disc.length
    ? `<h3 style="margin:12px 0 2px;font-size:13px">🗺 探险图鉴（${expS.disc.length}）</h3>` +
      expS.disc.map(d => `<div class="expDisc"><b>${d.label}</b><span class="cost">${d.desc}</span></div>`).join('')
    : '';
}

/* 事件卡：独立遮罩弹出，倒计时归零前不选就交给服务端的保守项 */
function openExpeditionCard(v) {
  if (!v || v.status !== 'EVENT') return;
  expS.card = v; expS.cardT = v.choiceLeft;
  document.getElementById('expCardTitle').textContent = '⚓ ' + v.eventTitle;
  document.getElementById('expCardText').textContent = v.eventText;
  document.getElementById('expCardStats').innerHTML =
    `<span>⚔ 士气 <b>${Math.round(v.morale)}</b>/100</span><span>🍖 补给 <b>${Math.round(v.supplies)}</b>/100</span>`;
  const opts = document.getElementById('expCardOpts');
  opts.innerHTML = '';
  v.options.forEach((o, i) => {
    const b = document.createElement('button');
    const deltas = [];
    if (o.morale) deltas.push('士气 ' + (o.morale > 0 ? '+' : '') + o.morale);
    if (o.supplies) deltas.push('补给 ' + (o.supplies > 0 ? '+' : '') + o.supplies);
    b.innerHTML = `${o.label}<small>${o.hint}${deltas.length ? ' · ' + deltas.join(' · ') : ''}${o.needMorale > 0 ? ' · 需要士气 ' + o.needMorale : ''}</small>`;
    b.disabled = !o.needOk || !o.affordable;
    b.addEventListener('click', () => expChoose(i));
    opts.appendChild(b);
  });
  document.getElementById('expCardMask').classList.add('show');
  updateCardTimer();
  if (expS.tick) clearInterval(expS.tick);
  expS.tick = setInterval(() => {                       // 本地显示倒计时（服务端才是真判官）
    expS.cardT = Math.max(0, expS.cardT - 1);
    updateCardTimer();
    if (expS.cardT <= 0) clearInterval(expS.tick);
  }, 1000);
}
function updateCardTimer() {
  const v = expS.card;
  const total = 30;
  document.querySelector('#expCardTimer i').style.width = Math.min(100, expS.cardT / total * 100) + '%';
}

async function expChoose(i) {
  const v = expS.card;
  if (!v) return;
  try {
    await expApi('/' + v.id + '/choice', 'POST', { playerId: S.playerId, optionIndex: i });
    closeExpeditionCard();
    toast('⚓ 船队执行了命令', 'good');
    refreshExpeditions();
  } catch (e) { toast(e.message, 'bad'); }
}
function closeExpeditionCard() {
  document.getElementById('expCardMask').classList.remove('show');
  expS.card = null;
  if (expS.tick) { clearInterval(expS.tick); expS.tick = null; }
}

/* WS 推送入口（game.html 顶部 ws.onmessage 分发到这里） */
function onExpeditionPush(d) {
  const v = d.expedition;
  if (!v) return;
  if (d.kind === 'event') {
    playSfx('alert'); logLine('🧭 远征事件：' + v.eventTitle, true);
    refreshExpeditions();
    openExpeditionCard(v);                              // 自动弹事件卡（不暂停游戏，30s 倒计时）
  } else if (d.kind === 'resolved') {
    const ok = v.status === 'DONE';
    playSfx(ok ? 'ok' : 'alert');
    toast(v.reward || (ok ? '远征归来' : '远征失败'), ok ? 'good' : 'bad');
    logLine('🧭 ' + v.name + '：' + (v.reward || v.status), ok);
    if (expS.card && expS.card.id === v.id) closeExpeditionCard();
    refreshExpeditions();
  } else {
    playSfx('ship');
    logLine('🧭 ' + v.name + ' 从港口启航，目的地：' + v.destinationLabel, true);
    refreshExpeditions();
  }
}

/* 调试 / 验证钩子 */
